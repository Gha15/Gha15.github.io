<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Calendar - Matrix The Math Club</title>
    
    <!-- Stylesheets & Fonts -->
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Vibur&display=swap" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calendar-container">
        <!-- Calendar Navigation Header -->
        <div class="calendar-header">
            <button id="prev-btn">&lt;</button>
            <h2 id="month-year-display"></h2>
            <button id="next-btn">&gt;</button>
        </div>

        <!-- Days of the Week Grid Labels -->
        <div class="weekdays-grid">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <!-- Dynamic Days Grid Injected by JavaScript -->
        <div id="days-grid" class="days-grid"></div>
    </div>

</body>
</html>
