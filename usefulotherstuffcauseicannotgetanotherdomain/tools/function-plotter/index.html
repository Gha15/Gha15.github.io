<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Math Club - Function Plotter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="control-panel">
            <h2>Graphing Tool</h2>
            
            <div class="mode-select">
                <label for="mode">Choose Mode:</label>
                <select id="mode">
                    <option value="equation">Slope-Intercept (y = mx + b)</option>
                    <option value="point-slope">Slope & A Point</option>
                </select>
            </div>

            <div id="equation-inputs" class="input-group">
                <h3>Enter Equation Parameters</h3>
                <div class="input-row">
                    <label>m (Slope):</label>
                    <input type="number" id="eq-m" value="1" step="any">
                </div>
                <div class="input-row">
                    <label>b (y-intercept):</label>
                    <input type="number" id="eq-b" value="0" step="any">
                </div>
            </div>

            <div id="point-slope-inputs" class="input-group hidden">
                <h3>Enter Slope & Point</h3>
                <div class="input-row">
                    <label>m (Slope):</label>
                    <input type="number" id="ps-m" value="1" step="any">
                </div>
                <div class="input-row">
                    <label>Point x₁:</label>
                    <input type="number" id="ps-x" value="2" step="any">
                </div>
                <div class="input-row">
                    <label>Point y₁:</label>
                    <input type="number" id="ps-y" value="3" step="any">
                </div>
            </div>

            <button id="plot-btn">Plot Graph</button>

            <div class="result-box">
                <h4>Resulting Equation:</h4>
                <p id="equation-output">y = 1x + 0</p>
            </div>
        </div>

        <div class="graph-area">
            <canvas id="graphCanvas" width="500" height="500"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="/nav.js" defer></script>
</body>
</html>
