<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Vibur&display=swap" rel="stylesheet">
    <title>Stopwatch - matix the math club</title>
    <style>
    body {
            background-color: #01022b;
            color: #ffeb3b;
            font-family: 'Vibur', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #ffeb3b;
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Center container for the entire stopwatch element */
        .stopwatch-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            background: #111111;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ffeb3b;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.15);
            margin-bottom: 30px;
        }

        /* Symmetrical styles for math symbol side panels */
        .math-signs-at-the-left, 
        .math-signs-at-the-right {
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: #ffeb3b;
            font-size: 1.8rem;
            opacity: 0.6;
            user-select: none;
        }

        /* Clock readout display handling 00:00:000 */
        .time-00-00-format {
            color: white;
            font-size: 4.5rem; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            min-width: 320px; 
            text-align: center;
            user-select: none;
        }

        /* Control Panel Buttons */
        .controls {
            display: flex;
            gap: 15px;
        }

        .button {
            background: #1a1a1a;
            color: white;
            border: 1px solid #ffeb3b;
            padding: 10px 25px;
            font-family: 'Vibur', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s ease, color 0.2s ease, background-color 0.2s ease;
        }

        .button:hover {
            color: #0d0d0d;
            background-color: #ffeb3b;
            transform: scale(1.05);
        }

        .button-reset {
            border-color: #ff3b3b;
        }
        .button-reset:hover {
            background-color: #ff3b3b;
            color: white;
        }

        .return-link {
            margin-top: 40px;
            color: #ff3b3b;
            text-decoration: none;
            font-size: 1.2rem;
        }
    </style>
    
</head>
<body>

    <h1>> STOPWATCH</h1>

    <div class="stopwatch-container">
        <!-- Math symbols floating on the left -->
        <div class="math-signs-at-the-left">
            <span>&plus;</span>
            <span>&minus;</span>
            <span>&times;</span>
        </div>

        <!-- The 00:00:000 clock readout display -->
        <div class="time-00-00-format" id="display">00:00</div>

        <!-- Math symbols floating on the right -->
        <div class="math-signs-at-the-right">
            <span>&divide;</span>
            <span>&pi;</span>
            <span>&radic;</span>
        </div>
    </div>

    <!-- Interface Buttons -->
    <div class="controls">
        <button class="button" id="startStopBtn" onclick="toggleStartStop()">Start</button>
        <button class="button button-reset" onclick="resetStopwatch()">Reset</button>
    </div>

    <a href="../" class="return-link">[ Return to Tools ]</a>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;

        function toggleStartStop() {
            const btn = document.getElementById('startStopBtn');
            if (!isRunning) {
                // Start
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(updateTime, 10); // Update every 10ms for high precision milliseconds
                btn.innerText = "Stop";
                isRunning = true;
            } else {
                // Stop
                clearInterval(timerInterval);
                btn.innerText = "Start";
                isRunning = false;
            }
        }

        function resetStopwatch() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            isRunning = false;
            document.getElementById('startStopBtn').innerText = "Start";
            document.getElementById('display').innerText = "00:00";
        }

        function updateTime() {
            let now = Date.now();
            elapsedTime = now - startTime;

            // --- THE USELESS GLITCH LOGIC ---
            // 5% chance every tick to corrupt the timeline randomly
            let glitchChance = Math.random();
            if (glitchChance < 0.03) {
                // Modifies the underlying time reference to cause jumps, delays, or skips
                let multiplier = (Math.random() * 4) - 1.5; // Can be negative (rewind) or fast forward
                startTime -= Math.floor(multiplier * 100); 
            }

            // Calculations for display format
            let totalMilliseconds = elapsedTime;
            if (totalMilliseconds < 0) totalMilliseconds = 0; // Prevent rendering negative values string error

            let minutes = Math.floor(totalMilliseconds / 60000);
            let seconds = Math.floor((totalMilliseconds % 60000) / 1000);
            let milliseconds = totalMilliseconds % 1000;

            // Format numbers to match required padding sizes (2 digits, 2 digits, 3 digits)
            let minStr = String(minutes).padStart(2, '0');
            let secStr = String(seconds).padStart(2, '0');
            let msStr = String(milliseconds).padStart(3, '0');

            document.getElementById('display').innerText = `${minStr}:${secStr}`;
        }
        if (isRunning) {
            document.title = `stopwatch:[${document.getElementById('display').innerText}] - matix the math club`;
        } else {
            document.title = "stopwatch - matix the math club";
        }
    </script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="/theme-loader.js"></script>
<script src="/nav.js" defer></script>
</body>
</html>
