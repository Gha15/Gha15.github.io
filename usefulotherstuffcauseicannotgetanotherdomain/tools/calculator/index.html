<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - matix the math club</title>
    <link href="https://fonts.googleapis.com/css2?family=Vibur&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>&gt; Calculator</h1>
    
    <div class="calculator">
        <!-- Display screen -->
        <div class="displaytext">
            <p id="result">0</p>
        </div>

        <!-- Button Grid Layout -->
        <div class="buttons">
            <!-- Row 1 -->
            <button class="number" onclick="clearScreen()">AC</button>
            <button class="number" onclick="removelastdigit()">DEL</button>
            <button class="number" onclick="setOperator('%')">%</button>
            <button class="number" onclick="startSquareRoot()">&radic;</button>
            <button class="number" onclick="appendNumber('7')">7</button>
            <button class="number" onclick="appendNumber('8')">8</button>
            <button class="number" onclick="appendNumber('9')">9</button>
            <button class="number" onclick="closeParenthesis()">)</button>
            <!-- Row 2 -->
            <button class="addition" onclick="setOperator('+')">+</button>
            <button class="subtraction" onclick="setOperator('-')">-</button>
            <button class="multiplication" onclick="setOperator('*')">&times;</button>
            <button class="division" onclick="setOperator('/')">&divide;</button>            
            <button class="number" onclick="appendNumber('4')">4</button>
            <button class="number" onclick="appendNumber('5')">5</button>
            <button class="number" onclick="appendNumber('6')">6</button>
            <button class="number" onclick="openParenthesis()">(</button>
         
            <!-- Row 3 -->
            <button class="number" onclick="startSquareRoot()">&radic;</button>          
            <button class="number" onclick="startCubeRoot()">&#x221B;</button>
            <button class="number" onclick="appendNumber('0')">0</button>
            <button class="number" onclick="appendDecimal()">.</button>
            <button class="number" onclick="appendNumber('1')">1</button>
            <button class="number" onclick="appendNumber('2')">2</button>
            <button class="number" onclick="appendNumber('3')">3</button>
            <div class="spacer"></div>
            
            <!------------------Row 4------------------>
            <button class="equals" onclick="calculate()">=</button>

        </div>
    </div>
</body>
</html>
