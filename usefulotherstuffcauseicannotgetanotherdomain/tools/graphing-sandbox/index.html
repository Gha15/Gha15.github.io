<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphing Sandbox | Matix The Math Club</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="control-panel">
        <div class="brand-header">
            <h1>Matix <span>Sandbox</span></h1>
            <p>Interactive Grapher & Linear Transformations</p>
        </div>

        <div class="input-group">
            <div class="section-title">Plot Function or Equation</div>
            <label for="eqInput">Equation / Expression</label>
            <input type="text" id="eqInput" value="" placeholder="e.g. x = 10, y = 10, x^2 + y^2 = 4, sin(x)">
        </div>

        <div class="input-group">
            <div class="section-title">Linear Transformation Matix</div>
            <div class="matix-grid">
                <div class="matix-bracket">
                    <div class="matix-cell"><span>a</span><input type="number" id="m-a" value="1" step="0.1"></div>
                    <div class="matix-cell"><span>c</span><input type="number" id="m-c" value="0" step="0.1"></div>
                </div>
                <div class="matix-bracket">
                    <div class="matix-cell"><span>b</span><input type="number" id="m-b" value="0" step="0.1"></div>
                    <div class="matix-cell"><span>d</span><input type="number" id="m-d" value="1" step="0.1"></div>
                </div>
            </div>
        </div>

        <div class="input-group">
            <div class="section-title">Matix Presets</div>
            <div class="preset-container">
                <button class="btn-preset-action" onclick="applyPreset(0, 1, -1, 0, 'x = 10')">Rotate 90° 🔄</button>
                <button class="btn-preset-action" onclick="applyPreset(1, 1.5, 0, 1, 'y = 10')">Shear Stretch 📐</button>
                <button class="btn-preset-action" onclick="applyPreset(1, 0, 0, -1, 'sin(x) + cos(y) = 0')">Flip Vertical 🪞</button>
            </div>
        </div>

        <button class="btn-reset" id="resetBtn">Reset View & Matix</button>
    </div>

    <div id="canvas-container">
        <canvas id="graphCanvas"></canvas>
        <div id="instructions">Drag canvas to Pan • Scroll to Zoom</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
