<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="script.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Vibur&display=swap" rel="stylesheet">
  <title>timer - matix the math club</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: 'Vibur', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #ffeb3b;
      font-size: 2.5rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .stopwatch-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      background: #111111;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #ffeb3b;
      box-shadow: 0 0 20px rgba(255, 235, 59, 0.15);
      margin-bottom: 30px;
    }
    .math-signs-at-the-left, 
    .math-signs-at-the-right {
      display: flex;
      flex-direction: column;
      gap: 15px;
      color: #ffeb3b;
      font-size: 1.8rem;
      opacity: 0.6;
      user-select: none;
    }
    .time-00-00-format {
      color: white;
      font-size: 4.5rem; 
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      min-width: 320px; 
      text-align: center;
      user-select: none;
    }
    .input-panel, .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .button {
      background: #1a1a1a;
      color: white;
      border: 1px solid #ffeb3b;
      padding: 10px 25px;
      font-family: 'Vibur', cursive;
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease, background-color 0.2s ease;
    }
    .button:hover {
      color: #0d0d0d;
      background-color: #ffeb3b;
      transform: scale(1.05);
    }
    .button-reset {
      border-color: #ff3b3b;
    }
    .button-reset:hover {
      background-color: #ff3b3b;
      color: white;
    }
    .return-link {
      margin-top: 40px;
      color: #ff3b3b;
      text-decoration: none;
      font-size: 1.2rem;
    }
  </style>
  
</head>
<body>

  <h1>> TIMER</h1>

  <div class="stopwatch-container">
    <div class="math-signs-at-the-left">
      <span>&plus;</span>
      <span>&minus;</span>
      <span>&times;</span>
    </div>
    <div class="time-00-00-format" id="display">00:00</div>
    <div class="math-signs-at-the-right">
      <span>&divide;</span>
      <span>&pi;</span>
      <span>&radic;</span>
    </div>
  </div>

  <div class="input-panel">
    <button class="button" id="addMinBtn">+1 Min</button>
    <button class="button" id="addSecBtn">+10 Sec</button>
    <button class="button" id="addOneSecBtn">+1 Sec</button>
    <button class="button button-reset" id="clearBtn">Clear</button>
  </div>

  <div class="controls">
    <button class="button" id="startBtn">Start</button>
    <button class="button" id="pauseBtn">Pause</button>
    <button class="button button-reset" id="stopBtn">Stop</button>
  </div>

  <a href="../" class="return-link">[ Return to Tools ]</a>


    
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="/nav.js" defer></script>
</body>
</html>
