<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Courier+Prime&display=swap" rel="stylesheet">
    <title>Useful Other Stuff - matix the math club</title>
    <style>
        body {
            background-color: #0b0d30;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .handwritten-note {
            font-family: 'Caveat', cursive;
            color: #f8fafc;
            font-size: 2rem;
            margin: 20px 0;
            transform: rotate(-1deg);
        }

        .handwritten-box { display: inline-block; padding: 10px 25px; border: 2px solid #38bdf8; font-family: 'Caveat', cursive; transform: rotate(-1.5deg); background: rgba(15, 23, 42, 0.9); text-decoration: none; margin-bottom: 30px; }
        /* made button styling consistent with the rest of the site */
        .button {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid #fa07a1; 
            color: #fa07a1;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        .button:hover {
            background: #fa07a1;
            color: #020617;
            box-shadow: 0 0 20px rgba(250, 7, 161, 0.4);
            transform:scale(1.5);
        }
    </style>
</head>
