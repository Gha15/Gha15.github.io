<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Challenge - matix the math club</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="icon" href="../favicon.svg" type="image/x-icon">
    <style>
        body {
            background-color: #f0f4f8 !important;
            font-family: 'Arial', sans-serif !important;
            display: flex !important;
            justify-content: center !important;
            flex-direction: column !important;
            align-items: center !important;
            /* makes page scrollable if possible*/
            overflow-y: auto !important;
            background-color: #042444 !important;
        }
    </style>
</head>
<body>

    <div class="challenge-card">
        <div class="header-stats">
            <span class="streak-badge">🔥 Streak: <span id="streak-count">0</span> days</span>
            <span class="timer-badge">⏳ Next in: <span id="countdown">--:--:--</span></span>
        </div>
        
        <h2>Daily Challenge 🎯</h2>
        <p class="sub-text">Solve the puzzle to maintain your streak!</p>
        <div class="difficulty-box" id="difficultyBox">--</div>
        <div class="problem-box" id="problem-display">--</div>
        
        <div class="input-group">
            <input type="text" id="user-answer" placeholder="Your answer" autocomplete="off">
            <button id="submit-btn">Submit</button>
        </div>
        
        <div class="feedback" id="feedback-msg"></div>
    </div>

    <script src="../alldailypuzzles.js"></script>
    <script src="../global.js"></script>
</body>
</html>
