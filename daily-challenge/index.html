<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Challenge - matix the math club</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="icon" href="../favicon.svg" type="image/x-icon">
    <style>
        body {
            background-color: #f0f4f8 !important;
            font-family: 'Arial', sans-serif !important;
            display: flex !important;
            justify-content: center !important;
            flex-direction: column !important;
            align-items: center !important;
            /* makes page scrollable if possible*/
            overflow-y: auto !important;
            background-color: #042444 !important;
            width: 100% !important;
            background: #042444 !important;
        }
    </style>
</head>
<body>
    <h1 class="feedback" id="feedback"></h1>
    <div class="vertical-spacer"></div>
    <div class="challenge-card">  
        <h1>Welcome to the Daily Challenge!</h1>
        <div class="challenge-card">
            <h4>Test your math skills with a new challenge every day!</h4>  
            <p>today's challenge:</p>
        <div class="challenge-card">
        <div id="problem-display" class="problem-box">Loading today's challenge...</div>
        <p>difficulty:</p>
        <div id="difficultyBox" class="difficulty-box"></div>
        <div id="input-group" class="input-group">
            <input type="text" id="answer-input" placeholder="Enter your answer" />
            <button id="submit-button">Submit</button>
    </div>
    <div class="challenge-card">
        <div class="timer-box">
            <div class="countdown">Next challenge in:</div>
            <div id="countdown" class="countdown">Next challenge in: --:--:--</div>
        </div>
    </div>
    <div class="vertical-spacer"></div>
    <div class="challenge-card">
        <streak-count>Streak 🔥:</streak-count>
        <streak-count id="streak-count">Streak 🔥: 0</streak-count>
    </div>

    <script src="../alldailypuzzles.js"></script>
    <script src="../global.js"></script>
<script src="/nav.js" defer></script>
</body>
</html>
