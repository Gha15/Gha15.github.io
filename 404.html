<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - WHAT DID YOU DO?!</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            font-family: 'Segoe UI', sans-serif;
            color: #f8fafc;
            text-align: center;
            overflow: hidden;
        }

        .error-container {
            padding: 20px;
            max-width: 600px;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
        }

        /* Specific Color Requests */
        .blue-text { color: #818cf8; } /* Violets Blue */
        .red-text { color: #ef4444; font-weight: bold; } /* ERROR Red */

        .handwritten {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            margin: 20px 0;
            display: block;
        }

        .shouting {
            font-size: 2.5rem;
            color: #f8fafc;
            display: block;
            margin-bottom: 10px;
        }

        .home-link {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            border: 2px solid #38bdf8;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(1.1);
        }

        .math-bg {
            position: absolute;
            font-size: 15vw;
            opacity: 0.02;
            z-index: -1;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="math-bg">404 404 404</div>

    <div class="error-container">
        <h1>404 that <span class="blue-text">IS</span> an error</h1>
        
        <p class="handwritten">
            blue for violets... <br>
            <span class="red-text">red for ERROR</span>
        </p>

        <p class="shouting">WHAT CAN I DO?!</p>
        
        <p style="color: #94a3b8;">
            atleast it's just you slashing the url :-)
        </p>

        <p class="shouting" style="color: #ef4444; transform: rotate(-2deg);">
            I DID NOTHING!!!
        </p>

        <p class="handwritten" style="font-size: 1.5rem;">PLEASE I BEG YOU!</p>

        <a href="https://matixthemathclub.com" class="home-link">
            GO BACK TO MATIXTHEMATHCLUB.COM
        </a>
    </div>

</body>
</html>
