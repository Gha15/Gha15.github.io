<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Matix the Math Club</title>
<script>
/* Old links keep working: the previous site now lives under /temp. */
(function () {
  var p = location.pathname, q = location.search + location.hash;
  var m = p.match(/^\/(?:temp\/)?users\/([a-z0-9_-]+)\/?$/i);
  if (m) { location.replace('/temp/users/index.html?u=' + encodeURIComponent(m[1].toLowerCase())); return; }
  /* every page of the new site has its own clean link: /games/<id>, /teacher, /live/<PIN>, /present/<user>/<set>, /account, /join/<PIN> */
  var j = p.match(/^\/join\/(\d{6})\/?$/);
  if (j) { location.replace('/join/?c=' + j[1]); return; }
  var oldGames = ['mathescape','mathfight','mathplane','mathtree','mathwar','virtualpetgame','styles.css','script.js','index.html'];
  var seg = p.replace(/\/+$/, '').split('/').slice(1), first = seg[0] || '';
  var spa = ['games','teacher','live','present','account','owner'];
  if (spa.indexOf(first) > -1 && !(first === 'games' && seg[1] && oldGames.indexOf(seg[1]) > -1)) { location.replace('/#/' + seg.join('/') + location.search); return; }
  var old = ['FAQ','aboutus','button','chat','contactus','daily-challenge','docs','funny','games','ideas','install','lessons','membersonly','merch','messages','secretitems','usefulotherstuffcauseicannotgetanotherdomain','users','index.html'];
  if (old.indexOf(first) > -1) { location.replace('/temp' + p + q); }
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0c18;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:16px}
  a{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:999px;background:#fff;color:#111;font-weight:800;text-decoration:none}
  h1{font-size:2.4rem;margin:.2em 0}
</style>
</head>
<body>
  <div>
    <div style="font-size:3rem">🦉</div>
    <h1>Page not found</h1>
    <p>That page doesn’t exist on Matix.</p>
    <a href="/">Go to the home page</a>
  </div>
</body>
</html>
