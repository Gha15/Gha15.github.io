<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Matix the Math Club</title>
<meta name="description" content="Matix: a math app with a Grade 1 to college video course, math games, encrypted chat and friends. Get it on Google Play.">
<meta name="theme-color" content="#0b0c18">
<link rel="icon" href="/assets/matix-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/matix-icon.svg">
<meta property="og:title" content="Matix the Math Club">
<meta property="og:description" content="Learn math from Grade 1 to college in one-minute videos, then play it.">
<meta property="og:image" content="https://matixthemathclub.com/assets/posters/pythagoras.jpg">
<script>try{var t=localStorage.getItem("matix_theme");if(t?t==="light":matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("light");}catch(e){}</script>
<link rel="stylesheet" href="/assets/site.css?v=14">
<link rel="stylesheet" href="/assets/arcade.css?v=25">
<link rel="stylesheet" href="/assets/matix-present.css?v=1">
<link rel="stylesheet" href="/assets/theme.css?v=2">
<link rel="canonical" href="https://www.matixthemathclub.com/">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>

<header class="top" id="top">
  <a class="brand" href="#/" aria-label="Matix home"><img class="brand-ic" src="/assets/matix-icon.svg" alt="" width="34" height="34"><img class="brand-word" src="/assets/matix-logo-light.svg" alt="MATIX" height="22"></a>
  <nav class="menu" id="menu" aria-label="Main">
    <a href="/join/" data-r="join">🎯 <span>Join a game</span></a>
    <a href="#/" data-r="home">📲 <span>Download app</span></a>
  </nav>
  <button type="button" class="langbtn" id="langBtn" translate="no">🌐 <b>EN</b></button>
  <button type="button" class="themebtn" id="themeBtn" aria-label="Light or dark mode">🌙</button>
  <div class="who" id="who"></div>
</header>

<main id="content" tabindex="-1"></main>

<footer class="foot">
  <img src="/assets/matix-icon.svg" alt="" width="28" height="28" style="border-radius:8px">
  <span>© Matix the Math Club</span>
  <a href="/privacy/">Privacy</a>
</footer>

<div class="modal" id="authModal" hidden role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="modal-card">
    <button type="button" class="x" data-close aria-label="Close">✕</button>
    <div id="authBody"></div>
  </div>
</div>

<script src="/assets/i18n.js?v=8"></script>
<script src="/assets/matix-crypt.js?v=6"></script>
<script src="/assets/arcade.js?v=25"></script>
<script src="/assets/vendor/qrcode.min.js"></script>
<script src="/assets/matix-present.js?v=8"></script>
<script src="/assets/matix-school.js?v=5"></script>
<script src="/assets/site.js?v=19"></script>
<script>(function(){var R=document.documentElement,b=document.getElementById('themeBtn'),m=document.querySelector('meta[name=theme-color]');
function paint(){var l=R.classList.contains('light');b.textContent=l?'🌙':'☀️';b.title=l?'Dark mode':'Light mode';if(m)m.content=l?'#f6f4ff':'#0b0c18';}
b.onclick=function(){R.classList.toggle('light');try{localStorage.setItem('matix_theme',R.classList.contains('light')?'light':'dark');}catch(e){}paint();};paint();})();</script>
</body>
</html>
