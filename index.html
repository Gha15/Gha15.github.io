<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>matix the math club - learn play and more</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    .scroll-btn {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 1000;
      cursor: pointer;
      padding: 10px 18px;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-family: 'Courier Prime', monospace;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.42);
      transition: all 0.2s ease-in-out;
    }
        /* EACH SLIDE REPRESENTS EXACTLY ONE VISIBLE SECTION IN ORDER */
    .screen-section {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      position: relative !important;
      padding: 15px !important; 
      box-sizing: border-box !important;
    }

    /* Hero section: logo + tagline get a soft glow signature */
    .hero-section {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 22% 20%, rgba(56, 189, 248, 0.18), transparent 44%),
        radial-gradient(circle at 80% 78%, rgba(26, 86, 219, 0.26), transparent 48%),
        linear-gradient(160deg, #030d1e 0%, #061430 45%, #091e4a 100%);
    }

    .hero-section::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(92vw, 520px);
      height: min(92vw, 520px);
      background: radial-gradient(circle, rgba(26, 86, 219, 0.32), rgba(14, 42, 108, 0.18) 50%, transparent 76%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 380px; 
      max-height: 95vh; 
      margin: 0 auto;
    }

    .hero-section .container {
      background: rgba(10, 36, 100, 0.84);
      border: 1px solid rgba(96, 165, 250, 0.26);
      border-top: 4px solid #f59e0b;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .main-logo { 
      width: clamp(120px, 18vw, 180px); 
      max-height: 10vh; 
      height: auto; 
      margin-bottom: 5px; 
      transform: scale(2.25) rotate(-1deg);
      filter: drop-shadow(0 0 16px rgba(59, 130, 246, 0.50)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.50));
    }

    .handwritten-box { 
      display: inline-block; 
      padding: 4px 14px; 
      border: 2px solid #f59e0b; 
      font-family: 'Caveat', cursive; 
      transform: rotate(-1.5deg); 
      background: #fef3c7; 
      text-decoration: none; 
      margin-bottom: 14px; 
      box-shadow: 0 4px 0 rgba(245, 158, 11, 0.45);
    }

    .the-math { 
      font-size: 1.1rem; 
      color: #78a8d8; 
      text-transform: lowercase; 
      line-height: 0.9; 
    } 
    .club-com { 
      font-size: 1.8rem; 
      font-weight: 700; 
      color: #1e3a5f; 
      line-height: 1; 
    } 

    .dot-com { 
      color: #d97706; 
    }

    .scroll-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-align: center;
      font-family: 'Courier Prime', monospace;
      margin-top: 12px;
      margin-bottom: 0;
      color: #93c5fd;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
    }

    #scroll-arrow {
      display: inline-block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(4px); opacity: 1; }
    }

    .stats-layout {
      width: 90%;
      max-width: 480px;
      padding: 30px 28px;
      border: 1px solid rgba(96, 165, 250, 0.22);
      border-top: 4px solid #f59e0b;
      background: rgba(10, 36, 100, 0.88);
      font-family: 'Courier Prime', monospace;
      box-sizing: border-box;
      border-radius: 16px;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .stats-layout h2 {
      margin-top: 0;
      margin-bottom: 22px;
      color: #f8fafc;
      font-size: 1.55rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
      border-bottom: 1px solid rgba(96, 165, 250, 0.22);
      padding-bottom: 14px;
      text-align: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0;
      padding: 10px 0;
      font-size: 1rem;
      color: #bfdbfe;
      border-bottom: 1px solid rgba(96, 165, 250, 0.10);
    }

    .stat-value {
      color: #fff;
      font-weight: bold;
      background: rgba(245, 158, 11, 0.18);
      padding: 5px 18px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.42);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.18);
      min-width: 48px;
      text-align: center;
    }
  </style>

  <script src="/script.js" type="module"></script>
  <link rel="stylesheet" href="/global.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js"></script>
  <script src="/global.js" defer></script>

  <!-- font 2 import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  <!-- font 4 import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
        <section class="screen-section hero-section">
    <div class="container">  
      <!-- logo.svg -->     
      <img src="/logo.svg" alt="Matix The Math Club Logo" class="main-logo">
      <div class="handwritten-box"> 
        <div class="the-math">the math</div> 
        <div class="club-com">CLUB<span class="dot-com">.COM</span></div> 
      </div>

      
    </div>
    <p class="scroll-btn" id="scroll-btn">
        <span id="scroll-text">scroll down for live stats</span><span id="scroll-arrow">⬇</span>
    </p>
  </section>
    <section class="screen-section">
    <div class="stats-layout">
      <h2>Club Dashboard 📊</h2>
      <div class="stat-row">
        <span>Total Website Views 👀</span>
        <span id="view-counter" class="stat-value">...</span>
      </div>
      <div class="stat-row">
        <span>Total Lessons 📚</span>
        <span id="lessons-counter" class="stat-value">...</span>
      </div>
      <div class="stat-row">
        <span>Total Current Math Fight Players 🎮</span>
        <span id="current-players-counter" class="stat-value">...</span>
      </div>
      <div class="stat-row">
        <span>Total Ideas Submitted 💡(does not work)</span>
        <span id="ideas-counter" class="stat-value">...</span>
    </div>
    </div>
  </section>
