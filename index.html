<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matix The Math Club</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Courier+Prime&display=swap" rel="stylesheet">

    <style>
        /* GLOBAL STYLES */
        body {
            margin: 0; 
            padding: 0;
            padding-bottom: 80px; /* Prevents center content from hiding behind the sliding footer */
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            background-color: #0f172a;
            font-family: 'Segoe UI', sans-serif; 
            color: #f8fafc;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* GLIDING FOOTER TEXT */
        .footer-text {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            font-weight: 400;
            
            /* Pin the text safely near the bottom */
            position: fixed;
            bottom: 15px;          
            left: 0;
            width: 100%;
            z-index: 50;
            
            /* Glide Effect Settings */
            white-space: nowrap;   
            animation: glideSideways 10s linear infinite; 
        }

        /* The Glide Animation */
        @keyframes glideSideways {
            0% {
                transform: translateX(100%);   
            }
            100% {
                transform: translateX(-100%);  
            }
        }

        /* THE SECRET WHITE DOT */
        .secret-dot {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 4px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            text-decoration: none;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .secret-dot:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #fff;
            transform: scale(2);
            cursor: pointer;
        }

        .container { 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center; 
            z-index: 10; 
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* SVG LOGO */
        .main-logo {
            width: clamp(200px, 30vw, 350px);
            height: auto;
            margin-bottom: 10px; 
        }

        /* THE HANDWRITTEN BOX */
        .handwritten-box {
            display: inline-block;
            padding: 10px 25px;
            border: 2px solid #38bdf8;
            font-family: 'Caveat', cursive;
            transform: rotate(-1.5deg);
            background: rgba(15, 23, 42, 0.9);
            text-decoration: none;
            margin-bottom: 30px;
        }

        .the-math { font-size: 1.6rem; color: #94a3b8; text-transform: lowercase; line-height: 0.9; }
        .club-com { font-size: 2.8rem; font-weight: 700; color: #f8fafc; line-height: 1; }
        .dot-com { color: #38bdf8; }

        /* MENU BUTTON MATRIX */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .nav-btn {
            padding: 12px 20px;
            border: 1px solid #334155;
            background: rgba(30, 41, 59, 0.5);
            color: #cbd5e1;
            font-family: 'Courier Prime', monospace;
            font-size: 1rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }

        .nav-btn:hover {
            border-color: #38bdf8;
            color: #38bdf8;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            transform: translateY(-1px);
        }

        /* SCATTERED BG SYMBOLS */
        .math-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 1;
            font-family: 'Courier Prime', monospace;
            font-size: 1.5rem;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
        }
    </style>
</head>
