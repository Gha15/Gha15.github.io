<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATIX | Central Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Vibur&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617; 
            color: #10b981; 
            font-family: 'Courier Prime', monospace;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Embedded Cyber Grid Background */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.05;
            pointer-events: none;
        }

        .terminal-container {
            border: 1px solid #10b981; 
            background: #0f172a; 
            padding: 40px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15); 
            width: 100%; 
            max-width: 550px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .header-title {
            color: #818cf8; 
            border-bottom: 1px solid #334155; 
            padding-bottom: 15px;
            margin-bottom: 30px; 
            font-size: 2.5rem; 
            font-family: 'Vibur', cursive;
            text-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            padding: 14px 20px; 
            border: 1px solid #10b981; 
            background: transparent;
            color: #10b981; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-family: 'Courier Prime', monospace;
            transition: all 0.2s ease-in-out; 
            text-transform: uppercase;
            text-decoration: none;
            display: block;
            letter-spacing: 1px;
        }

        .nav-btn:hover { 
            background: #10b981; 
            color: #020617;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            transform: scale(1.02);
        }

        /* --- THE SECRET INTERFACE KEY --- */
        .vault-override-link {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: #1e293b;
            color: #64748b;
            border: 1px solid #334155;
            padding: 6px 12px;
            font-size: 0.75rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            opacity: 0.6;
            z-index: 10;
        }

        .vault-override-link:hover {
            opacity: 1;
            color: #94a3b8;
            border-color: #475569;
            background: #0f172a;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <svg class="bg-grid" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="1"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
    </svg>

    <div class="terminal-container">
        <div class="header-title">welcome!</div>
        
        <nav class="menu-grid">
            <a href="/merch" class="nav-btn">Merch</a>
            <a href="/aboutus" class="nav-btn">About Us</a>
            <a href="/funny" class="nav-btn">Jokes/Memes</a>
            <a href="/FAQ" class="nav-btn">FAQ</a>
            <a href="/games" class="nav-btn">Games</a>
            <a href="/button" class="nav-btn">Just a Button</a>
        </nav>
    </div>

    <a href="/secretitems" class="vault-override-link">[ Initialize Vault Override ]</a>

</body>
</html>
