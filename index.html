<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matix The Math Club</title>
    <!-- Hand font for the sub-logo -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #0f172a;
            font-family: 'Segoe UI', sans-serif; color: #f8fafc;
            overflow: hidden;
        }

        .container { text-align: center; padding: 20px; }

        /* The SVG Logo Styling */
        .main-logo {
            width: 250px; /* Adjust size here */
            height: auto;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3));
            fill: #38bdf8 !important; /* Forces your black SVG to be your theme blue */
        }
        
        .main-logo path { fill: #38bdf8; }

        /* The Handwritten Rectangle */
        .handwritten-box {
            display: inline-block;
            padding: 5px 15px;
            border: 2px solid #38bdf8;
            font-family: 'Caveat', cursive;
            margin-top: -10px; /* Pulls it closer to the logo */
            margin-bottom: 30px;
            transform: rotate(-1.5deg);
            background: rgba(56, 189, 248, 0.05);
        }

        .the-math {
            font-size: 1.4rem;
            color: #94a3b8;
            line-height: 1;
            text-transform: lowercase;
        }

        .club-com {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 0.9;
        }

        .dot-com { color: #38bdf8; }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loader {
            margin: 20px auto;
            width: 40px; height: 40px;
            border: 4px solid #1e293b;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
