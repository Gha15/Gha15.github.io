<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERROR GAMES ARCADE - Insert Token - matix the math club</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --bg-dark: #0a0612;
            --panel-bg: #130b24;
            --text-muted: #6d5f8a;
            --text-bright: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
            position: relative;
        }

        /* Retro CRT Scanlines & Screen Flicker */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 99;
            background-size: 100% 5px, 6px 100%;
            pointer-events: none;
        }

        /* Retro Arcade Cabinet Frame */
        .arcade-panel {
            width: 100%;
            max-width: 440px;
            background-color: var(--panel-bg);
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.1);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            text-align: center;
        }

        /* Top Cabinet Marquee Banner */
        .marquee-banner {
            border: 2px solid var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
            padding: 15px;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .marquee-banner::before {
            content: 'SELECT GLITCH LEVEL';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 0 10px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
        }

        .marquee-title {
            font-size: 1.6rem;
            color: var(--neon-pink);
            font-weight: 700;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .marquee-subtitle {
            font-family: 'Courier Prime', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
        }

        /* Insert Coin Status Indicator */
        .coin-status {
            font-family: 'Courier Prime', monospace;
            font-size: 0.9rem;
            color: var(--neon-cyan);
            margin-bottom: 25px;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Game Matrix Links */
        .arcade-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 35px;
        }

        .game-node {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #1b1030;
            border: 1px solid rgba(255, 0, 127, 0.2);
            color: #b5a4d4;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }

        .game-node .node-index {
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            color: var(--neon-pink);
        }

        /* Interactive Joystick Hover States */
        .game-node:hover {
            background: #251642;
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Lower Utility Controls */
        .cabinet-ops {
            border-top: 2px dashed rgba(255, 0, 127, 0.2);
            padding-top: 20px;
            display: flex;
            justify-content: center;
        }

        .ops-btn {
            font-family: 'Courier Prime', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.15s;
            letter-spacing: 1px;
        }

        .ops-btn:hover {
            color: var(--text-bright);
            text-shadow: 0 0 5px #fff;
        }

        /* Background Synthwave/Matrix Grid Text */
        .ambient-grid {
            position: absolute;
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            color: rgba(255, 0, 127, 0.02);
            top: 15px;
            left: 15px;
            pointer-events: none;
            user-select: none;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="ambient-grid">
        [STAGE_404] &bull; READY<br>
        [CREDITS_99] &bull; INFINITE_PLAY<br>
        [SYSTEM_OK] &bull; ROM_LOAD_COMPLETE
    </div>

    <div class="arcade-panel">
        
        <div class="marquee-banner">
            <h1 class="marquee-title">404 Arcade</h1>
            <p class="marquee-subtitle">Broken routes turned into bonus features</p>
        </div>

        <div class="coin-status">
            READY PLAYER ONE - INSERTED FREE TOKEN
        </div>

        <nav class="arcade-links">
            <a href="/errorgames/connectiontimeout" class="game-node">
                <span>Connection timeout game</span>
                <span class="node-index">[01]</span>
            </a>
            <a href="/errorgames/notfound" class="game-node">
                <span>Not Found</span>
                <span class="node-index">[02]</span>
            </a>
        </nav>

        <div class="cabinet-ops">
            <a href="/" class="ops-btn">&lt; Quit Game &amp; Return Home</a>
        </div>

    </div>

</body>
</html>
