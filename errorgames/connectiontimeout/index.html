<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERR_CONNECTION_TIMED_OUT | Math Arcade</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --bg-dark: #080510;
            --panel-bg: #110922;
            --text-dark: #4e4069;
            --text-light: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Share Tech Mono', monospace;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
            box-sizing: border-box;
        }

        /* Retro CRT Scanlines overlay */
        body::before {
            content: " "; display: block; position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 999; background-size: 100% 4px;
            pointer-events: none;
        }

        .browser-frame {
            width: 100%; max-width: 650px;
            background-color: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            padding: 25px; box-sizing: border-box;
            position: relative;
        }

        /* Chrome Error Tab style Header */
        .tab-error-header {
            text-align: left;
            border-bottom: 1px dashed var(--text-dark);
            padding-bottom: 15px; margin-bottom: 20px;
        }

        .error-title {
            font-size: 1.5rem; color: var(--neon-pink);
            margin: 0 0 5px 0; letter-spacing: 1px;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        .error-code {
            font-family: 'Courier Prime', monospace;
            font-size: 0.85rem; color: var(--text-dark);
        }

        /* Dynamic Network Loading Bar */
        .loading-container {
            width: 100%; background: #1a0e30;
            height: 6px; position: relative; margin-bottom: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        #buffer-bar {
            width: 100%; height: 100%;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
            transition: width 0.1s linear;
        }

        /* Game Canvas Platform */
        .canvas-container {
            position: relative; width: 100%;
            background: #0d061a;
            border: 1px solid rgba(255, 0, 127, 0.2);
        }

        canvas {
            display: block; width: 100%; height: auto;
        }

        /* Game Instructions Overlay */
        .controls-hint {
            margin-top: 15px; display: flex;
            justify-content: space-between;
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem; color: var(--text-dark);
        }

        .controls-hint span { color: var(--neon-cyan); }

        /* Reset Button hidden until crash */
        .action-container {
            margin-top: 20px; display: flex; gap: 15px; justify-content: flex-start;
        }

        .btn {
            background: transparent; border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s;
        }

        .btn:hover {
            background: var(--neon-cyan); color: var(--bg-dark);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .btn-alt {
            border-color: var(--text-dark); color: var(--text-dark); text-decoration: none;
            padding: 10px 20px; font-size: 0.9rem; display: inline-block;
        }
        .btn-alt:hover { color: var(--text-light); border-color: var(--text-light); }
    </style>
</head>
<body>

    <div class="browser-frame">
        <div class="tab-error-header">
            <h1 class="error-title">This site can’t be reached</h1>
            <div class="error-code">matix_club_upstream took too long to respond.</div>
            <div class="error-code" style="margin-top: 5px; color: var(--neon-cyan);">ERR_MATH_TIMEOUT_LIMIT_EXCEEDED</div>
        </div>

        <div class="loading-container">
            <div id="buffer-bar"></div>
        </div>

        <div class="canvas-container">
            <canvas id="dinoCanvas" width="600" height="220"></canvas>
        </div>

        <div class="controls-hint">
            <div>[↑/↓ ARROWS] or [TAP TOP/BOTTOM]: Switch Sign (<span>+</span> / <span>-</span>)</div>
            <div id="score-board">DETERMINANT: 0000</div>
        </div>

        <div class="action-container">
            <button class="btn" id="reload-btn" onclick="resetGame()">Load Matrix</button>
            <a href="/errorgames" class="btn-alt">&lt; Abort Subroutine</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('dinoCanvas');
        const ctx = canvas.getContext('2d');
        const bufferBar = document.getElementById('buffer-bar');
        const scoreBoard = document.getElementById('score-board');

        // Game Metrics Configuration
        let score = 0;
        let gameActive = true;
        let bufferEnergy = 100;
        let gameSpeed = 3.5;
        let obstacleTimer = 0;
        let obstacles = [];

        // Math Dino entity properties
        const dino = {
            x: 50,
            y: 110, // Centered on the operational axis line
            width: 30,
            height: 30,
            sign: 1, // 1 for Positive (+), -1 for Negative (-)
            targetY: 110
        };

        // Math Equation Matrix Obstacles arrays
        const mathExpressions = [
            { text: "÷ 0", type: "undefined" },
            { text: "√-1", type: "imaginary" },
            { text: "∞", type: "infinity" },
            { text: "x/0", type: "undefined" },
            { text: "∫ dx/x", type: "log" }
        ];

        // Process Controller Tracking User Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') { dino.sign = 1; }
            if (e.key === 'ArrowDown') { dino.sign = -1; }
        });

        // Touch Input targeting for portable devices
        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touchY = e.touches[0].clientY - rect.top;
            if (touchY < canvas.height / 2) {
                dino.sign = 1;
            } else {
                dino.sign = -1;
            }
        });

        function spawnObstacle() {
            const randomExpr = mathExpressions[Math.floor(Math.random() * mathExpressions.length)];
            const trackSign = Math.random() > 0.5 ? 1 : -1;
            
            obstacles.push({
                x: canvas.width + 20,
                y: trackSign === 1 ? 65 : 155,
                text: randomExpr.text,
                signRequirement: trackSign,
                width: 45,
                height: 25
            });
        }

        function resetGame() {
            score = 0;
            gameActive = true;
            bufferEnergy = 100;
            gameSpeed = 3.5;
            obstacles = [];
            dino.sign = 1;
            document.getElementById('reload-btn').innerText = "Reload Stream";
            loop();
        }

        function drawDino() {
            // Lerp tracking position smooth transition
            dino.targetY = dino.sign === 1 ? 65 : 155;
            dino.y += (dino.targetY - dino.y) * 0.25;

            ctx.save();
            // Render Math Dino Body Frame Box
            ctx.fillStyle = dino.sign === 1 ? '#00f3ff' : '#ff007f';
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.fillStyle;
            
            // Draw a styled minimalist blocky "Math Dino" with angular vertexes
            ctx.fillRect(dino.x, dino.y - 15, dino.width, dino.height);
            
            // Draw Dino eye tracking sensor
            ctx.fillStyle = '#0d061a';
            ctx.fillRect(dino.x + 20, dino.y - 10, 4, 4);

            // Draw current operational state value marker icon next to Dino
            ctx.font = "bold 14px Share Tech Mono";
            ctx.fillStyle = dino.sign === 1 ? '#00f3ff' : '#ff007f';
            ctx.fillText(dino.sign === 1 ? "[+]" : "[-]", dino.x - 28, dino.y + 5);
            ctx.restore();
        }

        function loop() {
            if (!gameActive) return;

            // Clear Screen Matrix
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Drain connection buffer energy continuously over runtime framework
            bufferEnergy -= 0.04;
            if (bufferEnergy <= 0) {
                bufferEnergy = 0;
                gameActive = false;
            }
            bufferBar.style.width = bufferEnergy + "%";

            // Draw middle algebraic baseline axis limits matrix
            ctx.strokeStyle = '#4e4069';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw top and bottom boundary tracks
            ctx.strokeStyle = 'rgba(78, 64, 105, 0.3)';
            ctx.strokeRect(0, 35, canvas.width, 1);
            ctx.strokeRect(0, 185, canvas.width, 1);

            // Process dynamic obstacle spawning frequency metrics
            obstacleTimer++;
            if (obstacleTimer > 70) {
                spawnObstacle();
                obstacleTimer = 0;
                if (gameSpeed < 7) gameSpeed += 0.1; // gradual curve speed limits escalation
            }

            // Draw and Update incoming obstacle vectors
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                ctx.save();
                ctx.fillStyle = obs.signRequirement === 1 ? 'rgba(0, 243, 255, 0.15)' : 'rgba(255, 0, 127, 0.15)';
                ctx.strokeStyle = obs.signRequirement === 1 ? '#00f3ff' : '#ff007f';
                ctx.lineWidth = 1;
                ctx.fillRect(obs.x, obs.y - 12, obs.width, obs.height);
                ctx.strokeRect(obs.x, obs.y - 12, obs.width, obs.height);

                // Print the mathematical runtime error string value
                ctx.font = "14px Share Tech Mono";
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(obs.text, obs.x + (obs.width / 2), obs.y + 5);
                ctx.restore();

                // Axis collision checking tracking calculations
                if (obs.x < dino.x + dino.width && obs.x + obs.width > dino.x) {
                    // Check if Dino coordinates align with the track lane profile
                    if ((obs.signRequirement === 1 && dino.sign === 1 && dino.y < 100) ||
                        (obs.signRequirement === -1 && dino.sign === -1 && dino.y > 100)) {
                        
                        // Clean calculation matching conversion! Refresh pipeline buffer metric
                        bufferEnergy = Math.min(100, bufferEnergy + 8);
                        score += 10;
                        obstacles.splice(i, 1);
                        continue;
                    } else if (Math.abs(dino.y - obs.y) < 35) {
                        // Math Sign mismatch inside collision vector threshold! System failure crash.
                        gameActive = false;
                    }
                }

                // Delete index elements clearing space behind track border margins
                if (obs.x < -50) {
                    obstacles.splice(i, 1);
                    score += 1;
                }
            }

            // Render operational entity positions
            drawDino();

            // Refresh Score metrics board terminal text
            scoreBoard.innerText = "DETERMINANT: " + String(score).padStart(4, '0');

            if (gameActive) {
                requestAnimationFrame(loop);
            } else {
                // Draw Glitched Terminal Termination Screen Overlay
                ctx.fillStyle = 'rgba(13, 6, 26, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = "bold 20px Share Tech Mono";
                ctx.fillStyle = '#ff007f';
                ctx.textAlign = 'center';
                ctx.fillText("CRITICAL_MATRIX_COLLAPSE", canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.font = "14px Courier Prime";
                ctx.fillStyle = '#4e4069';
                ctx.fillText("Output Exception: Cannot evaluate indeterminate form.", canvas.width / 2, canvas.height / 2 + 15);
                
                document.getElementById('reload-btn').innerText = "Recompute Matrix";
            }
        }

        // Initialize simulation execution track loops on start
        loop();
    </script>
</body>
</html>
