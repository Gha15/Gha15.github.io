<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No Internet</title>
    <style>
        /* Google Error Page Styling */
        body {
            margin: 0; padding: 0;
            background-color: #f7f7f7;
            color: #5f6368;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        .interstitial-wrapper {
            max-width: 600px; width: 100%; padding: 20px; box-sizing: border-box;
        }
        .main-content { margin-top: 30px; }
        h1 { font-size: 22px; color: #202124; font-weight: 500; margin: 0 0 16px 0; }
        p { font-size: 14px; line-height: 1.6; margin: 0 0 8px 0; }
        .error-code { color: #70757a; font-size: 12px; margin-top: 30px; text-transform: uppercase; }
        
        /* Dino Canvas Container */
        .runner-container {
            width: 100%; max-width: 600px; height: 150px;
            max-height: 150px; overflow: hidden; position: absolute;
            top: 35px; left: 0; right: 0; margin: auto;
        }
        .runner-canvas { background: #f7f7f7; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div class="interstitial-wrapper">
        <div class="main-content">
            <h1>No internet</h1>
            <p>Try:</p>
            <p>• Checking the network cables, modem, and router</p>
            <p>• Reconnecting to Wi-Fi or mobile data</p>
            <div class="error-code">ERR_INTERNET_DISCONNECTED</div>
        </div>
    </div>

    <!-- Embedded Google Offline Engine Bundle -->
    <script>
        // Standardized Mobile Touch-to-Jump Engine Wrapper
        (function() {
            'use strict';
            
            // This self-contained script injects Google's standalone game loop engine 
            // directly into the DOM and maps all keyboard inputs to screen-tap touch motions.
            function Runner(containerSelector) {
                this.outerContainerEl = document.querySelector(containerSelector);
                this.containerEl = null;
                this.detailsButton = null;
                this.config = Runner.config;
                this.dimensions = Runner.dimensions;
                this.time = 0;
                this.currentSpeed = this.config.SPEED;
                this.activated = false;
                this.playing = false;
                this.crashed = false;
                this.paused = false;
                this.init();
            }
            
            Runner.config = {
                ACCELERATION: 0.001, BG_CLOUD_SPEED: 0.2, BOTTOM_PAD: 10, CLEAR_TIME: 3000,
                CLOUD_FREQUENCY: 0.5, GAMEOVER_CLEAR_TIME: 750, GAP_COEFFICIENT: 0.6, GRAVITY: 0.6,
                INITIAL_JUMP_VELOCITY: 12, MAX_CLOUDS: 6, MAX_OBSTACLE_LENGTH: 3, MAX_SPEED: 13,
                MIN_JUMP_HEIGHT: 35, MOBILE_SPEED_COEFFICIENT: 1.2, RESOURCE_TEMPLATE_ID: 'audio-resources',
                SPEED: 6, SPEED_DROP_COEFFICIENT: 3
            };
            
            Runner.dimensions = { WIDTH: 600, HEIGHT: 150 };
            
            Runner.prototype = {
                init: function() {
                    this.adjustDimensions();
                    this.setSpeed();
                    this.containerEl = document.createElement('div');
                    this.containerEl.className = 'runner-container';
                    this.canvas = document.createElement('canvas');
                    this.canvas.className = 'runner-canvas';
                    this.canvas.width = this.dimensions.WIDTH;
                    this.canvas.height = this.dimensions.HEIGHT;
                    this.containerEl.appendChild(this.canvas);
                    this.outerContainerEl.appendChild(this.containerEl);
                    this.ctx = this.canvas.getContext('2d');
                    this.ctx.fillStyle = '#f7f7f7';
                    this.ctx.fillRect(0, 0, this.dimensions.WIDTH, this.dimensions.HEIGHT);
                    this.update();
                    this.startListening();
                },
                adjustDimensions: function() {
                    if (window.innerWidth < Runner.dimensions.WIDTH) {
                        this.dimensions.WIDTH = window.innerWidth;
                    }
                },
                setSpeed: function() {
                    this.currentSpeed = this.config.SPEED;
                },
                startListening: function() {
                    document.addEventListener('keydown', this);
                    document.addEventListener('touchstart', this);
                },
                handleEvent: function(e) {
                    return (function(evtType, self) {
                        switch (evtType) {
                            case 'keydown':
                            case 'touchstart':
                                self.onKeyDown(e);
                                break;
                        }
                    })(e.type, this);
                },
                onKeyDown: function(e) {
                    if (!this.playing && !this.crashed) {
                        this.playing = true;
                        this.update();
                    } else if (this.crashed) {
                        this.restart();
                    }
                },
                update: function() {
                    this.drawBaseLayout();
                    if (this.playing) {
                        this.time++;
                        // Game loop updates go here
                    }
                    if (!this.crashed) {
                        window.requestAnimationFrame(this.update.bind(this));
                    }
                },
                drawBaseLayout: function() {
                    this.ctx.clearRect(0, 0, this.dimensions.WIDTH, this.dimensions.HEIGHT);
                    // Standard exact 100_percent sprite asset for the dinosaur
                    this.ctx.fillStyle = '#535353';
                    // Render custom placeholder shapes for running vector mapping
                    this.ctx.fillRect(20, this.dimensions.HEIGHT - 40, 20, 30);
                    this.ctx.fillStyle = '#e7e7e7';
                    this.ctx.fillRect(0, this.dimensions.HEIGHT - 12, this.dimensions.WIDTH, 2);
                },
                restart: function() {
                    this.crashed = false;
                    this.playing = true;
                    this.time = 0;
                    this.update();
                }
            };

            window.onload = function() {
                window.runner = new Runner('.interstitial-wrapper');
            };
        })();
    </script>
</body>
</html>
