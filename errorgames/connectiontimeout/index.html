<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>connetion timeout game: math dino - matixthemathclub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-green: #39ff14;
            --neon-red: #ff003c;
            --neon-blue: #00f3ff;
            --cab-gold: #ffcc00;
            --bg-dark: #020205;
            --arcade-plastic: #18181c;
            --arcade-trim: #ff0055;
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            user-select: none;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* Scanline Overlay over the entire page */
        body::before {
            content: " "; display: block; position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            z-index: 999; background-size: 100% 4px;
            pointer-events: none;
        }

        /* --- THE PHYSICAL ARCADE CABINET --- */
        .arcade-cabinet {
            background: var(--arcade-plastic);
            border-radius: 20px 20px 0 0;
            border: 4px solid #0a0a0c;
            border-top: 8px solid #2a2a30;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.9), 
                inset 0 10px 20px rgba(255,255,255,0.05),
                -10px 0 20px rgba(0,0,0,0.8),
                10px 0 20px rgba(0,0,0,0.8);
            width: 100%; max-width: 680px;
            position: relative;
            display: flex; flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }

        /* Side panels simulating depth */
        .arcade-cabinet::before, .arcade-cabinet::after {
            content: ''; position: absolute;
            top: 0; bottom: 0; width: 15px;
            background: linear-gradient(to bottom, var(--arcade-trim), #550011);
            z-index: 2;
        }
        .arcade-cabinet::before { left: 0; border-radius: 15px 0 0 0; }
        .arcade-cabinet::after { right: 0; border-radius: 0 15px 0 0; }

        /* Cabinet Speaker Grills */
        .speaker-grill {
            width: 100%; height: 40px;
            background-image: radial-gradient(circle, #000 3px, transparent 3px);
            background-size: 12px 12px;
            margin-top: 20px; opacity: 0.6;
            border-bottom: 2px solid #222;
        }

        /* Illuminated Marquee Box */
        .marquee {
            width: 85%; margin: 15px auto;
            background: #000; border: 4px solid var(--neon-blue);
            padding: 15px 10px; text-align: center;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            position: relative; z-index: 3;
        }

        .marquee h1 {
            font-size: 1.2rem; color: var(--cab-gold); margin: 0;
            letter-spacing: 2px; text-shadow: 0 0 10px var(--cab-gold);
        }

        /* Recessed Screen Bezel */
        .bezel {
            background: #050505;
            width: 85%;
            padding: 25px;
            border-radius: 15px;
            box-shadow: inset 0 0 30px #000, 0 5px 15px rgba(0,0,0,0.8);
            border: 8px solid #1a1a1a;
            border-bottom: 15px solid #111;
            position: relative; z-index: 3;
            box-sizing: border-box;
        }

        /* Canvas Wrapper Screen */
        .viewport {
            background: #000; border: 2px solid #333; position: relative;
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: auto; background: #030308; }

        /* Setup/Rules Modal System Overlay */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 12, 0.95); z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .rules-box {
            border: 2px dashed var(--cab-gold); background: rgba(0,0,0,0.8);
            padding: 15px 20px; margin-bottom: 25px; text-align: left; width: 100%;
            box-sizing: border-box;
        }

        /* READABILITY BOOST: Swapped to Courier Prime, bigger font, more line-height */
        .rules-box p {
            font-family: 'Courier Prime', monospace; font-size: 1.1rem;
            line-height: 1.8; color: #e2e8f0; margin: 10px 0;
            text-shadow: 1px 1px 2px #000;
        }

        .rules-box span.green { color: var(--neon-green); font-weight: bold; text-shadow: 0 0 5px var(--neon-green); }
        .rules-box span.red { color: var(--neon-red); font-weight: bold; text-shadow: 0 0 5px var(--neon-red); }

        /* Icon Buttons for Input Selection */
        .device-selector {
            display: flex; gap: 15px; width: 100%;
        }

        .arcade-btn {
            flex: 1; background: #111; border: 3px solid var(--neon-blue);
            color: var(--neon-blue); font-family: 'Courier Prime', monospace; font-weight: bold;
            padding: 15px 10px; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 0 var(--neon-blue); transition: all 0.1s;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .arcade-btn svg { width: 50px; height: 50px; fill: var(--neon-blue); transition: fill 0.2s; }
        .arcade-btn:hover { background: var(--neon-blue); color: #000; }
        .arcade-btn:hover svg { fill: #000; }
        .arcade-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        /* Vital Instrument Dashboard Panel */
        .hud-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; background: #000; padding: 12px;
            border: 2px solid #222;
        }

        .score-counter { font-size: 0.85rem; color: #fff; }

        /* Health Instrumentation Matrix */
        .health-wrapper { display: flex; align-items: center; gap: 10px; }
        .health-text {
            font-size: 0.8rem; font-family: 'Press Start 2P', monospace;
            color: var(--neon-green); min-width: 95px; text-align: right;
        }

        .health-meter {
            width: 150px; height: 18px; background: #1a0005;
            border: 2px solid #ff003c; box-sizing: border-box; position: relative;
        }

        #health-fill {
            width: 100%; height: 100%; background: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green); transition: width 0.15s ease-out, background 0.2s;
        }

        /* Fake Coin Door Slots */
        .coin-door {
            display: flex; justify-content: center; gap: 40px;
            margin-top: 30px; z-index: 3;
        }

        .coin-slot {
            width: 40px; height: 60px; background: #050505;
            border: 3px solid #333; border-radius: 5px;
            position: relative; box-shadow: inset 0 0 10px #000;
        }

        .coin-slot::after {
            content: '25¢'; position: absolute; bottom: -25px; left: 50%;
            transform: translateX(-50%); font-family: 'Courier Prime', monospace;
            font-size: 0.8rem; color: #ff3300; text-shadow: 0 0 5px #ff3300; font-weight: bold;
        }

        .coin-insert {
            width: 6px; height: 30px; background: #ff3300;
            margin: 10px auto; border-radius: 3px;
            box-shadow: 0 0 10px #ff3300;
        }

        /* Dynamic Virtual Cabinet Controls Bar */
        #mobile-controls {
            display: none; margin-top: 20px; gap: 20px; width: 85%; z-index: 3;
        }

        .control-pad {
            flex: 1; background: #220011; border: 3px solid var(--neon-red);
            color: var(--neon-red); font-family: 'Press Start 2P', monospace;
            padding: 20px; font-size: 1rem; cursor: pointer;
            box-shadow: 0 6px 0 var(--neon-red); display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .control-pad.pos {
            background: #002211; border-color: var(--neon-green); color: var(--neon-green);
            box-shadow: 0 6px 0 var(--neon-green);
        }
        .control-pad:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }

        /* Retro System Abort Link */
        .exit-link {
            display: inline-block; margin-top: 35px; font-family: 'Courier Prime', monospace;
            font-size: 0.9rem; color: #777; text-decoration: none; text-transform: uppercase;
        }
        .exit-link:hover { color: #fff; text-shadow: 0 0 5px #fff; }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        
        <div class="speaker-grill"></div>

        <div class="marquee">
            <h1>MATH EXCEPTION RUNNER</h1>
        </div>
        
        <div class="bezel">
            <div id="menu-screen">
                <div class="rules-box">
                    <p>&bull; Navigate the limits with the Algebraic Math Dino.</p>
                    <p>&bull; Match your sign polarity before hitting incoming waves.</p>
                    <p>&bull; Correct match: <span class="green">+5 HEALTH</span>.</p>
                    <p>&bull; Mismatch or timeout: <span class="red">-10 HEALTH</span>.</p>
                </div>

                <div class="device-selector">
                    <button class="arcade-btn" onclick="initCabinet('pc')">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 16H3V20H21V16ZM12 4C10.9 4 10 4.9 10 6C10 6.6 10.3 7.1 10.7 7.5L9 16H11L12.5 8.2C13.4 7.9 14 7 14 6C14 4.9 13.1 4 12 4Z"/>
                        </svg>
                        PC (ARROWS)
                    </button>
                    <button class="arcade-btn" onclick="initCabinet('mobile')">
                        <svg viewBox="0 0 24 24">
                            <path d="M17 1H7C5.9 1 5 1.9 5 3V21C5 22.1 5.9 23 7 23H17C18.1 23 19 22.1 19 21V3C19 1.9 18.1 1 17 1ZM17 19H7V5H17V19ZM12 21.5C11.4 21.5 11 21.1 11 20.5C11 19.9 11.4 19.5 12 19.5C12.6 19.5 13 19.9 13 20.5C13 21.1 12.6 21.5 12 21.5Z"/>
                        </svg>
                        MOBILE (TOUCH)
                    </button>
                </div>
            </div>

            <div class="hud-row">
                <div class="score-counter" id="score-val">1P - 000000</div>
                
                <div class="health-wrapper">
                    <div class="health-meter">
                        <div id="health-fill"></div>
                    </div>
                    <div class="health-text" id="health-num">HP:100/100</div>
                </div>
            </div>

            <div class="viewport">
                <canvas id="arcadeCanvas" width="600" height="240"></canvas>
            </div>
        </div> <div id="mobile-controls">
            <button class="control-pad pos" ontouchstart="triggerSign(1)">&#9650; UP (+)</button>
            <button class="control-pad" ontouchstart="triggerSign(-1)">&#9660; DOWN (-)</button>
        </div>

        <div class="coin-door">
            <div class="coin-slot"><div class="coin-insert"></div></div>
            <div class="coin-slot"><div class="coin-insert"></div></div>
        </div>

    </div>

    <a href="/errorgames" class="exit-link">&lt; PULL PLUG &amp; RETURN HOME</a>

    <script>
        const canvas = document.getElementById('arcadeCanvas');
        const ctx = canvas.getContext('2d');
        const healthFill = document.getElementById('health-fill');
        const healthNum = document.getElementById('health-num');
        const scoreVal = document.getElementById('score-val');
        const menuScreen = document.getElementById('menu-screen');
        const mobileControls = document.getElementById('mobile-controls');

        // Game State Core Metrics
        let score = 0;
        let health = 100;
        let gameActive = false;
        let currentInputType = 'pc';
        let damageFlashFrame = 0; // Tracks if the screen should flash red
        
        let obstacles = [];
        let nextSpawnTime = 0; 
        let frameCounter = 0;

        const dino = {
            x: 60, y: 120,
            width: 28, height: 28,
            sign: 1, currentTrackY: 70
        };

        const mathGlitchPool = ["÷0", "√-1", "∞", "X/0", "0/0", "tan(90)"];

        function initCabinet(type) {
            currentInputType = type;
            menuScreen.style.display = 'none';
            if(type === 'mobile') {
                mobileControls.style.display = 'flex';
            } else {
                mobileControls.style.display = 'none';
            }
            setupInputListeners();
            bootGame();
        }

        function setupInputListeners() {
            if (currentInputType === 'pc') {
                window.addEventListener('keydown', (e) => {
                    // Prevent default scrolling for arrows and space
                    if(["ArrowUp","ArrowDown","Space"," "].indexOf(e.code) > -1) {
                        e.preventDefault();
                    }
                    if (e.key === 'ArrowUp') dino.sign = 1;
                    if (e.key === 'ArrowDown') dino.sign = -1;
                    if (!gameActive && (e.key === ' ' || e.key === 'Enter')) bootGame();
                });
            }
            
            // Allow tap restarts on the canvas screen area directly if game over
            canvas.addEventListener('touchstart', (e) => {
                if(!gameActive) {
                    e.preventDefault();
                    bootGame();
                }
            });
        }

        function triggerSign(val) {
            dino.sign = val;
        }

        function bootGame() {
            score = 0;
            health = 100; // Strictly set initial HP
            obstacles = [];
            frameCounter = 0;
            nextSpawnTime = 20;
            damageFlashFrame = 0;
            dino.sign = 1;
            gameActive = true;
            updateHUDMetrics();
            runArcadeEngine();
        }

        function updateHUDMetrics() {
            // Strictly clamp health between 0 and 100
            health = Math.max(0, Math.min(100, health));
            
            healthFill.style.width = health + "%";
            healthNum.innerText = `HP:${health}/100`;
            scoreVal.innerText = `1P - ${String(score).padStart(6, '0')}`;

            // Adjust neon readout hues based on remaining processing health
            if (health > 40) {
                healthFill.style.background = "#39ff14";
                healthNum.style.color = "#39ff14";
            } else {
                healthFill.style.background = "#ff003c";
                healthNum.style.color = "#ff003c";
            }
        }

        function spawnRandomObstacle() {
            const targetLane = Math.random() > 0.5 ? 1 : -1;
            const textString = mathGlitchPool[Math.floor(Math.random() * mathGlitchPool.length)];
            const randomSpeed = 4 + Math.random() * 4.5;

            obstacles.push({
                x: canvas.width + 30,
                y: targetLane === 1 ? 70 : 170,
                text: textString,
                requiredSign: targetLane,
                speed: randomSpeed,
                width: 50, height: 26
            });
        }

        function runArcadeEngine() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCounter++;

            // Draw 90s grid guidelines
            ctx.strokeStyle = '#111126';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 45, canvas.width, canvas.height - 90);

            ctx.strokeStyle = '#221133';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            if (frameCounter >= nextSpawnTime) {
                spawnRandomObstacle();
                frameCounter = 0;
                nextSpawnTime = Math.floor(40 + Math.random() * 50); 
            }

            // Math Dino Movement & Rendering
            dino.currentTrackY += ((dino.sign === 1 ? 70 : 170) - dino.currentTrackY) * 0.3;
            
            ctx.save();
            ctx.fillStyle = dino.sign === 1 ? varColor('--neon-blue') : varColor('--neon-red');
            ctx.shadowBlur = 12; ctx.shadowColor = ctx.fillStyle;
            
            ctx.fillRect(dino.x - 14, dino.currentTrackY - 14, dino.width, dino.height);
            ctx.fillStyle = "#000";
            ctx.fillRect(dino.x + 6, dino.currentTrackY - 10, 4, 4);

            ctx.font = "10px 'Press Start 2P'";
            ctx.fillStyle = dino.sign === 1 ? varColor('--neon-blue') : varColor('--neon-red');
            ctx.fillText(dino.sign === 1 ? "+" : "-", dino.x - 30, dino.currentTrackY + 4);
            ctx.restore();

            // Obstacle Evaluation
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obs.speed; 

                ctx.save();
                ctx.strokeStyle = obs.requiredSign === 1 ? varColor('--neon-blue') : varColor('--neon-red');
                ctx.lineWidth = 2;
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(obs.x - (obs.width/2), obs.y - 13, obs.width, obs.height);
                ctx.strokeRect(obs.x - (obs.width/2), obs.y - 13, obs.width, obs.height);

                ctx.font = "9px 'Press Start 2P'";
                ctx.fillStyle = "#fff";
                ctx.textAlign = "center";
                ctx.fillText(obs.text, obs.x, obs.y + 4);
                ctx.restore();

                // Hitbox detection
                if (obs.x - (obs.width/2) < dino.x + 14 && obs.x + (obs.width/2) > dino.x - 14) {
                    if (Math.abs(dino.currentTrackY - obs.y) < 25) {
                        
                        if (dino.sign === obs.requiredSign) {
                            health += 5; 
                            score += 100;
                        } else {
                            health -= 10; 
                            damageFlashFrame = 5; // Trigger red flash
                        }
                        
                        updateHUDMetrics();
                        obstacles.splice(i, 1);
                        
                        // Strict Death Check
                        if (health <= 0) {
                            gameActive = false;
                            executeCrashScreen();
                        }
                        continue;
                    }
                }

                if (obs.x < -60) {
                    obstacles.splice(i, 1);
                    score += 25; 
                    updateHUDMetrics();
                }
            }

            // Render Damage Flash overlay if hit
            if (damageFlashFrame > 0) {
                ctx.fillStyle = `rgba(255, 0, 60, ${damageFlashFrame * 0.1})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                damageFlashFrame--;
            }

            if (gameActive) {
                requestAnimationFrame(runArcadeEngine);
            }
        }

        function executeCrashScreen() {
            ctx.fillStyle = "rgba(5, 2, 10, 0.9)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "16px 'Press Start 2P'";
            ctx.fillStyle = varColor('--neon-red');
            ctx.textAlign = "center";
            ctx.fillText("1P PLAYER DIED", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = "10px 'Press Start 2P'";
            ctx.fillStyle = varColor('--cab-gold');
            ctx.fillText(`FINAL MATRIX SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
            
            ctx.fillStyle = "#fff";
            ctx.fillText(currentInputType === 'pc' ? "PRESS [SPACE] TO CONTINUE" : "TAP SCREEN TO CONTINUE", canvas.width / 2, canvas.height / 2 + 50);
            
            setTimeout(() => {
                menuScreen.style.display = 'flex';
            }, 1500); // Give player 1.5s to see score before popping menu back
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
    </script>
</body>
</html>
