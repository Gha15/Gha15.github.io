<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Matix Users</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/nav.js" defer></script>
  <style>
    .ux-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 30px 18px 60px
    }

    .ux-title {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: #f0f8ff;
      margin-bottom: 4px
    }

    .ux-sub {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .88rem;
      color: #475569;
      margin-bottom: 28px
    }

    .ux-search {
      width: 100%;
      max-width: 400px;
      background: rgba(2, 5, 18, .92);
      border: 1px solid rgba(96, 165, 250, .20);
      border-radius: 8px;
      color: #f8fafc;
      padding: 8px 12px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .88rem;
      outline: none;
      margin-bottom: 16px;
      box-sizing: border-box;
      display: block;
      transition: border-color .13s
    }

    .ux-search:focus {
      border-color: rgba(96, 165, 250, .5)
    }

    .ux-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 10px
    }

    .ux-card {
      background: rgba(12, 35, 100, .75);
      border: 1px solid rgba(96, 165, 250, .18);
      border-top: 3px solid #f59e0b;
      border-radius: 12px;
      padding: 12px 13px;
      text-decoration: none;
      transition: background .15s, box-shadow .15s;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer
    }

    .ux-card:hover {
      background: rgba(20, 50, 140, .85);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .5);
      text-decoration: none
    }

    .ux-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      font-weight: 700;
      color: #93c5fd;
      font-family: "Trebuchet MS", Arial, sans-serif;
      margin-bottom: 4px;
      flex-shrink: 0
    }

    .ux-uname {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #f0f8ff
    }

    .ux-role {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .71rem;
      color: #f59e0b
    }

    .ux-role.guest {
      color: #64748b
    }

    .ux-loading {
      text-align: center;
      padding: 44px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #475569;
      font-size: .88rem
    }

    /* profile */
    .prof-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .82rem;
      color: #3b82f6;
      margin-bottom: 28px
    }

    .prof-back:hover {
      color: #93c5fd;
      text-decoration: none
    }

    .prof-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .prof-av {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #93c5fd;
      font-family: "Trebuchet MS", Arial, sans-serif;
      flex-shrink: 0;
      border: 3px solid rgba(96, 165, 250, .3)
    }

    .prof-info {
      flex: 1;
      min-width: 0
    }

    .prof-name {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 1.35rem;
      font-weight: 900;
      color: #f0f8ff
    }

    .prof-badge {
      display: inline-block;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .72rem;
      padding: 2px 10px;
      border-radius: 20px;
      margin-top: 5px
    }

    .prof-badge.member {
      background: rgba(245, 158, 11, .12);
      border: 1px solid rgba(245, 158, 11, .4);
      color: #f59e0b
    }

    .prof-badge.user {
      background: rgba(100, 116, 139, .10);
      border: 1px solid rgba(100, 116, 139, .25);
      color: #64748b
    }

    .prof-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    .prof-btn {
      height: 28px;
      padding: 0 11px;
      border-radius: 7px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid;
      transition: background .13s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      background: none
    }

    .prof-btn.follow {
      border-color: #10b981;
      color: #34d399
    }

    .prof-btn.follow:hover {
      background: rgba(16, 185, 129, .18)
    }

    .prof-btn.following {
      background: rgba(16, 185, 129, .18);
      border-color: #10b981;
      color: #34d399
    }

    .prof-btn.msg {
      border-color: #3b82f6;
      color: #93c5fd
    }

    .prof-btn.msg:hover {
      background: rgba(59, 130, 246, .18);
      text-decoration: none
    }

    .prof-btn.edit {
      border-color: #f59e0b;
      color: #fbbf24
    }

    .prof-btn.edit:hover {
      background: rgba(245, 158, 11, .18)
    }

    .prof-btn.delete {
      border-color: #ef4444;
      color: #f87171
    }

    .prof-btn.delete:hover {
      background: rgba(239, 68, 68, .18)
    }

    .prof-stats {
      display: flex;
      gap: 18px;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .prof-stat {
      font-family: "Trebuchet MS", Arial, sans-serif
    }

    .prof-stat-n {
      font-size: 1.45rem;
      font-weight: 700;
      color: #f0f8ff;
      display: block
    }

    .prof-stat-l {
      font-size: .69rem;
      color: #475569
    }

    .prof-bio {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .9rem;
      color: #dbe4f3;
      line-height: 1.6;
      margin-top: 12px;
      max-width: 620px
    }

    .prof-panel {
      background: rgba(12, 35, 100, .72);
      border: 1px solid rgba(96, 165, 250, .16);
      border-top: 3px solid #f59e0b;
      border-radius: 12px;
      padding: 12px 14px 11px;
      margin: 0 0 18px
    }

    .prof-panel h3 {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .95rem;
      font-weight: 700;
      color: #f0f8ff;
      margin: 0 0 12px
    }

    .prof-field {
      display: block;
      width: 100%;
      background: rgba(2, 5, 18, .92);
      border: 1px solid rgba(96, 165, 250, .18);
      border-radius: 8px;
      color: #f8fafc;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .88rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color .13s
    }

    .prof-field:focus {
      border-color: rgba(96, 165, 250, .5)
    }

    .prof-field.ta {
      min-height: 88px;
      resize: vertical
    }

    .prof-help {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .72rem;
      color: #64748b;
      margin: -2px 0 10px
    }

    .prof-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .prof-note {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .75rem;
      color: #475569;
      margin-top: 10px
    }

    .prof-tabs {
      display: flex;
      border-bottom: 1px solid rgba(96, 165, 250, .14);
      margin-bottom: 22px;
      gap: 0
    }

    .prof-tab {
      padding: 9px 18px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .84rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      transition: color .13s, border-bottom-color .13s;
      user-select: none
    }

    .prof-tab.active {
      color: #f0f8ff;
      border-bottom-color: #f59e0b
    }

    .prof-tab:hover {
      color: #93c5fd
    }

    .prof-tab-pane {
      display: none
    }

    .prof-tab-pane.active {
      display: block
    }

    .prof-card {
      background: rgba(12, 35, 100, .75);
      border: 1px solid rgba(96, 165, 250, .15);
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 8px;
      transition: background .13s
    }

    .prof-card:hover {
      background: rgba(18, 46, 130, .8)
    }

    .prof-card-title {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .92rem;
      font-weight: 700;
      color: #bfdbfe;
      margin-bottom: 4px
    }

    .prof-card-meta {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .70rem;
      color: #ffffff
    }

    .prof-empty {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .84rem;
      color: #475569;
      padding: 28px 0;
      text-align: center
    }

    /* Modern Crop Styles */
    .crop-container {
      display: none;
      margin: 14px 0;
      background: rgba(2, 5, 18, 0.95);
      border: 1px dashed rgba(96, 165, 250, 0.4);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .crop-viewport {
      width: 200px;
      height: 200px;
      margin: 0 auto 12px;
      position: relative;
      overflow: hidden;
      border-radius: 50%;
      border: 2px solid #f59e0b;
      cursor: move;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.75);
    }

    .crop-viewport img {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .crop-slider {
      width: 100%;
      max-width: 200px;
      margin: 8px auto;
      display: block;
    }

    .upload-label-btn {
      display: inline-block;
      padding: 8px 14px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      border-radius: 6px;
      color: #93c5fd;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-label-btn:hover {
      background: rgba(59, 130, 246, 0.4);
    }

    /* ── Cooler directory hero ── */
    .ux-hero {
      background: linear-gradient(135deg, rgba(29, 78, 216, .35), rgba(245, 158, 11, .12));
      border: 1px solid rgba(96, 165, 250, .20);
      border-top: 3px solid #f59e0b;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px
    }
    .ux-hero .ux-title { margin-bottom: 8px }
    .ux-hero .ux-sub { margin-bottom: 0; color: #bfdbfe }
    .ux-hero .ux-sub b { color: #fbbf24 }
    .ux-dname {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .76rem;
      color: #93c5fd
    }
    .prof-aka {
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: .9rem;
      color: #93c5fd;
      margin-top: 2px
    }

    /* ── Change-password / status messages ── */
    .pw-msg { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .78rem; min-height: 1em; margin: 2px 0 10px; color: #64748b }
    .pw-msg.err { color: #f87171 }
    .pw-msg.ok { color: #34d399 }

    /* ── Ban overlay ── */
    .ban-overlay { position: fixed; inset: 0; z-index: 90000; display: flex; align-items: center; justify-content: center; background: rgba(2, 7, 22, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 20px; box-sizing: border-box }
    .ban-box { max-width: 420px; width: 100%; background: rgba(10, 15, 30, .99); border: 1px solid rgba(239, 68, 68, .42); border-top: 4px solid #ef4444; border-radius: 14px; box-shadow: 0 32px 80px rgba(0, 0, 0, .9); padding: 22px 22px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif }
    .ban-box h3 { color: #f87171; font-size: 1.15rem; font-weight: 800; margin: 0 0 12px }
    .cf-box { max-width: 430px; width: 100%; background: rgba(10, 15, 30, .99); border: 1px solid rgba(59, 130, 246, .45); border-top: 4px solid #f59e0b; border-radius: 14px; box-shadow: 0 32px 80px rgba(0, 0, 0, .9); padding: 20px 20px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif }
    .cf-box h3 { color: #fbbf24; font-size: 1.12rem; font-weight: 800; margin: 0 0 10px }
    .cf-box p { color: #cbd5e1; font-size: .9rem; line-height: 1.55; margin: 0 0 14px }
    .cf-box .prof-field { margin-bottom: 8px }
    .cf-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px }
    .pw-msg { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px }
    .pw-msg.err::before { content: "\2716  " }
    .pw-msg.ok::before { content: "\2714  " }
    .pw-msg:empty::before { content: none }
    .acct-divider { height: 1px; background: rgba(96, 165, 250, .16); margin: 4px 0 16px }
    .acct-sec label.prof-help { display: block; font-weight: 700; color: #93c5fd; margin-bottom: 6px }
    .acct-sec label.prof-help.acct-strong { color: #bfe0ff }
    .prof-badge.admin { background: rgba(251, 191, 36, .16); color: #fbbf24; border-color: rgba(251, 191, 36, .4) }
    .ux-role.admin { color: #fbbf24 }
    .prof-badge.manager { background: rgba(52, 211, 153, .16); color: #34d399; border-color: rgba(52, 211, 153, .4) }
    .ux-role.manager { color: #34d399 }
    .prof-badge.owner { background: rgba(192, 132, 252, .18); color: #c084fc; border-color: rgba(192, 132, 252, .45) }
    .ux-role.owner { color: #c084fc }
    .cf-toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: #0f172a; color: #e2e8f0; border: 1px solid rgba(148, 163, 184, .3); border-radius: 12px; padding: 12px 18px; font-size: .9rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); opacity: 0; transition: opacity .25s, transform .25s; z-index: 9999; max-width: 90vw }
    .cf-toast.show { opacity: 1; transform: translate(-50%, 0) }
    .cf-toast.err { border-color: rgba(248, 113, 113, .55); color: #fecaca }
    .cf-toast.ok { border-color: rgba(74, 222, 128, .55); color: #bbf7d0 }
    .ban-status { font-size: .8rem; color: #94a3b8; margin-bottom: 12px }
    .ban-status.active { color: #fca5a5 }
    .ban-row { display: flex; gap: 10px; margin-bottom: 10px }
    .ban-row .prof-field { flex: 1; min-width: 0 }
    select.prof-field { cursor: pointer; -webkit-appearance: none; appearance: none }
    .ban-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px }

    /* ── Comment wall (scratch.mit.edu style) ── */
    .cmt-section { margin-top: 22px; border-top: 1px solid rgba(96, 165, 250, .14); padding-top: 16px }
    .cmt-heading { font-family: "Trebuchet MS", Arial, sans-serif; font-size: 1.05rem; font-weight: 800; color: #f0f8ff; margin: 0 0 16px }
    .cmt-composer { display: flex; gap: 11px; margin-bottom: 14px }
    .cmt-input {
      width: 100%; box-sizing: border-box; min-height: 64px; resize: vertical;
      background: rgba(2, 5, 18, .92); border: 1px solid rgba(96, 165, 250, .20);
      border-radius: 10px; color: #f8fafc; padding: 11px 13px;
      font-family: "Trebuchet MS", Arial, sans-serif; font-size: .9rem; outline: none; transition: border-color .13s
    }
    .cmt-input:focus { border-color: rgba(96, 165, 250, .55) }
    .cmt-composer-row { display: flex; justify-content: flex-end; margin-top: 8px }
    .cmt-post-btn {
      background: linear-gradient(135deg, #1d4ed8, #2563eb); border: none; color: #fff;
      font-family: "Trebuchet MS", Arial, sans-serif; font-size: .84rem; font-weight: 700;
      padding: 8px 18px; border-radius: 8px; cursor: pointer; transition: filter .13s
    }
    .cmt-post-btn:hover { filter: brightness(1.12) }
    .cmt-post-btn:disabled { opacity: .6; cursor: default }
    .cmt-signin { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .84rem; color: #64748b; background: rgba(12, 35, 100, .5); border: 1px solid rgba(96, 165, 250, .14); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px }
    .cmt-list { display: flex; flex-direction: column; gap: 12px }
    .cmt-empty { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .84rem; color: #475569; text-align: center; padding: 22px 0 }
    .cmt-item { display: flex; gap: 12px; align-items: flex-start; background: rgba(12, 35, 100, .55); border: 1px solid rgba(96, 165, 250, .14); border-radius: 12px; padding: 9px 12px; position: relative }
    .cmt-avatar { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #1e3a8a, #1d4ed8); display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", Arial, sans-serif; font-weight: 700; font-size: .85rem; color: #93c5fd; text-decoration: none; background-size: cover; background-position: center }
    .cmt-body { flex: 1; min-width: 0 }
    .cmt-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 3px; flex-wrap: wrap }
    .cmt-name { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .86rem; font-weight: 700; color: #bfdbfe; text-decoration: none }
    .cmt-name:hover { color: #93c5fd; text-decoration: underline }
    .cmt-time { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .68rem; color: #64748b }
    .cmt-text { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .9rem; color: #e2e8f0; line-height: 1.5; word-break: break-word; white-space: pre-wrap }
    .cmt-del { position: absolute; top: 8px; right: 8px; display: flex; align-items: center; gap: 4px; background: rgba(239, 68, 68, .12); border: 1px solid rgba(239, 68, 68, .28); color: #f87171; cursor: pointer; font-family: "Trebuchet MS", Arial, sans-serif; font-size: .7rem; font-weight: 700; line-height: 1; padding: 4px 8px; border-radius: 6px; transition: background .12s, color .12s }
    .cmt-del:hover { background: rgba(239, 68, 68, .26); color: #fca5a5 }
    .cmt-mention { color: #93c5fd; text-decoration: none; font-weight: 700 }
    .cmt-mention:hover { text-decoration: underline; color: #bfdbfe }
    .cmt-actions { margin-top: 8px; display: flex; align-items: center; justify-content: flex-end; gap: 10px }
    .cmt-reply-btn { background: none; border: none; color: #7dd3fc; cursor: pointer; font-family: "Trebuchet MS", Arial, sans-serif; font-size: .76rem; font-weight: 700; padding: 2px 0 }
    .cmt-reply-btn:hover { text-decoration: underline; color: #bae6fd }
    .cmt-mention-menu { position: absolute; top: 100%; left: 0; z-index: 40; margin-top: 4px; min-width: 190px; max-height: 220px; overflow-y: auto; background: #0b1836; border: 1px solid rgba(96, 165, 250, .32); border-radius: 10px; box-shadow: 0 12px 30px -8px rgba(0,0,0,.7); padding: 5px }
    .cmt-mention-opt { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; cursor: pointer; font-family: "Trebuchet MS", Arial, sans-serif; font-size: .85rem; color: #dbeafe }
    .cmt-mention-opt:hover, .cmt-mention-opt.active { background: rgba(37, 99, 235, .35) }
    .cmt-mention-av { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #1e3a8a, #1d4ed8); display: flex; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; color: #93c5fd; flex-shrink: 0 }
    .cmt-replies { margin-left: 2vw; margin-top: 8px; display: flex; flex-direction: column; gap: 12px; border-left: 2px solid rgba(96, 165, 250, .22); padding-left: 14px }
    .cmt-item-reply { background: rgba(12, 35, 100, .38) }
    .cmt-reply-chip { display: flex; align-items: center; gap: 8px; background: rgba(37, 99, 235, .18); border: 1px solid rgba(96, 165, 250, .3); border-radius: 8px; padding: 5px 10px; margin-bottom: 8px; font-family: "Trebuchet MS", Arial, sans-serif; font-size: .78rem; color: #bfdbfe }
    .cmt-reply-cancel { background: none; border: none; color: #93c5fd; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px; margin-left: auto }
    .cmt-inline-reply { margin: 10px 0 2px 40px }
    .cc-modal-overlay { position: fixed; inset: 0; background: rgba(2, 5, 18, .72); display: flex; align-items: center; justify-content: center; z-index: 999 }
    .cc-modal-box { background: #0b1836; border: 1px solid rgba(96, 165, 250, .28); border-radius: 14px; padding: 22px 24px; max-width: 340px; box-shadow: 0 20px 50px -10px rgba(0, 0, 0, .7) }

    /* ── Rename a user's account: migrates data + updates this session ── */

    function reassignAuthor(baseUrl, field, oldU, newU) {

        }));

          try { var j2 = JSON.parse(localStorage.getItem('mx_joined') || '{}'); if (j2[oldU] !== undefined) { j2[newU] = j2[oldU]; delete j2[oldU]; localStorage.setItem('mx_joined', JSON.stringify(j2)); } } catch (e) { }

    function banRef(u) { return FB + '/bans/' + encodeURIComponent(normalizeUser(u)) + '.json'; }

      fetchJson(banRef(u)).then(function (b) {

      var hrs = Math.round(mins / 60); if (hrs < 24) return hrs + ' hr left';
      var days = Math.round(hrs / 24); return days + ' day' + (days === 1 ? '' : 's') + ' left';
    }
    function showBanUI(root, username) {
      var existing = document.getElementById('ban-ui'); if (existing) existing.parentNode.removeChild(existing);

      ov.appendChild(box); root.appendChild(ov);

          // Shared by "resize current", "pick new", and "camera" — loads any source

          function loadImageIntoCropper(srcDataUrl) {
            cropImg = new Image();
            cropImg.onload = function () {
              photoChooseView.style.display = 'none';
              photoCameraView.style.display = 'none';
              cropZone.style.display = 'block';
              // Calculate "cover" scale so the image always fills the viewport
              var vw = 200, vh = 200;
              var coverScale = Math.max(vw / cropImg.naturalWidth, vh / cropImg.naturalHeight);

              // Render the image at its natural size; transform handles all scaling
              cropImg.style.width = cropImg.naturalWidth + 'px';
              cropImg.style.height = cropImg.naturalHeight + 'px';

              // Configure slider: min = cover, max = 3x cover
              cropZoom.min = coverScale;
              cropZoom.max = coverScale * 3;
              cropZoom.step = 0.01;
              cropZoom.value = coverScale;
              currentScale = coverScale;

              // Center the (scaled) image inside the viewport
              var displayW = cropImg.naturalWidth * coverScale;
              var displayH = cropImg.naturalHeight * coverScale;
              imgX = (vw - displayW) / 2;
              imgY = (vh - displayH) / 2;
              cropImg.style.transform = 'translate(' + imgX + 'px, ' + imgY + 'px) scale(' + coverScale + ')';

              cropView.innerHTML = '';
              cropView.appendChild(cropImg);

          items.forEach(function (s) {
            var st = document.createElement('div'); st.className = 'prof-stat';
            var sn = document.createElement('span'); sn.className = 'prof-stat-n'; sn.textContent = s.n;
            var sl = document.createElement('span'); sl.className = 'prof-stat-l'; sl.textContent = s.l;
            st.appendChild(sn); st.appendChild(sl); statsBar.appendChild(st);
          });
        }
        buildStats();

        var tabsRow = document.createElement('div'); tabsRow.className = 'prof-tabs';
        var tabLabels = ['Lessons', 'Ideas', 'Jokes / Memes'];
        var panes = [];
        tabLabels.forEach(function (label, i) {
          var tab = document.createElement('div'); tab.className = 'prof-tab' + (i === 0 ? ' active' : ''); tab.textContent = label;
          var pane = document.createElement('div'); pane.className = 'prof-tab-pane' + (i === 0 ? ' active' : '');
          pane.innerHTML = '<div class="prof-empty">Loading...</div>';
          tab.addEventListener('click', function () {
            tabsRow.querySelectorAll('.prof-tab').forEach(function (t) { t.classList.remove('active'); });
            panes.forEach(function (p) { p.classList.remove('active'); });
            tab.classList.add('active'); pane.classList.add('active');
          });
          tabsRow.appendChild(tab); panes.push(pane);
        });
        root.appendChild(tabsRow);
        panes.forEach(function (p) { root.appendChild(p); });

        /* lessons */
        var lessonKeys = Object.keys(lessonsData).filter(function (k) { return lessonsData[k] && normalizeUser(lessonsData[k].createdBy) === username; });
        cachedLessonCount = lessonKeys.length;
        buildStats(lessonKeys.length);
        panes[0].innerHTML = '';
        if (!lessonKeys.length) { panes[0].innerHTML = '<div class="prof-empty">No lessons yet.</div>'; }
        lessonKeys.forEach(function (k) {
          var d = lessonsData[k];
          var c = document.createElement('div'); c.className = 'prof-card';
          var ct = document.createElement('div'); ct.className = 'prof-card-title'; ct.textContent = d.title || 'Untitled';
          var cm = document.createElement('div'); cm.className = 'prof-card-meta'; cm.textContent = d.description || 'No description.';
          c.appendChild(ct); c.appendChild(cm); panes[0].appendChild(c);
        });

        var ideaKeys = Object.keys(ideasData).filter(function (k) { return ideasData[k] && normalizeUser(ideasData[k].createdBy) === username; });
        panes[1].innerHTML = '';
        if (!ideaKeys.length && !profile.ideasText) {
          panes[1].innerHTML = '<div class="prof-empty">No authored ideas yet.</div>';
        }
        ideaKeys.forEach(function (k) {
          var idea = ideasData[k];
          var card = document.createElement('div'); card.className = 'prof-card';
          var title = document.createElement('div'); title.className = 'prof-card-title'; title.textContent = idea.text || 'Untitled idea';
          var meta = document.createElement('div'); meta.className = 'prof-card-meta'; meta.textContent = 'Idea post';
          card.appendChild(title); card.appendChild(meta); panes[1].appendChild(card);
        });
        if (profile.ideasText) {
          panes[1].innerHTML += '<div class="prof-card"><div class="prof-card-title">Pinned ideas note</div><div class="prof-card-meta">' + escapeHtml(profile.ideasText) + '</div></div>';
        }

        var memeKeys = Object.keys(memesData).filter(function (k) { return memesData[k] && normalizeUser(memesData[k].postedBy) === username; });
        panes[2].innerHTML = '';
        if (!memeKeys.length && !profile.memesText) {
          panes[2].innerHTML = '<div class="prof-empty">No authored jokes or memes yet.</div>';
        }
        memeKeys.forEach(function (k) {
          var meme = memesData[k];
          var card = document.createElement('div'); card.className = 'prof-card';
          var title = document.createElement('div'); title.className = 'prof-card-title'; title.textContent = meme.title || 'Untitled meme';
          var meta = document.createElement('div'); meta.className = 'prof-card-meta'; meta.textContent = meme.content || 'No content.';
          card.appendChild(title); card.appendChild(meta); panes[2].appendChild(card);
        });
        if (profile.memesText) {
          panes[2].innerHTML += '<div class="prof-card"><div class="prof-card-title">Pinned jokes / memes note</div><div class="prof-card-meta">' + escapeHtml(profile.memesText) + '</div></div>';
        }

        renderComments(root, username, me);
      });
    }

    /* ── Directory view ── */
    function renderDirectory(filter) {
      var grid = document.getElementById('ux-grid'); if (!grid) return;
      grid.innerHTML = '<div class="ux-loading">Loading users...</div>';
      Promise.all([
        fetchJson(FB + '/profiles.json'),
        fetchJson(FB + '/lessons.json'),
        fetchJson(IDEAS_FB + '/ideas.json'),
        fetchJson(FB + '/funny_memes.json')
      ]).then(function (results) {
        var profilesMap = results[0] || {};
        var all = collectUsernames(profilesMap, results[1], results[2], results[3]);
        if (filter) all = all.filter(function (u) { return u.toLowerCase().indexOf(filter.toLowerCase()) > -1; });
        if (!all.length) { grid.innerHTML = '<div class="ux-loading">No users found.</div>'; return; }
        grid.innerHTML = '';
        all.forEach(function (u) {
          var card = document.createElement('a'); card.className = 'ux-card'; card.href = '/users/' + encodeURIComponent(u);
          var av = document.createElement('div'); av.className = 'ux-avatar';

          var userProfile = profilesMap[u];
          if (userProfile && userProfile.profileImage) {
            av.style.backgroundImage = 'url(' + userProfile.profileImage + ')';
            av.style.backgroundSize = 'cover';
            av.style.backgroundPosition = 'center';
          } else {
            av.textContent = initials(u);
          }

          var nm = document.createElement('div'); nm.className = 'ux-uname'; nm.textContent = '@' + u;
          var uRole = roleOf(u);
          var role = document.createElement('div'); role.className = 'ux-role' + (uRole === 'user' ? ' guest' : '') + (uRole === 'admin' ? ' admin' : '') + (uRole === 'owner' ? ' owner' : '');
          role.textContent = roleLabel(uRole);
          card.appendChild(av); card.appendChild(nm);
          card.appendChild(role);
          grid.appendChild(card);
        });
      });
    }

    /* ── Router ── */
    function startApp() {
    var params = new URLSearchParams(window.location.search);
    var pathMatch = window.location.pathname.match(/^\/users\/([a-z0-9_]+)\/?$/i);
    var targetUser = (pathMatch && pathMatch[1]) || params.get('u');
    if (targetUser) {
      var clean = normalizeUser(targetUser);
      if (window.location.pathname !== '/users/' + clean) {
        history.replaceState({}, '', '/users/' + clean);
      }
      renderProfile(clean);
    } else {
      document.title = 'Matix Users';
      var root = document.getElementById('ux-root');
      root.innerHTML =
        '<div class="ux-hero">' +
        '<div class="ux-title">\uD83D\uDC65 Matix Users</div>' +
        '<div class="ux-sub">Browse everyone in the club by their <b>@username</b> \u2014 open a profile to see their lessons, ideas &amp; leave comments.</div>' +
        '</div>' +
        '<input class="ux-search" id="ux-search" type="text" placeholder="\uD83D\uDD0D Search users by username\u2026" autocomplete="off">' +
        '<div class="ux-grid" id="ux-grid"><div class="ux-loading">Loading\u2026</div></div>';
      renderDirectory('');
      document.getElementById('ux-search').addEventListener('input', function () { renderDirectory(this.value); });
    }
    }
    /* Load persisted roles once so member/admin status is correct everywhere, then start. */
    fetchJson(FB + '/roles.json').then(function (r) {
      if (r && typeof r === 'object') { Object.keys(r).forEach(function (k) { if (typeof r[k] === 'string') ROLES[normalizeUser(k)] = r[k]; }); }
      startApp();
    });
  </script>
</body>
