<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Redirect</title>
  <script>
    (function () {
      var p = window.location.pathname;
      var m = p.match(/^\/users\/([^/?#]+)\/?$/i);
      if (m) {
        window.location.replace('/users/index.html?u=' + encodeURIComponent(m[1].toLowerCase()));
        return;
      }
      window.location.replace('/users/');
    }());
  </script>
</head>
<body></body>
</html>
