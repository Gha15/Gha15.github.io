<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Something Amazing</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url('data:image/svg+xml,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://w3.org"><g fill="none" fill-rule="evenodd"><g fill="%23ffffff" fill-opacity="1"><polygon points="30 0 60 30 30 60 0 30"/></g></g></svg>');
            z-index: -1;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero-image {
            width: 300px;
            height: 200px;
            background: url('https://unsplash.com') center/cover;
            border-radius: 20px;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.6s ease;
        }

        .hero-image:hover {
            transform: scale(1.05);
        }

        .hero-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
        }

        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: white;
            z-index: 2;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            opacity: 0;
            animation: slideUp 1s ease 0.3s forwards;
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.5rem);
            color: #888;
            margin-bottom: 3rem;
            font-weight: 300;
            opacity: 0;
            animation: slideUp 1s ease 0.6s forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            opacity: 0;
            animation: slideUp 1s ease 0.9s forwards;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .scratch-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            transition: fill 0.3s ease;
        }

        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            color: rgba(255, 255, 255, 0.1);
            font-size: 2rem;
            animation: floatRandom 15s linear infinite;
        }

        @keyframes floatRandom {
            from {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            to {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .hero-image {
                width: 250px;
                height: 166px;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-pattern"></div>

    <div class="container">
        <div class="hero-image">
            <div class="logo">
                <i class="fas fa-rocket"></i>
            </div>
        </div>

        <h1>Coming Soon</h1>
        <div class="subtitle">Something amazing is in the works. Stay tuned!</div>

        <div class="social-links">
            <a href="https://github.com/Gha15" target="_blank" class="social-link" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://scratch.mit.edu/users/Gha15" target="_blank" class="social-link" title="Scratch">
                <svg class="scratch-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm1.03 14.156c-1.396.643-2.98.711-4.225-.011-1.614-.937-2.073-2.894-1.127-4.524.945-1.63 2.92-2.115 4.534-1.179 1.107.643 1.705 1.83 1.725 3.016l1.961-.433c-.157-1.89-1.258-3.694-3.125-4.775-2.73-1.59-6.195-.717-7.738 1.944-1.543 2.66-.632 6.046 2.098 7.636 2.025 1.178 4.453.947 6.13-.393l-1.458-1.295z"/>
                </svg>
            </a>
        </div>
    </div>

    <div class="floating-elements">
        <div class="floating-element" style="left: 10%; animation-delay: 0s;"><i class="fas fa-code"></i></div>
        <div class="floating-element" style="left: 30%; animation-delay: 4s;"><i class="fas fa-laptop"></i></div>
        <div class="floating-element" style="left: 70%; animation-delay: 2s;"><i class="fas fa-terminal"></i></div>
        <div class="floating-element" style="left: 90%; animation-delay: 6s;"><i class="fas fa-cube"></i></div>
    </div>

</body>
</html>
