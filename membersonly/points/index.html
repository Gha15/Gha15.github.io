<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATIX | Sync Points</title>
    <link href="https://fonts.googleapis.com/css2?family=Vibur&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Vibur', cursive;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .logo-area { margin-bottom: 10px; }
        .logo-area svg { width: 200px; height: auto; }
        .logo-area svg g { fill: #818cf8 !important; }
        
        .notifications-area {
            display: none;
            width: 95%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        
        .notification-item {
            background: #1e293b;
            border: 1px solid #f59e0b;
            border-left: 3px solid #f59e0b;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .notif-header {
            color: #f59e0b;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .notif-details {
            color: #94a3b8;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .notif-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-approve {
            padding: 6px 18px;
            background: #10b981;
            color: #020617;
            border: 1px solid #059669;
            cursor: pointer;
            font-family: 'Vibur', cursive;
            font-size: 1.4rem;
            transition: 0.2s;
        }
        
        .btn-approve:hover {
            background: #059669;
        }
        
        .btn-deny {
            padding: 6px 18px;
            background: #ef4444;
            color: #020617;
            border: 1px solid #dc2626;
            cursor: pointer;
            font-family: 'Vibur', cursive;
            font-size: 1.4rem;
            transition: 0.2s;
        }
        
        .btn-deny:hover {
            background: #dc2626;
        }
        
        .theme-customizer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
        }
        
        .theme-customizer-title {
            color: #818cf8;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        
        .theme-slider {
            width: 100%;
            margin: 10px 0;
        }
        
        .theme-value {
            color: #10b981;
            font-size: 1.6rem;
            text-align: center;
        }
        
        .btn-reset-theme {
            padding: 8px 15px;
            background: #ef4444;
            color: #f8fafc;
            border: 1px solid #dc2626;
            cursor: pointer;
            font-family: 'Vibur', cursive;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 5px;
        }
        
        .btn-reset-theme:hover {
            background: #dc2626;
        }

        .theme-save-status {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 1.1rem;
            text-align: center;
            min-height: 1.2em;
        }

        .ledger-box {
            border: 1px solid #334155; background: #0f172a; padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); width: 95%; max-width: 600px;
            display: none; 
        }
        .ledger-header {
            color: #818cf8; border-bottom: 1px solid #334155; padding-bottom: 15px;
            margin-bottom: 25px; font-size: 2.8rem; text-align: center;
        }
        .member-row { padding: 15px 0; border-bottom: 1px solid #1e293b; }
        .member-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .name { color: #94a3b8; font-size: 2.2rem; display: flex; align-items: center; gap: 10px; }
        .badge-icon { width: 24px; height: 24px; }
        .admin-tag { color: #f59e0b; font-size: 1.4rem; }
        .manager-tag { color: #34d399; font-size: 1.4rem; }
        .score { color: #10b981; font-size: 2.5rem; }
        
        /* Buttons are hidden by default via CSS */
        .controls { display: none; gap: 8px; flex-wrap: wrap; }
        
        .btn {
            padding: 5px 15px; border: 1px solid #334155; background: #020617;
            color: #f8fafc; cursor: pointer; font-size: 1.4rem; 
            font-family: 'Vibur', cursive; transition: 0.2s;
        }
        .btn:hover { background: #1e293b; border-color: #818cf8; color: #818cf8; }
        .btn-neg { color: #ef4444; border-color: #450a0a; }
        .btn-reset { color: #f59e0b; border-color: #451a03; }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn-nav {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 1px solid #334155;
            background: #020617;
            color: #818cf8;
            cursor: pointer;
            font-size: 1.6rem;
            font-family: 'Vibur', cursive;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        
        .btn-nav:hover {
            background: #1e293b;
            border-color: #818cf8;
            color: #10b981;
        }
        
        #login-screen { text-align: center; border: 1px solid #334155; padding: 30px; background: #0f172a; width: 320px; }
        input { 
            background: #020617; border: 1px solid #334155; color: white; 
            padding: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box; 
            font-family: 'Vibur', cursive; font-size: 1.6rem; text-align: center;
        }
        #error-msg { color: #ef4444; font-size: 1.2rem; margin-top: 10px; }
    </style>
</head>

        const VALID_MEMBERS = ['ghadi', 'dahlia', 'yara', 'jad', 'marwan', 'mak', 'hicham'];
        const DISPLAY_NAMES = { ghadi: 'Ghadi', dahlia: 'Dahlia', marwan: 'Marwan', yara: 'Yara', hicham: 'Hicham', mak: 'Mohammad-ali', jad: 'Jad' };
        let ROLES = {}, POINTS = {}, PROFILES = {}, NOTES = {}, ORDER = [];

        function getActiveUser() { return sessionStorage.getItem("matix_auth_user") || sessionStorage.getItem("mx_user") || null; }
        function roleOfLocal(u) {
            if (!u) return 'user';
            if (ROLES[u] === 'owner' || ROLES[u] === 'admin' || ROLES[u] === 'manager' || ROLES[u] === 'member' || ROLES[u] === 'user') return ROLES[u];
            if (u === 'ghadi') return 'owner';
            if (VALID_MEMBERS.indexOf(u) > -1) return 'member';
            return 'user';
        }
        function isMemberUser(u) { const r = roleOfLocal(u); return r === 'member' || r === 'admin' || r === 'owner' || r === 'manager'; }
        function isAdminUser(u) { const r = roleOfLocal(u); return r === 'admin' || r === 'manager' || r === 'owner' || (PROFILES[u] && PROFILES[u].isAdmin); }
        function displayNameFor(u) { return DISPLAY_NAMES[u] || (u.charAt(0).toUpperCase() + u.slice(1)); }
        function mxAlert(message, opts) {
            opts = opts || {};
            var msg = String(message == null ? '' : message);
            var title = opts.title, danger = opts.danger, success = opts.success;
            if (title === undefined) {
                if (/^ERROR[:\s]*/i.test(msg)) { danger = true; title = 'Invalid action'; msg = msg.replace(/^ERROR[:\s]*/i, ''); }
                else if (/^REQUEST_DENIED[:\s]*/i.test(msg)) { danger = true; title = 'Request denied'; msg = msg.replace(/^REQUEST_DENIED[:\s]*/i, '') || 'The request was denied.'; }
                else if (/^REQUEST_SENT[:\s]*/i.test(msg)) { success = true; title = 'Request sent'; msg = msg.replace(/^REQUEST_SENT[:\s]*/i, ''); }
                else if (/^APPROVED[:\s]*/i.test(msg)) { success = true; title = 'Approved'; msg = msg.replace(/^APPROVED[:\s]*/i, ''); }
                else { title = 'Notice'; }
            }
            var accent = danger ? '#f87171' : (success ? '#34d399' : '#f59e0b');
            var old = document.getElementById('mxa-ui'); if (old && old.parentNode) old.parentNode.removeChild(old);
            var ov = document.createElement('div'); ov.id = 'mxa-ui';
            ov.style.cssText = 'position:fixed;inset:0;z-index:100050;display:flex;align-items:center;justify-content:center;background:rgba(2,7,22,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px;box-sizing:border-box;font-family:"Trebuchet MS",Arial,sans-serif';
            var box = document.createElement('div');
            box.style.cssText = 'max-width:430px;width:100%;background:rgba(10,15,30,.99);border:1px solid rgba(59,130,246,.45);border-top:4px solid ' + accent + ';border-radius:14px;box-shadow:0 32px 80px rgba(0,0,0,.9);padding:20px;box-sizing:border-box';
            var h = document.createElement('h3'); h.textContent = title; h.style.cssText = 'color:' + accent + ';font-size:1.12rem;font-weight:800;margin:0 0 10px';
            var p = document.createElement('p'); p.textContent = msg; p.style.cssText = 'color:#cbd5e1;font-size:.9rem;line-height:1.55;margin:0 0 14px;white-space:pre-wrap';
            var row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end';
            var ok = document.createElement('button'); ok.type = 'button'; ok.textContent = opts.okLabel || 'OK';
            ok.style.cssText = 'background:linear-gradient(90deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:9px;padding:8px 22px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit';
            row.appendChild(ok); box.appendChild(h); box.appendChild(p); box.appendChild(row);
            ov.appendChild(box); document.body.appendChild(ov);
            function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener('keydown', onKey); }
            function onKey(e) { if (e.key === 'Escape' || e.key === 'Enter') close(); }
            ok.addEventListener('click', close);
            ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
            document.addEventListener('keydown', onKey);
            ok.focus();
            return close;
        }

        function memberList() {
            const set = {};
            VALID_MEMBERS.forEach(function (u) { set[u] = 1; });
            Object.keys(POINTS).forEach(function (u) { if (isMemberUser(u)) set[u] = 1; });
            Object.keys(ROLES).forEach(function (u) { const r = ROLES[u]; if (r === 'member' || r === 'admin' || r === 'manager' || r === 'owner') set[u] = 1; });
            return Object.keys(set).sort(function (a, b) {
                var ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
                if (ia !== -1 || ib !== -1) { if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; }
                if (a === 'ghadi') return -1; if (b === 'ghadi') return 1; return a < b ? -1 : (a > b ? 1 : 0);
            });
        }

        function mkBtn(label, cls, extraStyle, fn) {

        // Owner-only: save a private note about a member.
        function saveMemberNote(user, val, statusEl) {
            var v = (val || '').trim();
            var ref = db.ref('member_notes/' + user);
            if (statusEl) statusEl.textContent = 'Saving…';
            var p = v ? ref.set(v) : ref.remove();
            p.then(function () { if (statusEl) { statusEl.textContent = 'Saved ✓'; setTimeout(function () { statusEl.textContent = ''; }, 1500); } })
                .catch(function () { if (statusEl) statusEl.textContent = 'Failed'; });
        }
        // Owner-only: read the current DOM order of member rows and persist it.
        function persistMemberOrder(wrap) {
            var order = Array.prototype.slice.call(wrap.querySelectorAll('.member-entry'))
                .map(function (el) { return el.getAttribute('data-user'); })
                .filter(Boolean);
            db.ref('member_order').set(order);
        }
        // Owner-only: hold the drag handle and move a member row vertically to reorder.
        function attachMemberDrag(handle, entry) {
            handle.addEventListener('pointerdown', function (e) {
                e.preventDefault();
                var wrap = entry.parentNode;
                if (!wrap) return;
                entry.classList.add('dragging');
                try { handle.setPointerCapture(e.pointerId); } catch (err) { }
                function onMove(ev) {
                    var y = ev.clientY;
                    var sibs = Array.prototype.slice.call(wrap.querySelectorAll('.member-entry')).filter(function (el) { return el !== entry; });
                    var next = null;
                    for (var i = 0; i < sibs.length; i++) {
                        var rect = sibs[i].getBoundingClientRect();
                        if (y < rect.top + rect.height / 2) { next = sibs[i]; break; }
                    }
                    if (next) { if (entry.nextElementSibling !== next) wrap.insertBefore(entry, next); }
                    else if (wrap.lastElementChild !== entry) { wrap.appendChild(entry); }
                }
                function onUp() {
                    entry.classList.remove('dragging');
                    document.removeEventListener('pointermove', onMove);
                    document.removeEventListener('pointerup', onUp);
                    document.removeEventListener('pointercancel', onUp);
                    try { handle.releasePointerCapture(e.pointerId); } catch (err) { }
                    persistMemberOrder(wrap);
                }
                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', onUp);
                document.addEventListener('pointercancel', onUp);
            });
        }

        // ---- Per-user points page + in-app routing (clean /membersonly/points/<username> URLs, no server rewrites needed) ----
        const POINTS_BASE = '/membersonly/points/';
        let activeView = 'ledger', activeViewUser = null;

        // Read the target user from a real query string (?u=<username>) so the URL
        // survives a hard reload on static hosting (no server rewrites, no 404s).
        function routeUserFromPath() {
            var u = null;
            try { u = new URLSearchParams(location.search).get('u'); } catch (e) { }
            if (!u) return null;
            u = String(u).trim().toLowerCase();
            if (!u || u === 'how-to-get' || u === 'use-points') return null;
            return u;
        }

        function navigateToUser(user) {
            history.pushState({ mxUser: user }, '', location.pathname + '?u=' + encodeURIComponent(user));
            showUserPage(user);
        }

        function showLedgerView() {
            const uv = document.getElementById('user-view'); if (uv) uv.style.display = 'none';

            renderUserView(user);
        }

        function refreshViews() {
            if (activeView === 'user' && activeViewUser) renderUserView(activeViewUser);
            else renderLedger();
        }

        function routeView() {
            const u = routeUserFromPath();
            if (u) showUserPage(u); else showLedgerView();
        }
        window.addEventListener('popstate', function () { routeView(); });

        function showGate(msg) {

        function showContent() {
            const activeUser = getActiveUser();
            if (!activeUser) { showGate(''); return; }
            db.ref('roles').once('value').then(function (snap) {
                ROLES = snap.val() || {};
                if (!isMemberUser(activeUser)) {
                    showGate('ACCESS_DENIED: The points ledger is for Matix members, admins, and the owner. Ask an admin to add you.');
                    return;
                }
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                // Point/redemption requests now reach the owner as notifications instead of an on-page box.

                    }
                });
                const cachedTheme = localStorage.getItem('matix_theme_hue');

        // Push a stored notification into the shared center (read by nav.js).
        function pushNotif(user, type, title, body, extra) {
            if (!user) return;
            var payload = { type: type, title: title, body: body, at: Date.now() };
            if (extra) { Object.keys(extra).forEach(function (k) { payload[k] = extra[k]; }); }

        db.ref('member_notes').on('value', function (s) { NOTES = s.val() || {}; refreshViews(); });
        db.ref('member_order').on('value', function (s) { var v = s.val(); ORDER = Array.isArray(v) ? v.filter(Boolean) : (v ? Object.keys(v).map(function (k) { return v[k]; }) : []); refreshViews(); });
        db.ref('roles').on('value', function (snapshot) { ROLES = snapshot.val() || {}; refreshViews(); });

        // UPDATE LOGIC
        function addPoints(name, amount) {
            const activeUser = getActiveUser();
            const isGhadi = activeUser === 'ghadi';
            const isMgr = roleOfLocal(activeUser) === 'manager';

            // Ghadi and managers can apply points directly, no approval needed
            if (isGhadi || isMgr) {
                db.ref('points/' + name).once('value').then((snap) => {
                    const prevValue = snap.val() || 0;
                    let newValue = prevValue + amount;
                    if (newValue < 0) newValue = 0;
                    db.ref('points/' + name).set(newValue).then(() => {
                        pushNotif(name, 'points', '⭐ Points updated', (amount > 0 ? 'You earned ' : 'You lost ') + Math.abs(amount) + ' points!');
                        if (isMgr) {
                            pushNotif('ghadi', 'manager_points', '⭐ Manager changed points', displayNameFor(activeUser) + ' ' + (amount > 0 ? 'added ' : 'removed ') + Math.abs(amount) + ' points for ' + displayNameFor(name) + '.', { targetUser: name, prevValue: prevValue, newValue: newValue });
                        }
                    });
                });
            } else {
                // Plain admins still need approval
                const reqRef = db.ref('point_requests').push({
                    requestedBy: activeUser,
                    targetUser: name,
                    amount: amount,
                    status: 'pending',
                    timestamp: Date.now()
                });
                reqRef.then(() => {
                    pushNotif('ghadi', 'points_request', '📊 Point change request', displayNameFor(activeUser) + ' wants to ' + (amount > 0 ? 'add ' : 'remove ') + Math.abs(amount) + ' points for ' + displayNameFor(name) + '.', { requestId: reqRef.key, requestedBy: activeUser, targetUser: name, amount: amount });
                    mxAlert(`REQUEST_SENT: ${activeUser.toUpperCase()} asked to ${amount > 0 ? 'add' : 'remove'} ${Math.abs(amount)} points for ${name.toUpperCase()}`);
                });
            }
        }

        function resetPerson(name) {
            const activeUser = getActiveUser();
            const isMgr = roleOfLocal(activeUser) === 'manager';

            if (activeUser === 'ghadi' || isMgr) {
                // Ghadi and managers can reset directly, no approval needed
                if(confirm("SYSTEM_ACTION: Reset " + name.toUpperCase() + "'s points?")) {
                    db.ref('points/' + name).once('value').then((snap) => {
                        const prevValue = snap.val() || 0;
                        db.ref('points/' + name).set(0).then(() => {
                            if (isMgr) {
                                pushNotif('ghadi', 'manager_points', '🔁 Manager reset points', displayNameFor(activeUser) + ' reset ' + displayNameFor(name) + "'s points.", { targetUser: name, prevValue: prevValue, newValue: 0 });
                            }
                        });
                    });
                }
            } else {
                // Plain admins need to request a reset
                if(confirm("REQUEST: Request to reset " + name.toUpperCase() + "'s points?")) {
                    const reqRef = db.ref('point_requests').push({
                        requestedBy: activeUser,
                        targetUser: name,
                        amount: 'reset',
                        status: 'pending',
                        timestamp: Date.now()
                    });
                    reqRef.then(() => {
                        pushNotif('ghadi', 'points_request', '📊 Point reset request', displayNameFor(activeUser) + ' wants to reset ' + displayNameFor(name) + "'s points.", { requestId: reqRef.key, requestedBy: activeUser, targetUser: name, amount: 'reset' });
                        mxAlert(`REQUEST_SENT: Point reset request for ${name} sent to admin for approval`);
                    });
                }
            }
        }
        
        // ADD CUSTOM POINTS
        function addCustomPoints(name) {
            const amount = prompt(`Enter points to ADD for ${name.toUpperCase()}:`, '50');
            if (amount === null) return; // User cancelled
            
            const pointsToAdd = parseInt(amount);
            if (isNaN(pointsToAdd) || pointsToAdd <= 0) {
                mxAlert('ERROR: Please enter a valid positive number');
                return;
            }
            
            const activeUser = getActiveUser();
            
            if (activeUser === 'ghadi' || roleOfLocal(activeUser) === 'manager') {
                // Ghadi and managers can add directly
                if (confirm(`ADD ${pointsToAdd} points to ${name.toUpperCase()}?`)) {
                    addPoints(name, pointsToAdd);
                }
            } else {
                // Admins need to request approval
                if (confirm(`REQUEST to ADD ${pointsToAdd} points to ${name.toUpperCase()}?`)) {
                    addPoints(name, pointsToAdd);
                }
            }
        }
        
        // REMOVE CUSTOM POINTS
        function removeCustomPoints(name) {
            const amount = prompt(`Enter points to REMOVE from ${name.toUpperCase()}:`, '50');
            if (amount === null) return; // User cancelled
            
            const pointsToRemove = parseInt(amount);
            if (isNaN(pointsToRemove) || pointsToRemove <= 0) {
                mxAlert('ERROR: Please enter a valid positive number');
                return;
            }
            
            const activeUser = getActiveUser();
            
            if (activeUser === 'ghadi' || roleOfLocal(activeUser) === 'manager') {
                // Ghadi and managers can remove directly
                if (confirm(`REMOVE ${pointsToRemove} points from ${name.toUpperCase()}?`)) {
                    addPoints(name, -pointsToRemove);
                }
            } else {
                // Admins need to request approval
                if (confirm(`REQUEST to REMOVE ${pointsToRemove} points from ${name.toUpperCase()}?`)) {
                    addPoints(name, -pointsToRemove);
                }
            }
        }
        
        // NOTIFICATION SYSTEM FOR GHADI
        function loadNotifications() {
            const notifArea = document.getElementById('notifications-area');
            
            // Listen for pending requests
            db.ref('requests').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
                notifArea.innerHTML = '';
                
                const requests = snapshot.val();
                if (!requests) {
                    notifArea.style.display = 'none';
                    return;
                }
                
                notifArea.style.display = 'block';
                
                Object.keys(requests).forEach(requestId => {
                    const req = requests[requestId];
                    const notifDiv = document.createElement('div');
                    notifDiv.className = 'notification-item';
                    notifDiv.innerHTML = `
                        <div class="notif-header">🔔 New Redemption Request</div>
                        <div class="notif-details">
                            <strong>${req.user.toUpperCase()}</strong> wants to redeem <strong>${req.cost} points</strong> for <strong>${req.reward}</strong>
                        </div>
                        <div class="notif-actions">
                            <button class="btn-approve" onclick="approveRequest('${requestId}', '${req.user}', ${req.cost}, '${req.reward}')">Approve</button>
                            <button class="btn-deny" onclick="denyRequest('${requestId}', '${req.user}', '${req.reward}')">Deny</button>
                        </div>
                    `;
                    notifArea.appendChild(notifDiv);
                });
            });
        }
        
        // POINT REQUEST NOTIFICATIONS FOR GHADI
        function loadPointRequests() {
            const notifArea = document.getElementById('notifications-area');
            
            db.ref('point_requests').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
                const pointRequests = snapshot.val();
                if (!pointRequests) return;
                
                notifArea.style.display = 'block';
                
                Object.keys(pointRequests).forEach(requestId => {
                    const req = pointRequests[requestId];
                    const notifDiv = document.createElement('div');
                    notifDiv.className = 'notification-item';
                    
                    let message;
                    if (req.amount === 'reset') {
                        message = `<strong>${req.requestedBy.toUpperCase()}</strong> wants to <strong>RESET</strong> points for user <strong>${req.targetUser.toUpperCase()}</strong>`;
                    } else {
                        const action = req.amount > 0 ? 'add' : 'remove';
                        const absAmount = Math.abs(req.amount);
                        message = `<strong>${req.requestedBy.toUpperCase()}</strong> wants to ${action} <strong>${absAmount} points</strong> for user <strong>${req.targetUser.toUpperCase()}</strong>`;
                    }
                    
                    notifDiv.innerHTML = `
                        <div class="notif-header">📊 Point Change Request</div>
                        <div class="notif-details">${message}</div>
                        <div class="notif-actions">
                            <button class="btn-approve" onclick="approvePointRequest('${requestId}', '${req.targetUser}', '${req.amount}')">Approve</button>
                            <button class="btn-deny" onclick="denyPointRequest('${requestId}')">Deny</button>
                        </div>
                    `;
                    notifArea.appendChild(notifDiv);
                });
            });
        }
        
        function approveRequest(requestId, user, cost, reward) {
            if (!confirm(`CONFIRM: Approve ${cost} points deduction for ${user}?`)) {
                return;
            }
            
            // Deduct points from user
            db.ref('points/' + user).transaction((current) => {
                let newValue = (current || 0) - cost;
                return newValue < 0 ? 0 : newValue;
            }).then(() => {
                // Update request status
                db.ref('requests/' + requestId).update({
                    status: 'approved',
                    approvedBy: 'ghadi',
                    approvedAt: Date.now()
                }).then(() => {
                    mxAlert(`APPROVED: ${cost} points deducted from ${user}`); pushNotif(user, 'redeem', '🎁 Redemption approved', 'Your request to redeem ' + cost + ' points for ' + (reward || 'a reward') + ' was approved!');
                });
            });
        }
        
        function denyRequest(requestId, user, reward) {
            if (!confirm('CONFIRM: Deny this request?')) {
                return;
            }
            
            db.ref('requests/' + requestId).update({
                status: 'denied',
                deniedBy: 'ghadi',
                deniedAt: Date.now()
            }).then(() => {
                mxAlert('REQUEST_DENIED'); pushNotif(user, 'redeem', '🎁 Redemption declined', 'Your request to redeem ' + (reward || 'a reward') + ' was declined.');
            });
        }
        
        // APPROVE POINT REQUEST
        function approvePointRequest(requestId, targetUser, amount) {
            // Handle reset case
            if (amount === 'reset') {
                if (!confirm(`CONFIRM: Reset ${targetUser}'s points to 0?`)) {
                    return;
                }
                
                db.ref('points/' + targetUser).set(0).then(() => {
                    db.ref('point_requests/' + requestId).update({
                        status: 'approved',
                        approvedBy: 'ghadi',
                        approvedAt: Date.now()
                    }).then(() => {
                        mxAlert(`APPROVED: ${targetUser}'s points have been reset`); pushNotif(targetUser, 'points', '⭐ Points reset', 'Your points were reset to 0 by the admin.');
                    });
                });
                return;
            }
            
            // Handle regular point changes
            if (!confirm(`CONFIRM: ${amount > 0 ? 'Add' : 'Remove'} ${Math.abs(amount)} points for ${targetUser}?`)) {
                return;
            }
            
            // Apply the point change
            db.ref('points/' + targetUser).transaction((current) => {
                let newValue = (current || 0) + amount;
                return newValue < 0 ? 0 : newValue;
            }).then(() => {
                // Update request status
                db.ref('point_requests/' + requestId).update({
                    status: 'approved',
                    approvedBy: 'ghadi',
                    approvedAt: Date.now()
                }).then(() => {
                    mxAlert(`APPROVED: Points updated for ${targetUser}`); pushNotif(targetUser, 'points', '⭐ Points updated', 'Your points were updated by the admin.');
                });
            });
        }
        
        // DENY POINT REQUEST
        function denyPointRequest(requestId) {
            if (!confirm('CONFIRM: Deny this point change request?')) {
                return;
            }
            
            db.ref('point_requests/' + requestId).update({
                status: 'denied',
                deniedBy: 'ghadi',
                deniedAt: Date.now()
            }).then(() => {
                mxAlert('REQUEST_DENIED');
            });
        }
        
        // ADMIN PRIVILEGE FUNCTIONS (TESTING)
        function giveAdmin(user) {
            if (!confirm(`Give admin privileges to ${user.toUpperCase()}?`)) {
                return;
            }
            
            db.ref('roles/' + user).set('admin').then(() => {
                db.ref('profiles/' + user + '/isAdmin').set(true);
                db.ref('members/' + user + '/testUser').set(true); // Admins are obliged to be included as test users
                pushNotif(user, 'role', '⬆ You were promoted', 'You are now a Matix Admin!');
                mxAlert(displayNameFor(user) + ' is now an admin across all of Matix.');
            });
        }
        
        function removeAdmin(user) {
            if (!confirm(`Remove admin privileges from ${user.toUpperCase()}?`)) {
                return;
            }
            const activeUser = getActiveUser();
            db.ref('roles/' + user).set('member').then(() => {
                db.ref('profiles/' + user + '/isAdmin').set(false);
                pushNotif(user, 'role', '⬇ Your role changed', 'You are now a Matix Member.');
                if (activeUser !== 'ghadi') {
                    pushNotif('ghadi', 'manager_role_change', '⬇ Manager removed admin', displayNameFor(activeUser) + ' removed admin privileges from ' + displayNameFor(user) + '.', { targetUser: user, prevRole: 'admin', newRole: 'member' });
                }
                mxAlert(displayNameFor(user) + ' is no longer an admin.');
            });
        }

        function giveManager(user) {
            if (!confirm(`Promote ${user.toUpperCase()} to manager?`)) {
                return;
            }

            db.ref('roles/' + user).set('manager').then(() => {
                db.ref('profiles/' + user + '/isAdmin').set(true);
                db.ref('members/' + user + '/testUser').set(true); // Managers are obliged to be included as test users
                db.ref('points/' + user).transaction((current) => (current || 0) + 200);
                pushNotif(user, 'role', '⬆ You were promoted', 'You are now a Matix Manager and got 200 bonus points!');
                mxAlert(displayNameFor(user) + ' is now a manager across all of Matix.');
            });
        }

        function removeManager(user) {
            if (!confirm(`Remove manager privileges from ${user.toUpperCase()}?`)) {
                return;
            }
            const activeUser = getActiveUser();
            db.ref('roles/' + user).set('admin').then(() => {
                pushNotif(user, 'role', '⬇ Your role changed', 'You are now a Matix Admin.');
                if (activeUser !== 'ghadi') {
                    pushNotif('ghadi', 'manager_role_change', '⬇ Manager removed manager', displayNameFor(activeUser) + ' removed manager privileges from ' + displayNameFor(user) + '.', { targetUser: user, prevRole: 'manager', newRole: 'admin' });
                }
                mxAlert(displayNameFor(user) + ' is no longer a manager.');
            });
        }
        
        // Apply custom theme for logged-in user
        function applyUserTheme(user, theme) {
            const currentUser = sessionStorage.getItem("matix_auth_user");
            if (currentUser === user && theme) {
                document.documentElement.style.filter = `hue-rotate(${theme}deg)`;
            }
        }

        function setThemeStatus(message, isError = false) {
            const statusEl = document.getElementById('theme-save-status');
            if (!statusEl) return;

            statusEl.innerText = message;
            statusEl.style.color = isError ? '#fca5a5' : '#34d399';

            clearTimeout(window._themeStatusTimer);
            window._themeStatusTimer = setTimeout(() => {
                statusEl.innerText = '';
            }, 2200);
        }
        
        // Theme customizer functions
        function setupThemeSlider() {
            const slider = document.getElementById('theme-slider');
            const valueDisplay = document.getElementById('theme-value');
            if (!slider || !valueDisplay) return;
            const activeUser = sessionStorage.getItem("matix_auth_user");
            
            slider.addEventListener('input', function() {
                const hueValue = this.value;
                valueDisplay.innerText = hueValue + '°';
                document.documentElement.style.filter = `hue-rotate(${hueValue}deg)`;
                
                // Save to localStorage and set flag
                localStorage.setItem('matix_theme_hue', hueValue);
                localStorage.setItem('haschangedcolor', 'true');

                // Save to Firebase so the theme follows the user across devices
                if (activeUser) {
                    db.ref('profiles/' + activeUser + '/customTheme').set(parseInt(hueValue));
                }

                setThemeStatus(`Saved ${hueValue}° for @${activeUser || 'guest'}`);
            });
        }
        
        function resetTheme() {
            document.documentElement.style.filter = '';
            localStorage.removeItem('matix_theme_hue');
            localStorage.removeItem('haschangedcolor');
            const rs = document.getElementById('theme-slider'); if (rs) rs.value = 0;
            const rv = document.getElementById('theme-value'); if (rv) rv.innerText = '0°';

            const activeUser = sessionStorage.getItem("matix_auth_user");
            if (activeUser) {
                db.ref('profiles/' + activeUser + '/customTheme').remove();
            }

            setThemeStatus('Theme reset to default.');
        }
        //checks if current user is ghadi or an admin so it can put the adminKey into local storage so it can be used in other pages
        function checkAdminKey() {
            const activeUser = sessionStorage.getItem("matix_auth_user");
            if (activeUser === 'ghadi') {
                localStorage.setItem('adminKey', 'ghadi');
            } else {
                db.ref('profiles/' + activeUser).once('value').then((snapshot) => {
                    const profile = snapshot.val() || {};
                    if (profile.isAdmin) {
                        localStorage.setItem('adminKey', activeUser);
                    }
                });
            }
        }
        checkAdminKey();
    </script>
<script src="/nav.js" defer></script>
