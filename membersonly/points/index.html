    <title>MATIX | Sync Points</title>
    <link href="https://fonts.googleapis.com/css2?family=Vibur&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Vibur', cursive;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .logo-area { margin-bottom: 10px; }
        .logo-area svg { width: 200px; height: auto; }
        .logo-area svg g { fill: #818cf8 !important; }
        
        .notifications-area {
            display: none;
            width: 95%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        
        .notification-item {
            background: #1e293b;
            border: 1px solid #f59e0b;
            border-left: 3px solid #f59e0b;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .notif-header {
            color: #f59e0b;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        
        .notif-details {
            color: #94a3b8;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .notif-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-approve {
            padding: 6px 18px;
            background: #10b981;
            color: #020617;
            border: 1px solid #059669;
            cursor: pointer;
            font-family: 'Vibur', cursive;
            font-size: 1.4rem;
            transition: 0.2s;
        }
        
        .btn-approve:hover {
            background: #059669;
        }
        
        .btn-deny {
            padding: 6px 18px;
            background: #ef4444;
            color: #020617;
            border: 1px solid #dc2626;
            cursor: pointer;
            font-family: 'Vibur', cursive;
            font-size: 1.4rem;
            transition: 0.2s;
        }
        
        .btn-deny:hover {
            background: #dc2626;
        }
        
        .theme-customizer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
        }
        
        .theme-customizer-title {
            color: #818cf8;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        
        .theme-slider {
            width: 100%;
            margin: 10px 0;
        }
        
        .theme-value {
            color: #10b981;
            font-size: 1.6rem;
            text-align: center;
        }
        
        .btn-reset-theme {
            padding: 8px 15px;
            background: #ef4444;
            color: #f8fafc;
            border: 1px solid #dc2626;
            cursor: pointer;
            font-family: 'Vibur', cursive;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 5px;
        }
        
        .btn-reset-theme:hover {
            background: #dc2626;
        }

        .ledger-box {
            border: 1px solid #334155; background: #0f172a; padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); width: 95%; max-width: 600px;
            display: none; 
        }
        .ledger-header {
            color: #818cf8; border-bottom: 1px solid #334155; padding-bottom: 15px;
            margin-bottom: 25px; font-size: 2.8rem; text-align: center;
        }
        .member-row { padding: 15px 0; border-bottom: 1px solid #1e293b; }
        .member-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .name { color: #94a3b8; font-size: 2.2rem; display: flex; align-items: center; gap: 10px; }
        .badge-icon { width: 24px; height: 24px; }
        .admin-tag { color: #f59e0b; font-size: 1.4rem; }
        .score { color: #10b981; font-size: 2.5rem; }
        
        /* Buttons are hidden by default via CSS */
        .controls { display: none; gap: 8px; flex-wrap: wrap; }
        
        .btn {
            padding: 5px 15px; border: 1px solid #334155; background: #020617;
            color: #f8fafc; cursor: pointer; font-size: 1.4rem; 
            font-family: 'Vibur', cursive; transition: 0.2s;
        }
        .btn:hover { background: #1e293b; border-color: #818cf8; color: #818cf8; }
        .btn-neg { color: #ef4444; border-color: #450a0a; }
        .btn-reset { color: #f59e0b; border-color: #451a03; }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn-nav {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 1px solid #334155;
            background: #020617;
            color: #818cf8;
            cursor: pointer;
            font-size: 1.6rem;
            font-family: 'Vibur', cursive;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        
        .btn-nav:hover {
            background: #1e293b;
            border-color: #818cf8;
            color: #10b981;
        }
        
        #login-screen { text-align: center; border: 1px solid #334155; padding: 30px; background: #0f172a; width: 320px; }
        input { 
            background: #020617; border: 1px solid #334155; color: white; 
            padding: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box; 
            font-family: 'Vibur', cursive; font-size: 1.6rem; text-align: center;
        }
        #error-msg { color: #ef4444; font-size: 1.2rem; margin-top: 10px; }
    </style>

        };

        function checkLogin() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            if (validUsers[user] && validUsers[user] === pass) {
                // Store the username directly so we can check it after refresh
                sessionStorage.setItem("matix_auth_user", user);
                showContent();
            } else {
                errorDiv.innerText = "ACCESS_DENIED: INVALID_CREDENTIALS";
            }
        }

        function showContent() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            
            // Check if the signed-in user is 'ghadi'
            const activeUser = sessionStorage.getItem("matix_auth_user");
            if (activeUser === 'ghadi') {
                // Select all control elements and display them
                const allControls = document.querySelectorAll('.controls');
                allControls.forEach(controlBlock => {
                    controlBlock.style.display = 'flex';
                });
                
                // Enable notifications for admin
                loadNotifications();
            }
            
            // Load user's custom theme if they have one
            db.ref('profiles/' + activeUser).once('value').then((snapshot) => {
                const profile = snapshot.val() || {};
                if (profile.customTheme) {
                    document.documentElement.style.filter = `hue-rotate(${profile.customTheme}deg)`;
                    document.getElementById('theme-slider').value = profile.customTheme;
                    document.getElementById('theme-value').innerText = profile.customTheme + '°';
                }
            });
            
            // Load cached theme from localStorage
            const cachedTheme = localStorage.getItem('matix_theme_hue');
            if (cachedTheme) {
                document.documentElement.style.filter = `hue-rotate(${cachedTheme}deg)`;
                document.getElementById('theme-slider').value = cachedTheme;
                document.getElementById('theme-value').innerText = cachedTheme + '°';
            }
            
            // Setup theme slider
            setupThemeSlider();
        }

        function logout() {
            sessionStorage.removeItem("matix_auth_user");
            location.reload();
        }

        // Keep session open if already authorized
        if (sessionStorage.getItem("matix_auth_user")) { showContent(); }

        // REALTIME LISTENER
        db.ref('points').on('value', (snapshot) => {
            const val = snapshot.val() || { ghadi: 0, marwan: 0, jad: 0, dahlia: 0};
            document.getElementById('score-ghadi').innerText = val.ghadi || 0;
            document.getElementById('score-marwan').innerText = val.marwan || 0;
            document.getElementById('score-jad').innerText = val.jad || 0;
            document.getElementById('score-dahlia').innerText = val.dahlia || 0;
        });
        
        // Listen for user profiles (badges and admin status)
        db.ref('profiles').on('value', (snapshot) => {
            const profiles = snapshot.val() || {};
            
            ['ghadi', 'dahlia', 'marwan', 'jad'].forEach(user => {
                const profile = profiles[user] || {};
                
                // Update badge
                const badgeEl = document.getElementById('badge-' + user);
                if (profile.hasBadge) {
                    badgeEl.innerHTML = '<img src=\"/favicon.svg\" class=\"badge-icon\" title=\"Badge Unlocked\">';
                } else {
                    badgeEl.innerHTML = '';
                }
                
                // Update admin tag
                const adminEl = document.getElementById('admin-' + user);
                if (profile.isAdmin) {
                    adminEl.innerText = '(admin)';
                } else {
                    adminEl.innerText = '';
                }
                
                // Apply custom theme
                if (profile.customTheme) {
                    applyUserTheme(user, profile.customTheme);
                }
            });
        });

        // UPDATE LOGIC
        function addPoints(name, amount) {
            db.ref('points/' + name).transaction((current) => {
                let newValue = (current || 0) + amount;
                return newValue < 0 ? 0 : newValue;
            });
        }

        function resetPerson(name) {
            if(confirm("SYSTEM_ACTION: Reset " + name.toUpperCase() + "'s points?")) {
                db.ref('points/' + name).set(0);
            }
        }
        
        // ADD CUSTOM POINTS
        function addCustomPoints(name) {
            const amount = prompt(`Enter points to ADD for ${name.toUpperCase()}:`, '50');
            if (amount === null) return; // User cancelled
            
            const pointsToAdd = parseInt(amount);
            if (isNaN(pointsToAdd) || pointsToAdd <= 0) {
                alert('ERROR: Please enter a valid positive number');
                return;
            }
            
            if (confirm(`ADD ${pointsToAdd} points to ${name.toUpperCase()}?`)) {
                addPoints(name, pointsToAdd);
            }
        }
        
        // REMOVE CUSTOM POINTS
        function removeCustomPoints(name) {
            const amount = prompt(`Enter points to REMOVE from ${name.toUpperCase()}:`, '50');
            if (amount === null) return; // User cancelled
            
            const pointsToRemove = parseInt(amount);
            if (isNaN(pointsToRemove) || pointsToRemove <= 0) {
                alert('ERROR: Please enter a valid positive number');
                return;
            }
            
            if (confirm(`REMOVE ${pointsToRemove} points from ${name.toUpperCase()}?`)) {
                addPoints(name, -pointsToRemove);
            }
        }
        
        // NOTIFICATION SYSTEM FOR GHADI
        function loadNotifications() {
            const notifArea = document.getElementById('notifications-area');
            
            // Listen for pending requests
            db.ref('requests').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
                notifArea.innerHTML = '';
                
                const requests = snapshot.val();
                if (!requests) {
                    notifArea.style.display = 'none';
                    return;
                }
                
                notifArea.style.display = 'block';
                
                Object.keys(requests).forEach(requestId => {
                    const req = requests[requestId];
                    const notifDiv = document.createElement('div');
                    notifDiv.className = 'notification-item';
                    notifDiv.innerHTML = `
                        <div class="notif-header">🔔 New Redemption Request</div>
                        <div class="notif-details">
                            <strong>${req.user.toUpperCase()}</strong> wants to redeem <strong>${req.cost} points</strong> for <strong>${req.reward}</strong>
                        </div>
                        <div class="notif-actions">
                            <button class="btn-approve" onclick="approveRequest('${requestId}', '${req.user}', ${req.cost})">Approve</button>
                            <button class="btn-deny" onclick="denyRequest('${requestId}')">Deny</button>
                        </div>
                    `;
                    notifArea.appendChild(notifDiv);
                });
            });
        }
        
        function approveRequest(requestId, user, cost) {
            if (!confirm(`CONFIRM: Approve ${cost} points deduction for ${user}?`)) {
                return;
            }
            
            // Deduct points from user
            db.ref('points/' + user).transaction((current) => {
                let newValue = (current || 0) - cost;
                return newValue < 0 ? 0 : newValue;
            }).then(() => {
                // Update request status
                db.ref('requests/' + requestId).update({
                    status: 'approved',
                    approvedBy: 'ghadi',
                    approvedAt: Date.now()
                }).then(() => {
                    alert(`APPROVED: ${cost} points deducted from ${user}`);
                });
            });
        }
        
        function denyRequest(requestId) {
            if (!confirm('CONFIRM: Deny this request?')) {
                return;
            }
            
            db.ref('requests/' + requestId).update({
                status: 'denied',
                deniedBy: 'ghadi',
                deniedAt: Date.now()
            }).then(() => {
                alert('REQUEST_DENIED');
            });
        }
        
        // ADMIN PRIVILEGE FUNCTIONS (TESTING)
        function giveAdmin(user) {
            if (!confirm(`Give admin privileges to ${user.toUpperCase()}?`)) {
                return;
            }
            
            db.ref('profiles/' + user + '/isAdmin').set(true).then(() => {
                alert(`ADMIN_GRANTED: ${user} now has admin privileges`);
            });
        }
        
        function removeAdmin(user) {
            if (!confirm(`Remove admin privileges from ${user.toUpperCase()}?`)) {
                return;
            }
            
            db.ref('profiles/' + user + '/isAdmin').set(false).then(() => {
                alert(`ADMIN_REMOVED: ${user} no longer has admin privileges`);
            });
        }
        
        // Apply custom theme for logged-in user
        function applyUserTheme(user, theme) {
            const currentUser = sessionStorage.getItem("matix_auth_user");
            if (currentUser === user && theme) {
                document.documentElement.style.filter = `hue-rotate(${theme}deg)`;
            }
        }
        
        // Theme customizer functions
        function setupThemeSlider() {
            const slider = document.getElementById('theme-slider');
            const valueDisplay = document.getElementById('theme-value');
            
            slider.addEventListener('input', function() {
                const hueValue = this.value;
                valueDisplay.innerText = hueValue + '°';
                document.documentElement.style.filter = `hue-rotate(${hueValue}deg)`;
                
                // Save to localStorage
                localStorage.setItem('matix_theme_hue', hueValue);
            });
        }
        
        function resetTheme() {
            document.documentElement.style.filter = '';
            localStorage.removeItem('matix_theme_hue');
            document.getElementById('theme-slider').value = 0;
            document.getElementById('theme-value').innerText = '0°';
        }
    </script>
</body>
</html>
