<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATIX | Sync Points</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Courier Prime', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .logo-area { color: #818cf8; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; }
        
        .ledger-box {
            border: 1px solid #334155; background: #0f172a; padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); width: 95%; max-width: 600px;
            display: none; 
        }
        .ledger-header {
            color: #818cf8; border-bottom: 1px solid #334155; padding-bottom: 15px;
            margin-bottom: 25px; text-transform: uppercase; letter-spacing: 5px; font-weight: 700; text-align: center;
        }
        .member-row { padding: 20px 0; border-bottom: 1px solid #1e293b; }
        .member-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .name { color: #94a3b8; font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
        .score { color: #10b981; font-weight: 700; font-size: 1.4rem; }
        .controls { display: flex; gap: 5px; justify-content: flex-start; flex-wrap: wrap; }
        
        .btn {
            padding: 8px 12px; border: 1px solid #334155; background: #020617;
            color: #f8fafc; cursor: pointer; font-size: 0.8rem; font-family: 'Courier Prime', monospace;
            font-weight: 700; text-transform: uppercase; transition: 0.2s;
        }
        .btn:hover { background: #1e293b; border-color: #818cf8; }
        .btn-neg { color: #ef4444; border-color: #450a0a; }
        .btn-reset { color: #f59e0b; border-color: #451a03; }
        
        #login-screen { text-align: center; border: 1px solid #334155; padding: 30px; background: #0f172a; width: 320px; }
        input { background: #020617; border: 1px solid #334155; color: white; padding: 12px; margin-bottom: 10px; width: 100%; box-sizing: border-box; display: block; font-family: 'Courier Prime', monospace; }
        #error-msg { color: #ef4444; font-size: 0.7rem; margin-top: 10px; min-height: 1.2em; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <!-- Locate the logo-area at the top of the body -->


    <div class="logo-area">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="173.77" height="51.68" viewBox="0 0 173.77 51.68"><g transform="translate(-153.13,-161.73)"><g fill="#818cf8"><path d="M194.05268,213.35269c-2.45145,0.49029 -2.94174,-1.96116 -2.94174,-1.96116l-0.23157,-1.40539c0,-9.04951 -1.01588,-17.55873 -2.87638,-26.39702c-0.45892,-2.18011 -2.05986,-5.80047 -1.79726,-8.46682c-1.69276,1.11221 -3.02018,2.30525 -4.17995,4.40723c-1.54981,2.80888 -2.71107,8.28259 -6.77123,8.79163c-1.50657,0.18888 -2.74055,-1.33992 -3.97623,-2.22227c-4.5599,-3.256 -7.47398,-9.24515 -11.08407,-13.4581c-0.21833,-0.25479 -0.4636,-0.49803 -0.72228,-0.73428c0.43848,2.4308 0.64813,4.88188 0.52926,7.50731c-0.15612,3.44806 -1.30911,7.02404 -1.64891,10.45517..."></path></g></g></svg>
    </div>

    <!-- The rest of your Ledger code remains the same -->
  

    <!-- LOGIN SECTION -->
    <div id="login-screen">
        <div class="ledger-header">System_Auth</div>
        <input type="text" id="username" placeholder="USERNAME">
        <input type="password" id="password" placeholder="PASSWORD">
        <button class="btn" style="width:100%" onclick="checkLogin()">AUTHORIZE_ACCESS</button>
        <div id="error-msg"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="ledger-box" id="main-content">
        <div class="ledger-header">Sync_Points_Ledger</div>
        
        <!-- 1. GHADI -->
        <div class="member-row">
            <div class="member-info"><span class="name">GHADI:</span> <span class="score" id="score-ghadi">0</span></div>
            <div class="controls">
                <button class="btn" onclick="addPoints('ghadi', 10)">+10</button>
                <button class="btn" onclick="addPoints('ghadi', 1)">+1</button>
                <button class="btn btn-neg" onclick="addPoints('ghadi', -1)">-1</button>
                <button class="btn btn-neg" onclick="addPoints('ghadi', -10)">-10</button>
                <button class="btn btn-reset" onclick="resetPerson('ghadi')">RESET</button>
            </div>
        </div>

        <!-- 2. MARWAN -->
        <div class="member-row">
            <div class="member-info"><span class="name">MARWAN:</span> <span class="score" id="score-marwan">0</span></div>
            <div class="controls">
                <button class="btn" onclick="addPoints('marwan', 10)">+10</button>
                <button class="btn" onclick="addPoints('marwan', 1)">+1</button>
                <button class="btn btn-neg" onclick="addPoints('marwan', -1)">-1</button>
                <button class="btn btn-neg" onclick="addPoints('marwan', -10)">-10</button>
                <button class="btn btn-reset" onclick="resetPerson('marwan')">RESET</button>
            </div>
        </div>

        <!-- 3. JAD -->
        <div class="member-row">
            <div class="member-info"><span class="name">JAD:</span> <span class="score" id="score-jad">0</span></div>
            <div class="controls">
                <button class="btn" onclick="addPoints('jad', 10)">+10</button>
                <button class="btn" onclick="addPoints('jad', 1)">+1</button>
                <button class="btn btn-neg" onclick="addPoints('jad', -1)">-1</button>
                <button class="btn btn-neg" onclick="addPoints('jad', -10)">-10</button>
                <button class="btn btn-reset" onclick="resetPerson('jad')">RESET</button>
            </div>
        </div>

        <button class="btn" style="margin-top:30px; width:100%; opacity:0.5" onclick="logout()">TERMINATE_SESSION</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmJOS_aaOVADbu5cACUoeXHrjfpHTBTdo",
            authDomain: "matix-1d538.firebaseapp.com",
            databaseURL: "https://matix-1d538-default-rtdb.firebaseio.com",
            projectId: "matix-1d538",
            storageBucket: "matix-1d538.firebasestorage.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const validUsers = {
            "ghadi": "iamtheownerofmatix",
            "jad": "ilikebatatameshwiyye",
            "marwan": "ilikebeingnumberonebutiamnumbertwo"
        };

        function checkLogin() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            if (validUsers[user] && validUsers[user] === pass) {
                sessionStorage.setItem("matix_auth", "true");
                showContent();
            } else {
                errorDiv.innerText = "ACCESS_DENIED: INVALID_CREDENTIALS";
            }
        }

        function showContent() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        function logout() {
            sessionStorage.removeItem("matix_auth");
            location.reload();
        }

        if (sessionStorage.getItem("matix_auth") === "true") { showContent(); }

        db.ref('points').on('value', (snapshot) => {
            const val = snapshot.val() || { ghadi: 0, marwan: 0, jad: 0 };
            document.getElementById('score-ghadi').innerText = val.ghadi || 0;
            document.getElementById('score-marwan').innerText = val.marwan || 0;
            document.getElementById('score-jad').innerText = val.jad || 0;
        });

        function addPoints(name, amount) {
            db.ref('points/' + name).transaction((current) => {
                let newValue = (current || 0) + amount;
                return newValue < 0 ? 0 : newValue;
            });
        }

        function resetPerson(name) {
            if(confirm("SYSTEM_ACTION: Reset " + name.toUpperCase() + "'s points?")) {
                db.ref('points/' + name).set(0);
            }
        }
    </script>
</body>
</html>
