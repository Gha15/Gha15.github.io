<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POINTS SYSTEM | Matix</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .points-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #38bdf8;
            display: inline-block;
            padding: 40px;
            border-radius: 20px;
        }
        .point-val { font-size: 4rem; font-weight: bold; color: #38bdf8; }
        .label { text-transform: uppercase; letter-spacing: 3px; color: #94a3b8; }
        
        .status-badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            margin-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="points-card">
        <div class="label">Current Balance</div>
        <div class="point-val">0</div>
        <div class="status-badge">RANK: ROOKIE</div>
    </div>

    <h3 style="margin-top: 40px;">Points History</h3>
    <p style="color: #64748b;">No activities recorded yet.</p>

    <a href="/" style="display:block; margin-top: 50px; color: #475569; text-decoration: none;">← Exit Secure Line</a>

</body>
</html>
