<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATIX | Internal Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Courier Prime', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
            text-align: center;
        }
        .hub-container {
            border: 1px solid #334155;
            background: #0f172a;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            width: 90%;
            max-width: 400px;
        }
        .hub-header {
            color: #818cf8;
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .nav-link {
            display: block;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #1e293b;
            background: #020617;
            color: #10b981;
            text-decoration: none;
            transition: 0.3s;
            font-weight: bold;
        }
        .nav-link:hover {
            border-color: #818cf8;
            background: #1e293b;
            color: #f8fafc;
            transform: translateY(-2px);
        }
        .footer-note {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #334155;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <div class="hub-header">Matix_Hub</div>
        
        <a href="points/" class="nav-link">VIEW GLOBAL LEDGER</a>
        <!-- You can add more links here later, like /missions or /logs -->
        
        <div class="footer-note">Internal Access Only // No Auth Required</div>
    </div>

    <a href="/" style="margin-top: 20px; color: #334155; text-decoration: none; font-size: 0.8rem;">EXIT TO PUBLIC SITE</a>

</body>
</html>
