<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POINTS SYSTEM | Matix</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Courier Prime', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .ledger-box {
            border: 1px solid #334155;
            background: #0f172a;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            width: 90%;
            max-width: 500px;
        }

        .ledger-header {
            color: #818cf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
            text-align: center;
        }

        .member-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #1e293b;
        }

        .member-info {
            flex: 1;
        }

        .name { color: #94a3b8; font-size: 1.1rem; }
        .score { color: #10b981; font-weight: bold; font-size: 1.2rem; margin-left: 5px; }

        .controls {
            display: flex;
            gap: 8px;
        }

        .add-btn {
            padding: 5px 10px;
            border: 1px solid #334155;
            background: #020617;
            color: #f8fafc;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Courier Prime', monospace;
            transition: all 0.2s ease;
        }

        /* Color Coding the Buttons */
        .btn-1:hover { border-color: #38bdf8; color: #38bdf8; }
        .btn-5:hover { border-color: #a855f7; color: #a855f7; }
        .btn-10:hover { border-color: #fbbf24; color: #fbbf24; }

        .back-btn {
            margin-top: 40px;
            color: #334155;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-btn:hover { color: #ef4444; }
    </style>
</head>
<body>

    <div class="ledger-box">
        <div class="ledger-header">Points_Ledger_v1.0</div>
        
        <!-- GHADI -->
        <div class="member-row">
            <div class="member-info">
                <span class="name">Ghadi:</span>
                <span class="score" id="score-ghadi">0</span>
            </div>
            <div class="controls">
                <button class="add-btn btn-1" onclick="updateScore('ghadi', 1)">+1</button>
                <button class="add-btn btn-5" onclick="updateScore('ghadi', 5)">+5</button>
                <button class="add-btn btn-10" onclick="updateScore('ghadi', 10)">+10</button>
            </div>
        </div>

        <!-- MARWAN -->
        <div class="member-row">
            <div class="member-info">
                <span class="name">Marwan:</span>
                <span class="score" id="score-marwan">0</span>
            </div>
            <div class="controls">
                <button class="add-btn btn-1" onclick="updateScore('marwan', 1)">+1</button>
                <button class="add-btn btn-5" onclick="updateScore('marwan', 5)">+5</button>
                <button class="add-btn btn-10" onclick="updateScore('marwan', 10)">+10</button>
            </div>
        </div>

        <!-- JAD -->
        <div class="member-row">
            <div class="member-info">
                <span class="name">Jad:</span>
                <span class="score" id="score-jad">0</span>
            </div>
            <div class="controls">
                <button class="add-btn btn-1" onclick="updateScore('jad', 1)">+1</button>
                <button class="add-btn btn-5" onclick="updateScore('jad', 5)">+5</button>
                <button class="add-btn btn-10" onclick="updateScore('jad', 10)">+10</button>
            </div>
        </div>

    </div>

    <a href="/" class="back-btn">EXIT SECURE AREA</a>

    <script>
        // Simple function to update the numbers on screen
        function updateScore(name, amount) {
            const scoreElement = document.getElementById('score-' + name);
            let currentScore = parseInt(scoreElement.innerText);
            scoreElement.innerText = currentScore + amount;
            
            // Visual feedback
            scoreElement.style.color = "#fff";
            setTimeout(() => { scoreElement.style.color = "#10b981"; }, 300);
        }
    </script>

</body>
</html>
