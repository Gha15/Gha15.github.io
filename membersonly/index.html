<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATIX | Internal Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Courier Prime', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
            text-align: center;
        }
        .hub-container {
            border: 1px solid #334155;
            background: #0f172a;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            width: 90%;
            max-width: 450px;
        }
        .logo-area {
            margin-bottom: 20px;
            color: #818cf8;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .hub-header {
            color: #818cf8;
            font-size: 1.2rem;
            letter-spacing: 5px;
            margin-bottom: 35px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .nav-link {
            display: block;
            padding: 18px;
            margin: 12px 0;
            border: 1px solid #1e293b;
            background: #020617;
            color: #10b981;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav-link:hover {
            border-color: #818cf8;
            background: #1e293b;
            color: #f8fafc;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }
        .status-tag {
            margin-top: 30px;
            font-size: 0.65rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <div class="logo-area">
            [matixlogosvg]
        </div>

        <div class="hub-header">MEMBERS_ONLY_ACCESS</div>
        
        <a href="points/" class="nav-link">SYNC_POINTS_LEDGER</a>
        
        <div class="status-tag">Status: Secure // User: Authenticated</div>
    </div>

    <a href="/" style="margin-top: 25px; color: #334155; text-decoration: none; font-size: 0.7rem; letter-spacing: 2px; font-weight: 400;">&lt; EXIT_TO_MAIN_INTERFACE</a>

</body>
</html>
