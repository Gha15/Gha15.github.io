<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Matix</title>
  <link rel="stylesheet" href="/global.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/nav.js" defer></script>
  <style>
    .msg-wrap { max-width: 720px; margin: 0 auto; padding: 30px 18px 60px }
    .msg-hero { background: linear-gradient(135deg, rgba(29, 78, 216, .35), rgba(245, 158, 11, .12)); border: 1px solid rgba(96, 165, 250, .20); border-top: 3px solid #f59e0b; border-radius: 16px; padding: 16px 18px; margin-bottom: 16px }
    .msg-title { font-family: "Trebuchet MS", Arial, sans-serif; font-size: 1.4rem; font-weight: 900; color: #f0f8ff; margin-bottom: 4px }
    .msg-sub { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .88rem; color: #bfdbfe }
    .msg-sub b { color: #fbbf24 }
    .msg-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px }
    .msg-chip { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .78rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; border: 1.5px solid rgba(96, 165, 250, .3); color: #93c5fd; background: none; cursor: pointer; transition: background .12s }
    .msg-chip.active { background: rgba(59, 130, 246, .22); border-color: #3b82f6; color: #dbeafe }
    .msg-list { display: flex; flex-direction: column; gap: 8px }
    .msg-item { display: flex; gap: 13px; align-items: flex-start; background: rgba(12, 35, 100, .6); border: 1px solid rgba(96, 165, 250, .15); border-radius: 12px; padding: 10px 12px; position: relative; transition: background .12s }
    .msg-item:hover { background: rgba(18, 46, 130, .75) }
    .msg-item.unread { border-left: 3px solid #f59e0b }
    .msg-av { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #1e3a8a, #1d4ed8); display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", Arial, sans-serif; font-weight: 700; color: #93c5fd; text-decoration: none; background-size: cover; background-position: center }
    .msg-body { flex: 1; min-width: 0 }
    .msg-line { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .9rem; color: #e2e8f0; line-height: 1.5 }
    .msg-line a { color: #bfdbfe; font-weight: 700; text-decoration: none }
    .msg-line a:hover { text-decoration: underline }
    .msg-quote { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .85rem; color: #94a3b8; margin-top: 4px; padding-left: 10px; border-left: 2px solid rgba(96, 165, 250, .3); white-space: pre-wrap; word-break: break-word }
    .msg-time { font-family: "Trebuchet MS", Arial, sans-serif; font-size: .68rem; color: #64748b; margin-top: 4px }
    .msg-icon { position: absolute; top: 12px; right: 13px; font-size: 1rem }
    .msg-new { display: inline-block; font-family: "Trebuchet MS", Arial, sans-serif; font-size: .6rem; font-weight: 800; color: #052e16; background: #fbbf24; border-radius: 10px; padding: 1px 7px; margin-left: 8px; vertical-align: middle }
    .msg-empty { font-family: "Trebuchet MS", Arial, sans-serif; color: #475569; text-align: center; padding: 44px 0; font-size: .9rem }
    .msg-signin { font-family: "Trebuchet MS", Arial, sans-serif; color: #94a3b8; text-align: center; padding: 40px 22px; font-size: .95rem }
    .msg-signin a { color: #fbbf24; text-decoration: none; font-weight: 700 }
  </style>
</head>

<body>
  <div class="msg-wrap" id="msg-root">
    <div class="msg-empty">Loading…</div>
  </div>
  <script>
    var FB = 'https://matix-1d538-default-rtdb.firebaseio.com';

    function getUser() { return sessionStorage.getItem('mx_user') || sessionStorage.getItem('matix_auth_user') || null; }
    function normalizeUser(u) { var c = String(u || '').toLowerCase().replace(/[^a-z0-9_]/g, ''); if (c === 'matix' || c === 'ghadimatix') return 'ghadi'; return c; }
    function initials(u) { return u ? u.slice(0, 2).toUpperCase() : '??'; }
    function escapeHtml(v) { return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function timeAgo(ms) { var s = Math.floor((Date.now() - ms) / 1000); if (s < 60) return 'just now'; var m = Math.floor(s / 60); if (m < 60) return m + 'm ago'; var h = Math.floor(m / 60); if (h < 24) return h + 'h ago'; var d = Math.floor(h / 24); if (d < 30) return d + 'd ago'; return new Date(ms).toLocaleDateString(); }
    function fetchJson(url) { return fetch(url).then(function (r) { return r.json(); }).catch(function () { return null; }); }

    var root = document.getElementById('msg-root');
    var me = getUser();
    var currentFilter = 'all';
    var allEvents = [];
    var profilesMap = {};
    var seen = 0;

    if (!me) {
      root.innerHTML = '<div class="msg-hero"><div class="msg-title">\uD83D\uDD14 Messages</div><div class="msg-sub">Your notifications live here.</div></div>' +
        '<div class="msg-signin">Sign in from the menu to see your messages.</div>';
    } else {
      me = normalizeUser(me);
      render();
    }

    function avatarEl(user, profile) {
      var a = document.createElement('a'); a.className = 'msg-av'; a.href = '/users/' + user;
      if (profile && profile.profileImage) { a.style.backgroundImage = 'url(' + profile.profileImage + ')'; }
      else { a.textContent = initials(user); }
      return a;
    }

    function render() {
      Promise.all([
        fetchJson(FB + '/follows/' + encodeURIComponent(me) + '.json'),
        fetchJson(FB + '/members.json'),
        fetchJson(FB + '/profiles.json'),
        fetchJson(FB + '/profile_comments/' + encodeURIComponent(me) + '.json')
      ]).then(function (res) {
        var follows = res[0] || {}, members = res[1] || {}, comments = res[3] || {};
        profilesMap = res[2] || {};
        try { seen = parseInt(localStorage.getItem('mx_messages_seen_' + me) || '0', 10) || 0; } catch (e) { seen = 0; }

        allEvents = [];
        Object.keys(follows).forEach(function (k) {
          var f = follows[k]; var u = normalizeUser(k); if (!u || u === me) return;
          allEvents.push({ type: 'follow', user: u, at: (f && f.at) || 0 });
        });
        Object.keys(members).forEach(function (k) {
          var u = normalizeUser(k); if (!u || u === me) return;
          var jt = members[k] && members[k].joinedAt; if (!jt) return;
          allEvents.push({ type: 'join', user: u, at: jt });
        });
        Object.keys(comments).forEach(function (k) {
          var c = comments[k]; if (!c) return; var u = normalizeUser(c.by); if (u === me) return;
          allEvents.push({ type: 'comment', user: u, at: c.at || 0, text: c.text || '' });
        });
        allEvents.sort(function (a, b) { return b.at - a.at; });

        buildHero();
        draw();

        // Mark everything as seen for next visit + clear the nav dot
        try { localStorage.setItem('mx_messages_seen_' + me, String(Date.now())); } catch (e) { }
      });
    }

    function buildHero() {
      var newCount = allEvents.filter(function (e) { return e.at > seen; }).length;
      root.innerHTML = '';
      var hero = document.createElement('div'); hero.className = 'msg-hero';
      hero.innerHTML = '<div class="msg-title">\uD83D\uDD14 Messages</div>' +
        '<div class="msg-sub">' + (newCount ? ('You have <b>' + newCount + '</b> new notification' + (newCount === 1 ? '' : 's') + '.') : 'All caught up \u2014 no new notifications.') + '</div>';
      root.appendChild(hero);

      var chips = document.createElement('div'); chips.className = 'msg-chips';
      [['all', 'All'], ['follow', 'New follows'], ['join', 'New members'], ['comment', 'Comments']].forEach(function (c) {
        var b = document.createElement('button'); b.className = 'msg-chip' + (currentFilter === c[0] ? ' active' : ''); b.textContent = c[1];
        b.addEventListener('click', function () { currentFilter = c[0]; refreshChips(chips); draw(); });
        chips.appendChild(b);
      });
      root.appendChild(chips);

      var list = document.createElement('div'); list.className = 'msg-list'; list.id = 'msg-list';
      root.appendChild(list);
    }

    function refreshChips(chips) {
      var order = ['all', 'follow', 'join', 'comment'];
      Array.prototype.forEach.call(chips.children, function (b, i) {
        if (order[i] === currentFilter) b.classList.add('active'); else b.classList.remove('active');
      });
    }

    function draw() {
      var list = document.getElementById('msg-list'); if (!list) return;
      var events = currentFilter === 'all' ? allEvents : allEvents.filter(function (e) { return e.type === currentFilter; });
      list.innerHTML = '';
      if (!events.length) { list.innerHTML = '<div class="msg-empty">Nothing here yet.</div>'; return; }
      events.slice(0, 120).forEach(function (e) {
        var item = document.createElement('div'); item.className = 'msg-item' + (e.at > seen ? ' unread' : '');
        item.appendChild(avatarEl(e.user, profilesMap[e.user]));
        var body = document.createElement('div'); body.className = 'msg-body';
        var line = document.createElement('div'); line.className = 'msg-line';
        var icon = '';
        if (e.type === 'follow') { line.innerHTML = '<a href="/users/' + e.user + '">@' + escapeHtml(e.user) + '</a> started following you.'; icon = '\u2795'; }
        else if (e.type === 'join') { line.innerHTML = '<a href="/users/' + e.user + '">@' + escapeHtml(e.user) + '</a> joined Matix.'; icon = '\uD83C\uDF89'; }
        else if (e.type === 'comment') { line.innerHTML = '<a href="/users/' + e.user + '">@' + escapeHtml(e.user) + '</a> commented on your profile.'; icon = '\uD83D\uDCAC'; }
        if (e.at > seen) { line.innerHTML += '<span class="msg-new">NEW</span>'; }
        body.appendChild(line);
        if (e.type === 'comment' && e.text) { var q = document.createElement('div'); q.className = 'msg-quote'; q.textContent = e.text; body.appendChild(q); }
        var t = document.createElement('div'); t.className = 'msg-time'; t.textContent = e.at ? timeAgo(e.at) : '';
        body.appendChild(t);
        var ic = document.createElement('div'); ic.className = 'msg-icon'; ic.textContent = icon;
        item.appendChild(body); item.appendChild(ic);
        list.appendChild(item);
      });
    }
  </script>
</body>

</html>
