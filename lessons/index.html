<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATIX | Lessons</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #020617; color: #10b981; font-family: 'Courier Prime', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }

        /* --- UI BOXES --- */
        .container {
            border: 1px solid #10b981; background: #0f172a; padding: 30px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); width: 100%; max-width: 700px;
            display: none; /* Hidden until auth */
            margin-bottom: 20px;
        }

        .header-title {
            color: #818cf8; border-bottom: 1px solid #334155; padding-bottom: 10px;
            margin-bottom: 20px; font-size: 2rem; text-align: center; font-family: 'Vibur', cursive;
        }

        /* --- AUTH SCREEN --- */
        #auth-screen { display: block; text-align: center; max-width: 400px; margin-top: 10vh; }
        input, textarea { 
            background: #020617; border: 1px solid #334155; color: #f8fafc; 
            padding: 12px; margin-bottom: 15px; width: 100%; box-sizing: border-box; 
            font-family: 'Courier Prime', monospace; font-size: 1rem;
        }
        
        .btn {
            padding: 10px 20px; border: 1px solid #10b981; background: transparent;
            color: #10b981; cursor: pointer; font-size: 1.1rem; font-family: 'Courier Prime', monospace;
            transition: 0.3s; width: 100%; margin-bottom: 10px; text-transform: uppercase;
        }
        .btn:hover { background: #10b981; color: #020617; }
        .btn-guest { border-color: #94a3b8; color: #94a3b8; }
        .btn-guest:hover { background: #94a3b8; color: #020617; }
        #auth-error { color: #ef4444; margin-bottom: 10px; font-size: 0.9rem; }

        /* --- ADMIN PANEL --- */
        #admin-panel { display: none; border-color: #818cf8; box-shadow: 0 0 30px rgba(129, 140, 248, 0.2); }
        .admin-label { color: #818cf8; font-size: 0.9rem; margin-bottom: 5px; display: block; }
        textarea { resize: vertical; min-height: 100px; }
        .btn-admin { border-color: #818cf8; color: #818cf8; }
        .btn-admin:hover { background: #818cf8; color: #020617; }

        /* --- EDIT PANEL --- */
        #edit-panel { display: none; border-color: #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.2); }
        .btn-edit { border-color: #f59e0b; color: #f59e0b; font-size: 0.8rem; padding: 5px 10px; width: auto; margin: 0; }
        .btn-edit:hover { background: #f59e0b; color: #020617; }
        .lesson-controls { display: flex; align-items: center; gap: 10px; }

        /* --- LESSON LIST --- */
        #lesson-list { display: flex; flex-direction: column; gap: 10px; }
        .lesson-btn {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: #1e293b; border: 1px solid #334155;
            color: #f8fafc; cursor: pointer; transition: 0.2s; text-align: left;
            font-size: 1.1rem; border-radius: 5px;
        }
        .lesson-btn:hover { border-color: #10b981; background: #0f172a; }

        /* --- LESSON VIEWER --- */
        #lesson-viewer { display: none; }
        #viewer-content { color: #cbd5e1; line-height: 1.6; margin-bottom: 30px; border-left: 2px solid #818cf8; padding-left: 15px; white-space: pre-wrap; }
        .btn-done { border-color: #f59e0b; color: #f59e0b; }
        .btn-done:hover { background: #f59e0b; color: #020617; }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div class="container" id="auth-screen">
        <div class="header-title">Vault_Access</div>
        <div id="auth-error"></div>
        <input type="text" id="username" placeholder="USERNAME">
        <input type="password" id="password" placeholder="PASSWORD">
        <button class="btn" onclick="loginMember()">Authorize_Member</button>
        <div style="margin: 15px 0; color: #334155;">--- OR ---</div>
        <button class="btn btn-guest" onclick="loginGuest()">Access_As_Guest</button>
    </div>

    <!-- ADMIN PANEL CREATOR -->
    <div class="container" id="admin-panel">
        <div class="header-title" style="color:#818cf8;">Admin_Lesson_Creator</div>
        <span class="admin-label">Lesson Title:</span>
        <input type="text" id="new-title" placeholder="e.g. Algebra 101">
        
        <span class="admin-label">Short Description:</span>
        <input type="text" id="new-desc" placeholder="What is this about?">
        
        <span class="admin-label">Lesson Text/Content:</span>
        <textarea id="new-content" placeholder="Type the lesson content here..."></textarea>
        
        <button class="btn btn-admin" onclick="addLesson()">Deploy_Lesson</button>
    </div>

    <!-- EDIT PANEL -->
    <div class="container" id="edit-panel">
        <div class="header-title" style="color:#f59e0b;">Edit_Lesson</div>
        <input type="hidden" id="edit-id">
        
        <span class="admin-label" style="color:#f59e0b;">Lesson Title:</span>
        <input type="text" id="edit-title">
        
        <span class="admin-label" style="color:#f59e0b;">Short Description:</span>
        <input type="text" id="edit-desc">
        
        <span class="admin-label" style="color:#f59e0b;">Lesson Text/Content:</span>
        <textarea id="edit-content"></textarea>
        
        <button class="btn" style="border-color:#f59e0b; color:#f59e0b;" onclick="saveEditedLesson()">Save_Changes</button>
        <button class="btn btn-guest" onclick="backToDashboard()">Cancel</button>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div class="container" id="dashboard-screen">
        <div class="header-title">Available_Modules</div>
        <div id="user-display" style="text-align:center; margin-bottom: 20px; color: #94a3b8;"></div>
        <div id="lesson-list"></div>
        <button class="btn btn-guest" style="margin-top: 30px; opacity: 0.5;" onclick="logout()">Terminate_Session</button>
    </div>

    <!-- LESSON VIEWER -->
    <div class="container" id="lesson-viewer">
        <div class="header-title" id="viewer-title">Lesson Title</div>
        <div style="color: #94a3b8; margin-bottom: 20px; font-style: italic;" id="viewer-desc">Description</div>
        <div id="viewer-content">Content goes here...</div>
        
        <button class="btn btn-done" onclick="finishLesson()">Complete_&_Go_To_Exercises</button>
        <button class="btn btn-guest" onclick="backToDashboard()">Return_To_Modules</button>
    </div>

    <!-- Firebase SDK Imports -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // --- 1. FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyBmJOS_aaOVADbu5cACUoeXHrjfpHTBTdo",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "matix-1d538",
            storageBucket: "matix-1d538.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. AUTHENTICATION LOGIC ---
        const validUsers = {
            "ghadi": "iamtheownerofmatix",
            "jad": "ilikebatatameshwiyye",
            "marwan": "ilikebeingnumberonebutiamnumbertwo"
        };

        let currentUser = sessionStorage.getItem("matix_auth_user");
        let activeLessonId = null; 

        if (currentUser) { loadDashboard(); }

        function loginMember() {
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            if (validUsers[user] && validUsers[user] === pass) {
                currentUser = user;
                sessionStorage.setItem("matix_auth_user", user);
                loadDashboard();
            } else {
                document.getElementById('auth-error').innerText = "ERROR: Invalid credentials.";
            }
        }

        function loginGuest() {
            currentUser = "guest";
            sessionStorage.setItem("matix_auth_user", "guest");
            if(!localStorage.getItem('matix_guest_progress')) {
                localStorage.setItem('matix_guest_progress', JSON.stringify({}));
            }
            loadDashboard();
        }

        function logout() {
            sessionStorage.removeItem("matix_auth_user");
            location.reload();
        }

        // --- 3. DASHBOARD & DATA LOGIC ---
        function loadDashboard() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('lesson-viewer').style.display = 'none';
            document.getElementById('edit-panel').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            document.getElementById('user-display').innerText = `Active_User: ${currentUser.toUpperCase()}`;

            // Show Admin Panel Creator ONLY if user is Ghadi
            if (currentUser === "ghadi") {
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                document.getElementById('admin-panel').style.display = 'none';
            }

            fetchLessons();
        }

        function fetchLessons() {
            const lessonListDiv = document.getElementById('lesson-list');
            
            db.ref('lessons').on('value', (snapshot) => {
                lessonListDiv.innerHTML = "";
                const data = snapshot.val();
                
                if (data) {
                    Object.keys(data).forEach((key) => {
                        const lesson = data[key];
                        
                        const lessonCard = document.createElement('div');
                        lessonCard.className = "lesson-btn";
                        
                        const contentSpan = document.createElement('span');
                        contentSpan.innerText = lesson.title;
                        contentSpan.style.flexGrow = "1";
                        contentSpan.onclick = () => viewLesson(key, lesson);
                        lessonCard.appendChild(contentSpan);

                        const controlsDiv = document.createElement('div');
                        controlsDiv.className = "lesson-controls";

                        // Conditional validation constraint checking
                        if (currentUser === "ghadi") {
                            const editBtn = document.createElement('button');
                            editBtn.className = "btn btn-edit";
                            editBtn.innerText = "EDIT";
                            editBtn.onclick = (e) => {
                                e.stopPropagation(); // Stops lesson view opening handler execution
                                openEditPanel(key, lesson);
                            };
                            controlsDiv.appendChild(editBtn);
                        }

                        lessonCard.appendChild(controlsDiv);
                        lessonListDiv.appendChild(lessonCard);
                    });
                } else {
                    lessonListDiv.innerHTML = "<div style='text-align:center; color:#334155;'>No modules deployed.</div>";
                }
            });
        }

        function addLesson() {
            const title = document.getElementById('new-title').value.trim();
            const desc = document.getElementById('new-desc').value.trim();
            const content = document.getElementById('new-content').value.trim();

            if (!title || !content) {
                alert("Please fill in Title and Content.");
                return;
            }

            db.ref('lessons').push({
                title: title,
                desc: desc,
                content: content
            }).then(() => {
                document.getElementById('new-title').value = "";
                document.getElementById('new-desc').value = "";
                document.getElementById('new-content').value = "";
                alert("Lesson deployed safely.");
            }).catch((error) => {
                console.error("Deploy failure:", error);
            });
        }

        // --- 4. EDIT SYSTEM HANDLERS ---
        function openEditPanel(id, lesson) {
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('edit-panel').style.display = 'block';
            
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-title').value = lesson.title || '';
            document.getElementById('edit-desc').value = lesson.desc || '';
            document.getElementById('edit-content').value = lesson.content || '';
        }

        function saveEditedLesson() {
            const id = document.getElementById('edit-id').value;
            const updatedTitle = document.getElementById('edit-title').value.trim();
            const updatedDesc = document.getElementById('edit-desc').value.trim();
            const updatedContent = document.getElementById('edit-content').value.trim();

            if (!updatedTitle || !updatedContent) {
                alert("Title and Content structures cannot be blank values.");
                return;
            }

            db.ref('lessons/' + id).update({
                title: updatedTitle,
                desc: updatedDesc,
                content: updatedContent
            }).then(() => {
                loadDashboard();
            }).catch((error) => {
                console.error("Firebase Update Error: ", error);
                alert("Failed updating remote node cluster.");
            });
        }

        // --- 5. VIEWER & UTILITY LOGIC ---
        function viewLesson(id, lesson) {
            activeLessonId = id;
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('lesson-viewer').style.display = 'block';
            
            document.getElementById('viewer-title').innerText = lesson.title;
            document.getElementById('viewer-desc').innerText = lesson.desc || 'No description provided.';
            document.getElementById('viewer-content').innerText = lesson.content;
        }

        function finishLesson() {
            alert("Module processing pipeline completed successfully!");
            backToDashboard();
        }

        function backToDashboard() {
            loadDashboard();
        }
    </script>
</body>
</html>
