<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATIX | Lessons Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Vibur&family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/global.css">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        .redtext a {
             color: white ;
             font-family: 'Vibur', cursive;
             font-size: 1.5rem;
             text-decoration: none;  
             display: inline-block;
             transition: transform 0.2s ease, color 0.2s ease;
            
        }
        .redtext a:hover { transform: scale(1.1); color: red; text-decoration: underline; animation: pulseScale 1.2s infinite ease-in-out;}
        @keyframes pulseScale {
             0% { transform: scale(1); }
             50% { transform: scale(1.15); } /* Grows to 115% size */
             100% { transform: scale(1); } /* Shrinks back to 100% size */
        }
        .container {
            border: 1px solid #10b981; background: #0f172a; padding: 30px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); width: 100%; max-width: 700px;
            display: none; margin-bottom: 20px;
        }

        .header-title {
            color: #818cf8; border-bottom: 1px solid #334155; padding-bottom: 10px;
            margin-bottom: 20px; font-size: 2rem; text-align: center; font-family: 'Vibur', cursive;
        }

        #auth-screen { display: block; text-align: center; max-width: 400px; margin-top: 10vh; }
        input, textarea { 
            background: #020617; border: 1px solid #334155; color: #f8fafc; 
            padding: 12px; margin-bottom: 15px; width: 100%; box-sizing: border-box; 
            font-family: 'Courier Prime', monospace; font-size: 1rem;
        }
        
        .btn {
            padding: 10px 20px; border: 1px solid #10b981; background: transparent;
            color: #10b981; cursor: pointer; font-size: 1.1rem; font-family: 'Courier Prime', monospace;
            transition: 0.3s; width: 100%; margin-bottom: 10px; text-transform: uppercase;
        }
        .btn:hover { background: #10b981; color: #020617; }
        .btn-guest { border-color: #94a3b8; color: #94a3b8; }
        .btn-guest:hover { background: #94a3b8; color: #020617; }

        /* --- ADMIN CONTROLS --- */
        #admin-panel { display: none; border-color: #818cf8; box-shadow: 0 0 30px rgba(129, 140, 248, 0.2); }
        .admin-label { color: #818cf8; font-size: 0.9rem; margin-bottom: 5px; display: block; }
        textarea { resize: vertical; min-height: 100px; }
        .btn-admin { border-color: #818cf8; color: #818cf8; }
        .btn-admin:hover { background: #818cf8; color: #020617; }
        
        .admin-edit-row { display: flex; justify-content: space-between; background: #020617; padding: 8px; margin-bottom: 5px; border: 1px dashed #334155; font-size: 0.9rem;}
        .inline-del-btn { color: #ef4444; cursor: pointer; background: transparent; border: none; font-family: monospace; }
        .inline-edit-btn { color: #60a5fa; cursor: pointer; background: transparent; border: none; font-family: monospace; margin-right: 10px;}

        /* --- LESSON LIST --- */
        #lesson-list { display: flex; flex-direction: column; gap: 10px; }
        .lesson-btn {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: #1e293b; border: 1px solid #334155;
            color: #f8fafc; cursor: pointer; transition: 0.2s; text-align: left;
            font-size: 1.1rem; border-radius: 5px;
        }
        .lesson-btn:hover { border-color: #10b981; background: #0f172a; }
        .lesson-status { font-size: 1.2rem; }

        #lesson-viewer { display: none; }
        #viewer-content { color: #cbd5e1; line-height: 1.6; margin-bottom: 30px; border-left: 2px solid #818cf8; padding-left: 15px; white-space: pre-wrap; }
        .btn-done { border-color: #f59e0b; color: #f59e0b; }
        .btn-done:hover { background: #f59e0b; color: #020617; }
    </style>
</head>
<body>

    <div class="container" id="auth-screen">
        <div class="header-title">Vault_Access</div>
        <div id="auth-error" style="color: #ef4444; margin-bottom:10px;"></div>
        <p style="color:#94a3b8; font-size:0.95rem; line-height:1.6; margin-top:0;">Sign in using the top menu (open menu &rarr; scroll to right &rarr; Sign In / Join Matix if no account).</p>
      </div>
     <div class="redtext">
     <a href="https://matixthemathclub.com/">return home</a>
     </div>

    <div class="container" id="admin-panel">
        <div class="header-title" style="color:#818cf8;" id="admin-panel-title">Admin_Lesson_Creator</div>
        <input type="hidden" id="editing-id" value="">
        
        <span class="admin-label">Lesson Title:</span>
        <input type="text" id="new-title" placeholder="e.g. Algebra 101">
        
        <span class="admin-label">Short Description:</span>
        <input type="text" id="new-desc" placeholder="What is this about?">
        
        <span class="admin-label">Lesson Text/Content:</span>
        <textarea id="new-content" placeholder="Type the lesson content here..."></textarea>
        
        <button class="btn btn-admin" id="submit-admin-btn" onclick="addLesson()">Deploy_Lesson</button>
        <button class="btn btn-guest" id="cancel-edit-btn" style="display:none; border-color:#ef4444; color:#ef4444;" onclick="resetAdminForm()">Cancel_Edit</button>
        
        <div style="margin-top:20px; border-top: 1px dashed #334155; padding-top:15px;">
            <span class="admin-label" style="margin-bottom:10px;">Modify Deployed Content Nodes:</span>
            <div id="admin-raw-list"></div>
        </div>
    </div>

    <div class="container" id="dashboard-screen">
        <div class="header-title">Available_Modules</div>
        <div id="user-display" style="text-align:center; margin-bottom: 20px; color: #94a3b8;"></div>
        <div id="lesson-list"></div>
        <button class="btn btn-guest" style="margin-top: 30px; opacity: 0.5;" onclick="logout()">Terminate_Session</button>
    </div>

    <div class="container" id="lesson-viewer">
        <div class="header-title" id="viewer-title">Lesson Title</div>
        <div style="color: #94a3b8; margin-bottom: 20px; font-style: italic;" id="viewer-desc">Description</div>
        <div id="viewer-content">Content goes here...</div>
        <button class="btn btn-done" onclick="finishLesson()">Complete_&_Go_To_Exercises</button>
        <button class="btn btn-guest" onclick="backToDashboard()">Return_To_Modules</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmJOS_aaOVADbu5cACUoeXHrjfpHTBTdo",
            authDomain: "matix-1d538.firebaseapp.com",
            databaseURL: "https://matix-1d538-default-rtdb.firebaseio.com",
            projectId: "matix-1d538",
            storageBucket: "matix-1d538.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = sessionStorage.getItem("matix_auth_user");
        let activeLessonId = null; 

        //gets current num of lessons and puts it into main page stats section
        db.ref('lessons').once('value').then((snapshot) => {
            const lessons = snapshot.val() || {};
            const lessonCount = Object.keys(lessons).length;
            const statsDiv = document.getElementById('stats-section');
            if (statsDiv) {
                const lessonStat = document.createElement('div');
                lessonStat.innerText = `Total Lessons Available: ${lessonCount}`;
                statsDiv.appendChild(lessonStat);
            }
        });

        if (currentUser) { loadDashboard(); }

        function logout() {
            if (window.MatixAuth && window.MatixAuth.signOut) { window.MatixAuth.signOut(); }
            else { sessionStorage.removeItem("matix_auth_user"); sessionStorage.removeItem("mx_user"); }
            location.reload();
        }

        // Keeps this page in sync when someone signs in/out or joins from the top nav bar,
        // instead of needing its own login form.
        window.addEventListener('mx-auth-changed', (e) => {
            currentUser = (e.detail && e.detail.user) || null;
            if (currentUser) {
                loadDashboard();
            } else if (!activeLessonId) {
                document.getElementById('dashboard-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('lesson-viewer').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'block';
            }
        });

        function loadDashboard() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('lesson-viewer').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            document.getElementById('user-display').innerText = `Active User: ${currentUser.toLowerCase()}`;

            const isAdmin = currentUser === 'ghadi';
            document.getElementById('admin-panel').style.display = isAdmin ? 'block' : 'none';

            db.ref('lessons').on('value', (snapshot) => {
                const lessons = snapshot.val() || {};
                renderLessonButtons(lessons);
                if (isAdmin) { renderAdminManagementList(lessons); }
            });
        }

        function renderLessonButtons(lessons) {
            db.ref('progress/' + currentUser).once('value').then((readSnap) => {
                const readProg = readSnap.val() || {};
                db.ref('exercise_progress/' + currentUser).once('value').then((exSnap) => {
                    const exProg = exSnap.val() || {};
                    buildButtons(lessons, readProg, exProg);
                });
            });
        }

        function buildButtons(lessons, readProg, exProg) {
            const listDiv = document.getElementById('lesson-list');
            listDiv.innerHTML = '';
            for (const [lessonId, data] of Object.entries(lessons)) {
                const hasRead = readProg[lessonId] === true;
                const hasDoneEx = exProg[lessonId] === true;
                
                let emoji = '❌'; 
                if (hasRead && !hasDoneEx) { emoji = '...'; } 
                else if (hasRead && hasDoneEx) { emoji = '✔️'; }

                const btn = document.createElement('button');
                btn.className = 'lesson-btn';
                btn.innerHTML = `<span>${data.title}</span> <span class="lesson-status">${emoji}</span>`;
                btn.onclick = () => openLesson(lessonId, data);
                listDiv.appendChild(btn);
            }
        }

        /* --- CRUD CORE OPERATIONS --- */
        function renderAdminManagementList(lessons) {
            const container = document.getElementById('admin-raw-list');
            container.innerHTML = '';
            for (const [id, data] of Object.entries(lessons)) {
                const div = document.createElement('div');
                div.className = 'admin-edit-row';
                div.innerHTML = `
                    <span>${data.title}</span>
                    <div>
                        <button class="inline-edit-btn" onclick="prepEditLesson('${id}', \`${data.title.replace(/`/g, '\\`').replace(/"/g, '&quot;')}\`, \`${data.description.replace(/`/g, '\\`').replace(/"/g, '&quot;')}\`, \`${data.content.replace(/`/g, '\\`').replace(/"/g, '&quot;')}\`)">[EDIT]</button>
                        <button class="inline-del-btn" onclick="deleteLesson('${id}')">[DELETE]</button>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        function addLesson() {
            const title = document.getElementById('new-title').value;
            const desc = document.getElementById('new-desc').value;
            const content = document.getElementById('new-content').value;
            const editId = document.getElementById('editing-id').value;

            if(!title || !content) return alert("Title and Content are required!");

            if(editId) {
                // Update Path
                db.ref('lessons/' + editId).update({ title, description: desc, content }).then(() => {
                    alert("Lesson updated successfully.");
                    resetAdminForm();
                });
            } else {
                // Production Push Path
                db.ref('lessons').push({ title, description: desc, content }).then(() => {
                    alert("Lesson deployed to network!");
                    resetAdminForm();
                });
            }
        }

        function prepEditLesson(id, title, desc, content) {
            document.getElementById('editing-id').value = id;
            document.getElementById('new-title').value = title;
            document.getElementById('new-desc').value = desc;
            document.getElementById('new-content').value = content;
            
            document.getElementById('admin-panel-title').innerText = "Admin_Data_Modifier";
            document.getElementById('submit-admin-btn').innerText = "Save_System_Changes";
            document.getElementById('cancel-edit-btn').style.display = "block";
        }

        function resetAdminForm() {
            document.getElementById('editing-id').value = '';
            document.getElementById('new-title').value = '';
            document.getElementById('new-desc').value = '';
            document.getElementById('new-content').value = '';
            
            document.getElementById('admin-panel-title').innerText = "Admin_Lesson_Creator";
            document.getElementById('submit-admin-btn').innerText = "Deploy_Lesson";
            document.getElementById('cancel-edit-btn').style.display = "none";
        }

        function deleteLesson(id) {
            if(confirm("CRITICAL INTERVENTION: Delete this lesson module and all associated parameters?")) {
                db.ref('lessons/' + id).remove();
                db.ref('exercises/' + id).remove(); // Clears quiz arrays alongside module
                alert("Data node completely purged.");
                if(document.getElementById('editing-id').value === id) { resetAdminForm(); }
            }
        }

        function openLesson(lessonId, data) {
            activeLessonId = lessonId;
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('lesson-viewer').style.display = 'block';
            document.getElementById('viewer-title').innerText = data.title;
            document.getElementById('viewer-desc').innerText = data.description;
            document.getElementById('viewer-content').innerText = data.content;
        }

        function backToDashboard() { activeLessonId = null; loadDashboard(); }

        function finishLesson() {
            db.ref('progress/' + currentUser + '/' + activeLessonId).set(true);
            alert("Progress Saved! Routing to Target Exercises...");
            window.location.href = '/lessons/exercises'; 
        }
    </script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="/theme-loader.js"></script>
<script src="/nav.js" defer></script>
</body>
</html>
