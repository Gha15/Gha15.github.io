<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Form Data</title>
  <!-- Google Font: Poppins -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Reset and Theme Setup */
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #0b132b; /* Midnight Blue */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 450px; /* Perfect desktop constraint */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #1c2541;
      font-weight: 700;
      text-align: center;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1c2541;
      font-size: 14px;
    }
    input[type="text"], input[type="email"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="email"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4a90e2;
    }
    textarea {
      height: 110px;
      resize: vertical;
    }
    #otherSubjectContainer {
      display: none;
      margin-top: 10px;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(40, 167, 69, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: #218838;
    }
    button:active {
      transform: scale(0.98);
    }

    /* Custom Alert Modal Styling */
    .custom-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 19, 43, 0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 350px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: popup 0.3s ease-out;
    }
    .modal-title {
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .modal-text {
      font-size: 14px;
      color: #4a5568;
      margin-bottom: 20px;
    }
    .modal-btn {
      background: #1c2541;
      color: white;
      padding: 10px 20px;
      font-size: 14px;
    }
    .modal-btn:hover {
      background: #0b132b;
    }

    @keyframes popup {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 480px) {
      body {
        padding: 15px;
        align-items: flex-start; /* Better scroll dynamic on small screens */
      }
      .form-container {
        padding: 20px;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Submit Ticket</h2>
    
    <div class="input-group">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" placeholder="Enter your full name">
    </div>

    <div class="input-group">
      <label for="email">Email Address (Gmail Only):</label>
      <input type="email" id="email" placeholder="name@gmail.com">
    </div>

    <div class="input-group">
      <label for="subjectSelect">Kind of Problem:</label>
      <select id="subjectSelect" onchange="toggleOtherInput()">
        <option value="">-- Select an option --</option>
        <option value="Bugs in website">Bugs in website</option>
        <option value="Technical issue">Technical issue</option>
        <option value="Other">Other (text box)</option>
      </select>
      
      <div id="otherSubjectContainer">
        <input type="text" id="customSubject" placeholder="Please specify your problem">
      </div>
    </div>

    <div class="input-group">
      <label for="description">Text:</label>
      <textarea id="description" placeholder="Describe your problem here"></textarea>
    </div>

    <button onclick="sendEmail()">Send Email</button>
  </div>

  <!-- Custom Alert Modal Structure -->
  <div id="alertModal" class="custom-modal">
    <div class="modal-content">
      <div id="modalTitle" class="modal-title">Notification</div>
      <div id="modalText" class="modal-text">Message goes here.</div>
      <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    // Custom Alert Logic instead of standard browser popups
    function showAlert(title, message, isError = true) {
      const titleEl = document.getElementById('modalTitle');
      titleEl.innerText = title;
      titleEl.style.color = isError ? '#e53e3e' : '#28a745';
      document.getElementById('modalText').innerText = message;
      document.getElementById('alertModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('alertModal').style.display = 'none';
    }

    function toggleOtherInput() {
      const selectBox = document.getElementById('subjectSelect');
      const otherContainer = document.getElementById('otherSubjectContainer');
      
      if (selectBox.value === "Other") {
        otherContainer.style.display = "block";
      } else {
        otherContainer.style.display = "none";
        document.getElementById('customSubject').value = "";
      }
    }

    function sendEmail() {
      const nameVariable = document.getElementById('fullName').value.trim();
      const emailVariable = document.getElementById('email').value.trim();
      const selectBox = document.getElementById('subjectSelect');
      const descriptionVariable = document.getElementById('description').value.trim();
      
      let subjectVariable = selectBox.value;
      if (subjectVariable === "Other") {
        subjectVariable = document.getElementById('customSubject').value.trim();
      }

      // Strict Field Validation
      if (!nameVariable || !emailVariable || !subjectVariable || !descriptionVariable) {
        showAlert("Missing Fields", "All text boxes and choices must be completely filled out!");
        return; 
      }

      // Strict Gmail Validation
      if (!emailVariable.toLowerCase().endsWith("@gmail.com")) {
        showAlert("Invalid Email", "You must use a valid Gmail address (@gmail.com)!");
        return; 
      }

      const formattedMessage = `name:${nameVariable}\nemail:${emailVariable}\nsubject:${subjectVariable}\ntext:${descriptionVariable}`;
      const formspreeUrl = "https://formspree.io";

      // Fixed Connection Protocol using standard Form Data matching to prevent AJAX/CORS drops
      const formData = new FormData();
      formData.append("subject", subjectVariable);
      formData.append("message", formattedMessage);

      fetch(formspreeUrl, {
        method: 'POST',
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      })
      .then(response => {
        if (response.ok) {
          showAlert("Success!", "Email sent successfully!", false);
          // Clear input fields
          document.getElementById('fullName').value = "";
          document.getElementById('email').value = "";
          document.getElementById('subjectSelect').value = "";
          document.getElementById('description').value = "";
          document.getElementById('otherSubjectContainer').style.display = "none";
        } else {
          showAlert("Submission Failed", "The form endpoint rejected the request. Verify Formspree activation.");
        }
      })
      .catch(error => {
        console.error('Error:', error);
        showAlert("Network Error", "Could not link to server. Check your connection or Formspree setup.");
      });
    }
  </script>

</body>
</html>
