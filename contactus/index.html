<!DOCTYPE html>
<html>
<body>
  <h2>Formspree Initialization Form</h2>
  <!-- Pure native form to initialize your account -->
  <form action="https://formspree.io" method="POST">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="_replyto" placeholder="yourname@gmail.com" required>
    <textarea name="message" placeholder="Test Message" required></textarea>
    <button type="submit">Initialize Formspree Now</button>
  </form>
</body>
</html>
