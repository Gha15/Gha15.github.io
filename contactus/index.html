<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contact us - matix the math club</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Pinyon+Script&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { margin: 0; padding: 20px; background-color: #0b132b; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .form-container { background: #ffffff; padding: 30px; border-radius: 16px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); }
    h2 { margin-top: 0; margin-bottom: 10px; color: #1c2541; font-family: 'Pinyon Script', cursive; font-size: 52px; font-weight: 400; text-align: center; }
    .input-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #1c2541; font-size: 14px; }
    input[type="text"], input[type="email"], textarea, select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    input[type="text"]:focus, input[type="email"]:focus, textarea:focus, select:focus { outline: none; border-color: #4a90e2; }
    textarea { height: 110px; resize: vertical; }
    #otherSubjectContainer { display: none; margin-top: 10px; }
    button { background-color: #28a745; color: white; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 600; transition: background-color 0.2s; width: 100%; }
    button:hover { background-color: #218838; }
    button:disabled { background-color: #a0aec0; cursor: not-allowed; }
    .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 19, 43, 0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 350px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .modal-title { font-weight: 700; font-size: 18px; margin-bottom: 10px; }
    .modal-text { font-size: 14px; color: #4a5568; margin-bottom: 20px; }
    .modal-btn { background: #1c2541; color: white; padding: 10px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
    @media (max-width: 480px) { body { padding: 15px; } .form-container { padding: 20px; } }
  </style>
</head>
<body>

  <!-- FIXED METHOD: Direct HTML form transmission allows tracking cookies to parse seamlessly -->
  <form id="ticketForm" action="https://formspree.io" method="POST" onsubmit="return handleSubmission(event)" class="form-container">
    <h2>contact us</h2>
    
    <!-- Next URL loop routes users back with a success flag parameter after saving -->
    <input type="hidden" name="_next" value="https://matixthemathclub.com">
    <input type="hidden" id="hiddenSubject" name="_subject">

    <div class="input-group">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="Full Name" placeholder="Enter your full name">
    </div>

    <div class="input-group">
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="_replyto" placeholder="name@gmail.com">
    </div>

    <div class="input-group">
      <label for="subjectSelect">Kind of Problem:</label>
      <select id="subjectSelect" name="Problem Category" onchange="toggleOtherInput()">
        <option value="">-- Select an option --</option>
        <option value="Bugs in website">Bugs in website</option>
        <option value="Technical issue">Technical issue</option>
        <option value="Other">Other (text box)</option>
      </select>
      
      <div id="otherSubjectContainer">
        <input type="text" id="customSubject" name="Custom Specified Problem" placeholder="Please specify your problem">
      </div>
    </div>

    <div class="input-group">
      <label for="description">Text:</label>
      <textarea id="description" name="Message Description Details" placeholder="Describe your problem here"></textarea>
    </div>

    <button type="submit" id="sendBtn">Send Email</button>
  </form>

  <div id="alertModal" class="custom-modal">
    <div class="modal-content">
      <div id="modalTitle" class="modal-title">Notification</div>
      <div id="modalText" class="modal-text">Message goes here.</div>
      <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    // Listens for Formspree return loop redirect to instantly trigger your custom success modal notice
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('status') === 'success') {
        showAlert("Success!", "We will reply as soon as possible! keep an eye on your inbox 👀", false);
        // Cleans the URL parameter so refreshing the page won't reopen the alert box repeatedly
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    function showAlert(title, message, isError = true) {
      const titleEl = document.getElementById('modalTitle');
      titleEl.innerText = title;
      titleEl.style.color = isError ? '#e53e3e' : '#28a745';
      document.getElementById('modalText').innerText = message;
      document.getElementById('alertModal').style.display = 'flex';
    }

    window.closeModal = function() {
      document.getElementById('alertModal').style.display = 'none';
    };

    function toggleOtherInput() {
      const selectBox = document.getElementById('subjectSelect');
      const otherContainer = document.getElementById('otherSubjectContainer');
      if (selectBox.value === "Other") {
        otherContainer.style.display = "block";
      } else {
        otherContainer.style.display = "none";
        document.getElementById('customSubject').value = "";
      }
    }

    function handleSubmission(event) {
      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const selectBox = document.getElementById('subjectSelect');
      const desc = document.getElementById('description').value.trim();
      const sendBtn = document.getElementById('sendBtn');
      
      let subj = selectBox.value === "Other" ? document.getElementById('customSubject').value.trim() : selectBox.value;

      if (!name || !email || !subj || !desc) {
        event.preventDefault();
        showAlert("Missing Fields", "All fields must be completely filled out!", true);
        return false;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        event.preventDefault();
        showAlert("Invalid Email", "Please enter a valid email address!", true);
        return false;
      }

      // RegEx match avoids array-split cutoff formatting issues
      const domainMatch = email.match(/@([^@]+)$/);
      const domain = domainMatch ? domainMatch[1].toLowerCase() : "";

      if (domain !== "gmail.com" && domain !== "matixthemathclub.com") {
        event.preventDefault();
        showAlert("Access Restricted", "This form only accepts @gmail.com or @matixthemathclub.com accounts!", true);
        return false;
      }

      // Set dynamic subject parameter headers
      document.getElementById('hiddenSubject').value = `New Ticket: ${subj}`;

      sendBtn.disabled = true;
      sendBtn.innerText = "Sending...";

      return true; // Let browser process native form action delivery seamlessly
    }
  </script>

</body>
</html>
