<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contact us - matix the math club</title>
  <!-- Google Fonts: Poppins & Pinyon Script -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Pinyon+Script&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Reset and Theme Setup */
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #0b132b; /* Midnight Blue */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #1c2541;
      font-family: 'Pinyon Script', cursive;
      font-size: 52px;
      font-weight: 400;
      text-align: center;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1c2541;
      font-size: 14px;
    }
    input[type="text"], input[type="email"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="email"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4a90e2;
    }
    textarea {
      height: 110px;
      resize: vertical;
    }
    #otherSubjectContainer {
      display: none;
      margin-top: 10px;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(40, 167, 69, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: #218838;
    }
    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    button:active {
      transform: scale(0.98);
    }

    /* Custom Alert Modal Styling */
    .custom-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 19, 43, 0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 350px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: popup 0.3s ease-out;
    }
    .modal-title {
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .modal-text {
      font-size: 14px;
      color: #4a5568;
      margin-bottom: 20px;
    }
    .modal-btn {
      background: #1c2541;
      color: white;
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .modal-btn:hover {
      background: #0b132b;
    }

    iframe#hidden_iframe {
      display: none;
    }

    @keyframes popup {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
        align-items: flex-start;
      }
      .form-container {
        padding: 20px;
        margin-top: 10px;
      }
    }
  </style>

  <script>
    let isDnsVerified = false;

    function showAlert(title, message, isError = true) {
      const titleEl = document.getElementById('modalTitle');
      titleEl.innerText = title;
      titleEl.style.color = isError ? '#e53e3e' : '#28a745';
      document.getElementById('modalText').innerText = message;
      document.getElementById('alertModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('alertModal').style.display = 'none';
    }

    // Fixed function syntax error from original setup
    function toggleOtherInput() {
      const selectBox = document.getElementById('subjectSelect');
      const otherContainer = document.getElementById('otherSubjectContainer');
      if (selectBox.value === "Other") {
        otherContainer.style.display = "block";
      } else {
        otherContainer.style.display = "none";
        document.getElementById('customSubject').value = "";
      }
    }

    function validateAndFormat(event) {
      if (isDnsVerified) {
        isDnsVerified = false; 
        return true;
      }
      event.preventDefault();

      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const selectBox = document.getElementById('subjectSelect');
      const desc = document.getElementById('description').value.trim();
      const sendBtn = document.getElementById('sendBtn');
      
      let subj = selectBox.value === "Other" ? document.getElementById('customSubject').value.trim() : selectBox.value;

      if (!name || !email || !subj || !desc) {
        showAlert("Missing Fields", "All text boxes and choices must be completely filled out!", true);
        return false; 
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAlert("Invalid Email", "Please enter a correctly formatted email address!", true);
        return false;
      }

      // FIXED BUG: Captures the proper domain array entry element
      const domain = email.split('@')[1].toLowerCase();

      sendBtn.disabled = true;
      sendBtn.innerText = "Verifying email...";

      fetch(`https://dns.google{domain}&type=MX`)
        .then(res => res.json())
        .then(data => {
          if (data.Answer && data.Answer.length > 0) {
            document.getElementById('hiddenSubject').value = `New Ticket: ${subj}`;
            document.getElementById('hiddenMessage').value = `name:${name}\nemail:${email}\nsubject:${subj}\ntext:${desc}`;

            showAlert("Success!", "We will reply as soon as possible! keep an eye on your inbox 👀", false);

            isDnsVerified = true;
            document.getElementById('ticketForm').submit();

            setTimeout(() => {
              document.getElementById('fullName').value = "";
              document.getElementById('email').value = "";
              document.getElementById('subjectSelect').value = "";
              document.getElementById('description').value = "";
              document.getElementById('otherSubjectContainer').style.display = "none";
              sendBtn.disabled = false;
              sendBtn.innerText = "Send Email";
            }, 100);
          } else {
            sendBtn.disabled = false;
            sendBtn.innerText = "Send Email";
            showAlert("Invalid Domain", "This email domain cannot receive emails. Please provide a real email!", true);
          }
        })
        .catch(() => {
          sendBtn.disabled = false;
          sendBtn.innerText = "Send Email";
          showAlert("Verification Error", "Could not complete lookups. Check your connection.", true);
        });

      return false; 
    }
  </script>
</head>
<body>

  <!-- 1. THE ACTUAL FORM BOXES GO HERE -->
  <form id="ticketForm" action="https://formspree.io" method="POST" target="hidden_iframe" onsubmit="return validateAndFormat(event)" class="form-container">
    <h2>contact us</h2>
    
    <input type="hidden" id="hiddenSubject" name="_subject">
    <input type="hidden" id="hiddenMessage" name="message">

    <div class="input-group">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" placeholder="Enter your full name">
    </div>

    <div class="input-group">
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="_replyto" placeholder="name@gmail.com">
    </div>

    <div class="input-group">
      <label for="subjectSelect">Kind of Problem:</label>
      <select id="subjectSelect" onchange="toggleOtherInput()">
        <option value="">-- Select an option --</option>
        <option value="Bugs in website">Bugs in website</option>
        <option value="Technical issue">Technical issue</option>
        <option value="Other">Other (text box)</option>
      </select>
      
      <div id="otherSubjectContainer">
        <input type="text" id="customSubject" placeholder="Please specify your problem">
      </div>
    </div>

    <div class="input-group">
      <label for="description">Text:</label>
      <textarea id="description" placeholder="Describe your problem here"></textarea>
    </div>

    <button type="submit" id="sendBtn">Send Email</button>
  </form>


  <!-- 2. THE BACKGROUND IFRAME ENGINE -->
  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>


  <!-- 3. THE CUSTOM NOTIFICATION BOX -->
  <div id="alertModal" class="custom-modal">
    <div class="modal-content">
      <div id="modalTitle" class="modal-title">Notification</div>
      <div id="modalText" class="modal-text">Message goes here.</div>
      <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

</body>

</html>
