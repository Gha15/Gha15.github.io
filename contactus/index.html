<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contact us - matix the math club</title>
  <!-- Google Fonts Connection -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Pinyon+Script&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Link directly to your separate stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Link directly to your separate script engine -->
  <script src="script.js" defer></script>
</head>
<body>

  <form id="ticketForm" action="https://formspree.io" method="POST" target="hidden_iframe" onsubmit="return validateAndFormat(event)" class="form-container">
    <h2>contact us</h2>
    
    <input type="hidden" id="hiddenSubject" name="_subject">
    <input type="hidden" id="hiddenMessage" name="message">

    <div class="input-group">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" placeholder="Enter your full name">
    </div>

    <div class="input-group">
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="_replyto" placeholder="name@gmail.com">
    </div>

    <div class="input-group">
      <label for="subjectSelect">Kind of Problem:</label>
      <select id="subjectSelect" onchange="toggleOtherInput()">
        <option value="">-- Select an option --</option>
        <option value="Bugs in website">Bugs in website</option>
        <option value="Technical issue">Technical issue</option>
        <option value="Other">Other (text box)</option>
      </select>
      
      <div id="otherSubjectContainer">
        <input type="text" id="customSubject" placeholder="Please specify your problem">
      </div>
    </div>

    <div class="input-group">
      <label for="description">Text:</label>
      <textarea id="description" placeholder="Describe your problem here"></textarea>
    </div>

    <button type="submit" id="sendBtn">Send Email</button>
  </form>

  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

  <div id="alertModal" class="custom-modal">
    <div class="modal-content">
      <div id="modalTitle" class="modal-title">Notification</div>
      <div id="modalText" class="modal-text">Message goes here.</div>
      <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

</body>
</html>
