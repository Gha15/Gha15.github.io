<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <style> .f {fill:#ffffff} .c {fill:#de2c2c} .e {fill:#ffcc00} .w {fill:#808080} .z1 {fill:#ff00ff} .z2 {fill:#b528ff} </style>
  <g class="f"> <!-- Curled body, head tucked -->
    <rect x="2" y="8" width="2" height="4"/><rect x="1" y="9" width="3" height="10"/><rect x="3" y="18" width="13" height="3"/>
    <rect x="12" y="9" width="9" height="6"/><rect x="13" y="7" width="2" height="2"/><rect x="18" y="7" width="2" height="2"/>
    <rect x="4" y="20" width="3" height="1"/><rect x="10" y="20" width="3" height="1"/>
  </g>
  <g class="t"> <rect x="4" y="21" width="2" height="1"/><rect x="10" y="21" width="2" height="1"/></g>
  <rect x="12" y="14" width="7" height="1" class="c"/>
  <rect x="16" y="15" width="1" height="1" fill="#ffcc00"/>
  <g class="n"> <rect x="14" y="8" width="1" height="1"/><rect x="19" y="8" width="1" height="1"/><rect x="16" y="13" width="1" height="1"/></g>
  <g class="w"> <rect x="13" y="12" width="2" height="1"/><rect x="18" y="12" width="2" height="1"/></g> <!-- Closed eyes -->
  <!-- Floating Zzz -->
  <g class="z1"> <rect x="6" y="2" width="3" height="1"/><rect x="8" y="3" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="6" y="5" width="3" height="1"/></g> 
  <g class="z2"> <rect x="3" y="0" width="2" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="3" y="2" width="2" height="1"/></g> 
</svg>
