<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Tree - matix the math club</title>
<link rel="stylesheet" href="/global.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Vibur&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#7ec8ff;--sky2:#c9e8ff;--grass1:#7fc75a;--grass2:#4b9d2b;--ink:#1c2b1a;--mut:#5a6a58;--paper:#f6f1e6;--brown:#7c4a1e;--gold:#fbbf24;--water:#3fa9f5;--grn:#22c55e;--red:#ef4444;--line:#c6d3c3}
*{box-sizing:border-box}
#mt-root,#mt-root *{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
#mt-root{min-height:100vh;background:linear-gradient(180deg,#4aa2f5 0%,#7ec8ff 38%,#c9e8ff 60%,#a8d982 60%,#5eaa32 100%);color:var(--ink);position:relative;overflow-x:hidden;display:flex;flex-direction:column}
.hidden{display:none !important}
.sun{position:absolute;top:6%;right:8%;width:88px;height:88px;background:radial-gradient(circle,#fff7ba 0%,#fbbf24 55%,rgba(251,191,36,0) 75%);border-radius:50%;pointer-events:none;z-index:1;filter:blur(.5px)}
.cloud{position:absolute;background:#fff;border-radius:60px;box-shadow:0 8px 24px rgba(0,0,0,.08);opacity:.92;pointer-events:none;z-index:1}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud.c1{top:10%;left:-220px;width:180px;height:50px;animation:drift 60s linear infinite}
.cloud.c1::before{width:80px;height:80px;top:-40px;left:30px}
.cloud.c1::after{width:100px;height:100px;top:-56px;left:80px}
.cloud.c2{top:22%;left:-260px;width:150px;height:44px;animation:drift 82s linear infinite;animation-delay:-30s;opacity:.85}
.cloud.c2::before{width:70px;height:70px;top:-34px;left:20px}
.cloud.c2::after{width:88px;height:88px;top:-48px;left:65px}
.cloud.c3{top:34%;left:-260px;width:110px;height:36px;animation:drift 70s linear infinite;animation-delay:-15s;opacity:.75}
.cloud.c3::before{width:54px;height:54px;top:-28px;left:14px}
.cloud.c3::after{width:68px;height:68px;top:-38px;left:48px}
@keyframes drift{to{left:110vw}}

.scene{position:relative;z-index:2;height:52vh;min-height:340px;display:flex;align-items:flex-end;justify-content:center;padding:0}
.ground{position:absolute;left:0;right:0;bottom:0;height:26%;min-height:120px;z-index:1;background:linear-gradient(180deg,#86d15a 0%,#5eaa32 42%,#4b9d2b 100%);box-shadow:inset 0 8px 0 rgba(255,255,255,.16),0 -3px 10px rgba(0,0,0,.05)}
.ground::before{content:'';position:absolute;top:-9px;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#6fbf4a 0 10px,#8ad35d 10px 20px);border-radius:40% 40% 0 0}
.pot{position:absolute;bottom:14%;z-index:2;width:340px;max-width:82vw;display:flex;flex-direction:column;align-items:center}
.tree-img{width:100%;max-height:44vh;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 16px rgba(0,0,0,.22));transition:opacity .3s,transform .5s}
.tree-img.faded{opacity:.45;filter:grayscale(1) drop-shadow(0 4px 12px rgba(0,0,0,.15))}
.tree-img.grow{animation:grow .8s cubic-bezier(.22,1.2,.36,1)}
@keyframes grow{0%{transform:scale(.85)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.mound{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);width:210px;max-width:66vw;height:34px;background:radial-gradient(ellipse at center top,#7c4a1e 0%,#5a3814 72%);border-radius:50% 50% 45% 45%/75% 75% 30% 30%;box-shadow:0 6px 14px rgba(0,0,0,.18);z-index:-1}

.dashboard{position:relative;z-index:3;background:rgba(255,255,255,.94);border-top:2px solid rgba(255,255,255,.6);box-shadow:0 -14px 40px rgba(30,60,20,.18);padding:22px 20px 28px;flex:1;margin-top:-1px}
.dashboard-inner{max-width:960px;margin:0 auto;display:grid;gap:18px}
.brand{margin:0;text-align:center;font-family:'Vibur',cursive;font-size:3rem;letter-spacing:2px;line-height:1}
.t-a{color:#4b9d2b;text-shadow:0 3px 6px rgba(75,157,43,.35)}
.t-b{color:#7c4a1e;text-shadow:0 3px 6px rgba(124,74,30,.35)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f2f8ec;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}
.stat .lab{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.stat .val{display:block;margin-top:4px;font-size:1.15rem;font-weight:800;color:var(--ink)}

.bucket-area{display:flex;align-items:center;gap:16px;background:#f2f8ec;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.bucket-img{width:78px;height:78px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.bucket-info{flex:1;min-width:0}
#bucket-status{font-weight:800;color:var(--ink);margin-bottom:6px}
.bar{height:12px;background:#dbe6d3;border-radius:999px;overflow:hidden;margin-bottom:6px}
#bar-fill{height:100%;background:linear-gradient(90deg,#3fa9f5,#22c55e);transition:width .4s;width:0}
#bucket-progress{font-size:.85rem;color:var(--mut);font-weight:700}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:180px;padding:14px 18px;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;color:#fff;letter-spacing:.3px;box-shadow:0 6px 18px rgba(0,0,0,.12);transition:transform .1s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.4)}
.btn-primary{background:linear-gradient(135deg,#4b9d2b,#22c55e)}
.btn-water{background:linear-gradient(135deg,#3fa9f5,#2563eb)}
.btn-mut{background:#8a9a86}
.msg{min-height:1.4em;text-align:center;font-weight:700;padding:2px}
.msg.ok{color:#2f7d21}
.msg.bad{color:#c1272d}

.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,30,20,.72);backdrop-filter:blur(4px)}
.mg-card{width:480px;max-width:95vw;background:#fff;border-radius:20px;padding:26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .3s}
.mg-card.small{width:400px;text-align:center}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.mg-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.mg-header h3{margin:0;color:var(--ink);font-size:1.2rem}
.mg-hud{display:flex;gap:8px}
.pill{background:#f2f8ec;border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-weight:800;font-size:.85rem;color:var(--ink)}
#mg-body{background:#f6faf3;border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.mg-q{font-size:1.8rem;font-weight:800;color:var(--ink);text-align:center;min-height:2em;display:flex;align-items:center;justify-content:center;padding:0 6px}
.mg-inp{width:220px;max-width:100%;padding:14px;border-radius:12px;border:2px solid #d6dce8;background:#fff;color:var(--ink);font-size:1.4rem;font-weight:800;text-align:center;letter-spacing:1px}
.mg-inp:focus{outline:none;border-color:#4b9d2b;box-shadow:0 0 0 3px rgba(75,157,43,.25)}
.mg-fb{min-height:1.4em;font-weight:800;text-align:center}
.mg-fb.ok{color:#22c55e}
.mg-fb.bad{color:#ef4444}
.tf-row{display:flex;gap:12px;justify-content:center;width:100%}
.tf-row .btn{flex:1;max-width:180px;min-width:auto}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:340px}
.opt-btn{padding:14px;border:2px solid #d6dce8;border-radius:12px;background:#fff;color:var(--ink);font-size:1.15rem;font-weight:800;cursor:pointer;transition:background .1s,border-color .1s}
.opt-btn:hover{border-color:#4b9d2b;background:#f0f9e8}
.mg-footer{display:flex;justify-content:flex-end}

#round-title{margin:0 0 6px;font-size:1.4rem;color:var(--ink)}
#round-sub{color:var(--mut);margin:0 0 16px}

@media (max-width:720px){
  .scene{height:44vh;min-height:280px;padding:14px 14px 0}
  .tree-img{max-height:38vh}
  .brand{font-size:2.3rem}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat .val{font-size:1rem}
  .stat:nth-child(3){grid-column:span 2}
  .bucket-img{width:60px;height:60px}
  .actions{flex-direction:column;gap:8px}
  .btn{min-width:auto;width:100%}
  .mg-q{font-size:1.4rem}
  .mg-card{padding:22px 18px}
  .tf-row .btn{max-width:none}
  .dashboard{padding:18px 14px 26px}
}
@media (max-width:420px){
  .brand{font-size:2rem}
  .stat .val{font-size:.95rem}
  .stat .lab{font-size:.66rem}
  .mg-q{font-size:1.25rem}
  .opt-grid{grid-template-columns:1fr 1fr}
}
/* ===== PIXEL MINIGAMES ===== */
.tree-img,.bucket-img{image-rendering:pixelated}
.pixel{image-rendering:pixelated}
.pixel.overlay{background:rgba(20,30,20,.78)}
.pixel .mg-card{font-family:'Pixelify Sans','Trebuchet MS',sans-serif;background:#fffdf5;color:#2b2b3a;border-radius:0;border:0;box-shadow:0 0 0 3px #2b2b3a,0 0 0 7px #7fc75a,0 0 0 10px #2b2b3a,10px 10px 0 rgba(0,0,0,.18)}
.pixel .mg-header h3{font-family:'Pixelify Sans',sans-serif;color:#3a6b1f;font-size:1.2rem;letter-spacing:.5px;text-shadow:none}
.pixel .pill{font-family:'Pixelify Sans',sans-serif;background:#eef7e6;border:2px solid #3a6b1f;color:#3a6b1f;border-radius:0;box-shadow:2px 2px 0 rgba(0,0,0,.25);font-size:.85rem}
.pixel #mg-body{background:#f3f7ee;border:3px solid #2b2b3a;border-radius:0;box-shadow:inset 3px 3px 0 rgba(0,0,0,.05)}
.pixel .mg-q{font-family:'Pixelify Sans',sans-serif;color:#2b2b3a;font-size:1.6rem;line-height:1.4;white-space:normal;text-shadow:none}
.pixel .mg-inp{font-family:'Pixelify Sans',sans-serif;background:#fff;color:#2b2b3a;border:3px solid #2b2b3a;border-radius:0;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.pixel .mg-inp:focus{outline:none;border-color:#3a6b1f;box-shadow:3px 3px 0 rgba(58,107,31,.4)}
.pixel .mg-fb{font-family:'Pixelify Sans',sans-serif;font-size:1rem}
.pixel .mg-fb.ok{color:#2f7d21}
.pixel .mg-fb.bad{color:#c1272d}
.pixel .btn{font-family:'Pixelify Sans',sans-serif;border-radius:0;box-shadow:4px 4px 0 rgba(0,0,0,.3);letter-spacing:.5px;text-transform:none}
.pixel .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(0,0,0,.3);filter:none}
.pixel #round-title{font-family:'Pixelify Sans',sans-serif;text-shadow:none}
.pixel #round-sub{font-family:'Pixelify Sans',sans-serif}
.pgrid{display:grid;gap:8px;width:100%;max-width:340px;margin:0 auto}
.ptile{font-family:'Pixelify Sans',sans-serif;padding:14px 4px;border:3px solid #2b2b3a;background:#fff;box-shadow:3px 3px 0 rgba(0,0,0,.2);font-size:1.1rem;font-weight:700;cursor:pointer;text-align:center;color:#2b2b3a}
.ptile:hover{background:#eef7e6}
.ptile.good{background:#7fc75a;color:#fff;border-color:#3a6b1f}
.ptile.bad{background:#ef4444;color:#fff;border-color:#991b1b}
.ptile.off{pointer-events:none}
.pbig{font-family:'Pixelify Sans',sans-serif;font-size:2.4rem;letter-spacing:6px;color:#2b2b3a;text-align:center}
.pmole{position:relative;width:100%;height:160px}
.pmole .ptile{position:absolute;width:64px}
@media (max-width:720px){
  .pixel .mg-q{font-size:1.3rem}
  .pixel .mg-header h3{font-size:1rem}
  .ptile{font-size:1rem;padding:12px 3px}
  .pbig{font-size:1.9rem}
}
</style>
</head>
<body>
<div id="mt-root">
  <div class="scene">
    <div class="ground"></div>
    <div class="sun"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="pot">
      <img id="tree-img" class="tree-img faded" src="seed.svg" alt="Your plant">
      <div class="mound"></div>
    </div>
  </div>

  <div class="dashboard">
    <div class="dashboard-inner">
      <h1 class="brand"><span class="t-a">MATH</span> <span class="t-b">TREE</span></h1>
      <div class="stats">
        <div class="stat"><span class="lab">Stage</span><span class="val" id="stage-name">—</span></div>
        <div class="stat"><span class="lab">Buckets watered</span><span class="val" id="buckets-total">0</span></div>
        <div class="stat"><span class="lab">Water deadline</span><span class="val" id="water-timer">—</span></div>
      </div>
      <div class="bucket-area">
        <img id="bucket-img" class="bucket-img" src="bucket1.svg" alt="Bucket">
        <div class="bucket-info">
          <div id="bucket-status">Loading…</div>
          <div class="bar"><div id="bar-fill"></div></div>
          <div id="bucket-progress">0 / 3 minigames</div>
        </div>
      </div>
      <div class="actions">
        <button id="play-btn" class="btn btn-primary">🎮 Play a minigame</button>
        <button id="water-btn" class="btn btn-water" disabled>💧 Water tree</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <div id="mg-overlay" class="overlay pixel hidden">
    <div class="mg-card">
      <div class="mg-header">
        <h3 id="mg-title">Minigame</h3>
        <div class="mg-hud">
          <span class="pill" id="mg-progress">0 / 0</span>
          <span class="pill" id="mg-timer">30s</span>
        </div>
      </div>
      <div id="mg-body"></div>
      <div class="mg-footer"><button id="mg-quit" class="btn btn-mut" style="min-width:120px">Quit</button></div>
    </div>
  </div>

  <div id="round-overlay" class="overlay pixel hidden">
    <div class="mg-card small">
      <h3 id="round-title"></h3>
      <p id="round-sub"></p>
      <button id="round-ok" class="btn btn-primary">OK</button>
    </div>
  </div>

  <div id="death-overlay" class="overlay hidden">
    <div class="mg-card small">
      <h3>💀 Your tree withered</h3>
      <p style="color:var(--mut)">More than 24 hours without water. You lost this tree and all progress on it.</p>
      <p><b>Play 5 minigames</b> to earn a new seed and start again.</p>
      <button id="death-restart" class="btn btn-primary">Start over</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
(function(){
  'use strict';
  function $(id){return document.getElementById(id);}
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function opsym(o){return o==='*'?'×':(o==='-'?'−':'+');}

  var db=null,fbOk=false;
  try{
    if(window.firebase){
      if(!firebase.apps.length)firebase.initializeApp({apiKey:'AIzaSyBmJOS_aaOVADbu5cACUoeXHrjfpHTBTdo',authDomain:'matix-1d538.firebaseapp.com',databaseURL:'https://matix-1d538-default-rtdb.firebaseio.com',projectId:'matix-1d538'});
      db=firebase.database();fbOk=true;
    }
  }catch(e){fbOk=false;}
  function currentSiteUser(){try{return sessionStorage.getItem('mx_user')||sessionStorage.getItem('matix_auth_user')||'anon';}catch(e){return 'anon';}}
  function stateKey(){return 'mathtree_state_'+currentSiteUser();}

  var DAY_MS=24*60*60*1000;
  var GAMES_PER_SEED=5;
  var GAMES_PER_BUCKET=3;
  var BUCKETS_TO_SAPLING=2;
  var BUCKETS_TO_MATURE=5;

  function defaultState(){return {stage:0,seedProgress:0,bucketProgress:0,totalBuckets:0,lastWaterAt:0,lifetimePoints:0,treesGrown:0,gamesPlayed:0,hasPlanted:false};}
  function loadState(){try{var s=localStorage.getItem(stateKey());if(s){var o=JSON.parse(s);var d=defaultState();for(var k in d)if(o[k]===undefined)o[k]=d[k];return o;}}catch(e){}return defaultState();}
  function saveState(){try{localStorage.setItem(stateKey(),JSON.stringify(state));}catch(e){}}

  var state=loadState();
  if(state.stage===0&&!state.hasPlanted&&state.totalBuckets===0&&state.treesGrown===0){
    state.stage=1;
    state.lastWaterAt=Date.now();
    state.hasPlanted=true;
    saveState();
  }

  function checkDeath(){
    if(state.stage>=1&&state.lastWaterAt>0&&Date.now()-state.lastWaterAt>DAY_MS){
      state.stage=0;state.seedProgress=0;state.bucketProgress=0;state.totalBuckets=0;state.lastWaterAt=0;
      saveState();return true;
    }
    return false;
  }

  function stageName(){
    if(state.stage===0)return state.seedProgress>0?'Earning a seed':'No tree';
    if(state.stage===1)return 'Seed';
    if(state.stage===2)return 'Sapling';
    return 'Mature tree 🌳';
  }
  function treeImg(){
    if(state.stage<=0)return 'seed.svg';
    if(state.stage===1)return 'seed.svg';
    if(state.stage===2)return 'tree.svg';
    return 'tree2.svg';
  }
  function bucketImg(){
    var p=state.bucketProgress;
    if(p<=0)return 'bucket1.svg';
    if(p===1)return 'bucket2.svg';
    if(p===2)return 'bucket3.svg';
    return 'bucket4.svg';
  }

  function renderAll(){
    if(checkDeath()){$('death-overlay').classList.remove('hidden');}
    var img=$('tree-img');img.src=treeImg();img.classList.toggle('faded',state.stage===0);
    $('stage-name').textContent=stageName();
    $('buckets-total').textContent=state.totalBuckets;
    $('bucket-img').src=bucketImg();
    updateBucketInfo();updateWaterTimer();updateButtons();
  }

  function updateBucketInfo(){
    if(state.stage===0){
      $('bucket-status').textContent='Play '+GAMES_PER_SEED+' minigames to earn a seed';
      $('bucket-progress').textContent=state.seedProgress+' / '+GAMES_PER_SEED+' minigames';
      $('bar-fill').style.width=Math.min(100,(state.seedProgress/GAMES_PER_SEED)*100)+'%';
    }else{
      var full=(state.bucketProgress>=GAMES_PER_BUCKET);
      $('bucket-status').textContent=full?'💧 Full bucket — water the tree!':'Fill the bucket by playing minigames';
      $('bucket-progress').textContent=state.bucketProgress+' / '+GAMES_PER_BUCKET+' minigames';
      $('bar-fill').style.width=Math.min(100,(state.bucketProgress/GAMES_PER_BUCKET)*100)+'%';
    }
  }

  function updateWaterTimer(){
    var t=$('water-timer');
    if(state.stage===0||state.lastWaterAt===0){t.textContent='—';t.style.color='';return;}
    var remaining=DAY_MS-(Date.now()-state.lastWaterAt);
    if(remaining<=0){t.textContent='Dried up!';t.style.color='#c1272d';return;}
    var h=Math.floor(remaining/3600000);
    var m=Math.floor((remaining%3600000)/60000);
    t.textContent=h+'h '+m+'m';
    t.style.color=(remaining<3600000)?'#c1272d':(remaining<6*3600000?'#b45309':'');
  }
  setInterval(function(){updateWaterTimer();if(checkDeath())renderAll();},30000);

  function updateButtons(){
    var play=$('play-btn');var water=$('water-btn');
    if(state.stage===0){play.textContent='🎮 Play (earn a seed)';water.disabled=true;water.textContent='💧 Plant a seed first';}
    else if(state.bucketProgress>=GAMES_PER_BUCKET){play.textContent='🎮 Play a minigame';water.disabled=false;water.textContent='💧 Water tree (use bucket)';}
    else{play.textContent='🎮 Play a minigame';water.disabled=true;water.textContent='💧 Fill the bucket first';}
  }

  // ========= MINIGAMES =========
  var currentMg=null,mgTimerId=null,mgTimeLeft=0,mgActive=false,mgOnDone=null,mgEnded=false,mgGot=0,mgNeed=1;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function fb(t,ok){var f=$('mg-fb');if(f){f.textContent=t;f.className='mg-fb '+(ok?'ok':'bad');}}
  function digitSum(n){var s=0;n=Math.abs(n);while(n){s+=n%10;n=Math.floor(n/10);}return s;}
  function isPrimeN(n){if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}

  // ========= ACTIONS =========
  function onMinigameDone(passed){
    state.gamesPlayed++;
    if(!passed){msg('Minigame lost. Give it another go!','bad');saveState();recordScore();return;}
    state.lifetimePoints+=1;
    if(state.stage===0){
      state.seedProgress++;
      state.hasPlanted=true;
      if(state.seedProgress>=GAMES_PER_SEED){
        state.stage=1;state.seedProgress=0;state.bucketProgress=0;
        state.lastWaterAt=Date.now();state.lifetimePoints+=10;
        msg('🌱 You planted a seed! Water it within 24h.','ok');
      }else{
        msg('Progress: '+state.seedProgress+' / '+GAMES_PER_SEED+' toward a new seed','ok');
      }
    }else{
      state.bucketProgress++;
      if(state.bucketProgress>=GAMES_PER_BUCKET)msg('🪣 Bucket full! Tap "Water tree".','ok');
      else msg('Bucket: '+state.bucketProgress+' / '+GAMES_PER_BUCKET+' — keep going!','ok');
    }
    saveState();recordScore();renderAll();
  }

  function waterTree(){
    if(state.stage===0||state.bucketProgress<GAMES_PER_BUCKET)return;
    state.bucketProgress=0;state.totalBuckets++;state.lastWaterAt=Date.now();state.lifetimePoints+=3;
    var prev=state.stage;
    if(state.stage===1&&state.totalBuckets>=BUCKETS_TO_SAPLING){state.stage=2;state.lifetimePoints+=10;}
    if(state.stage===2&&state.totalBuckets>=BUCKETS_TO_MATURE){state.stage=3;state.lifetimePoints+=50;state.treesGrown++;}
    saveState();recordScore();
    renderAll();
    var img=$('tree-img');img.classList.remove('grow');void img.offsetWidth;img.classList.add('grow');
    if(state.stage>prev)msg('🌳 Your tree grew! Now: '+stageName()+'.','ok');
    else if(state.stage===3)msg('🎉 Mature tree kept alive! Keep watering.','ok');
    else msg('💧 Watered! 24h until next deadline.','ok');
  }

  function msg(text,cls){var m=$('msg');m.textContent=text;m.className='msg '+(cls||'');clearTimeout(m._t);m._t=setTimeout(function(){if(m.textContent===text){m.textContent='';m.className='msg';}},6000);}

  function recordScore(){
    if(!fbOk)return;
    var user=currentSiteUser();if(!user||user==='anon')return;
    var key=user.toLowerCase().replace(/\s+/g,'');
    try{db.ref('mathtree_scores/'+key).push({points:state.lifetimePoints,buckets:state.totalBuckets,trees:state.treesGrown,stage:state.stage,at:Date.now()});}catch(e){}
  }

  $('play-btn').addEventListener('click',function(){startMinigame(onMinigameDone);});
  $('water-btn').addEventListener('click',waterTree);
  $('mg-quit').addEventListener('click',quitMg);
  $('round-ok').addEventListener('click',function(){$('round-overlay').classList.add('hidden');});
  $('death-restart').addEventListener('click',function(){$('death-overlay').classList.add('hidden');msg('Play 5 minigames to earn a new seed.','ok');});

  renderAll();
})();
