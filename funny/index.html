<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokes / memes - matix the math club</title>
    <link rel="stylesheet" href="/funny/styles.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div class="bg-grid"></div>
  <header class="topbar">
    <a class="back-link" href="/">Back</a>
    <h1>MATIX Meme Lab</h1>
    <p>Pick a username, post title/content memes or Q&A memes, and chat globally or inside each meme.</p>
  </header>

  <main class="layout">
    <section class="panel username-panel">
      <h2>Pick Username</h2>
      <p class="small-note">This name is used for posting memes and chatting.</p>
      <form id="username-form" autocomplete="off">
        <label for="username-input">Username</label>
        <input id="username-input" maxlength="20" placeholder="your_name" required>
        <button type="submit">Save Username</button>
      </form>
      <p class="form-hint" id="username-hint"></p>
    </section>

    <section class="panel meme-submit-panel">
      <h2>Add A Meme Here</h2>
      <form id="meme-form" autocomplete="off">
        <label for="meme-type">Meme Type</label>
        <select id="meme-type">
          <option value="standard">Title + Content</option>
          <option value="qna">Title + Q and A</option>
        </select>

        <label for="meme-title">Title</label>
        <input id="meme-title" maxlength="120" placeholder="Meme title" required>

        <label for="meme-content">Content</label>
        <textarea id="meme-content" maxlength="500" rows="4" placeholder="Write the meme content" required></textarea>

        <div id="meme-qna-fields" class="qna-fields hidden">
          <label for="meme-question">Question</label>
          <input id="meme-question" maxlength="180" placeholder="Q">

          <label for="meme-answer">Answer</label>
          <textarea id="meme-answer" maxlength="300" rows="3" placeholder="A"></textarea>
        </div>

        <button type="submit">Post Meme</button>
        <p class="form-hint" id="meme-form-hint"></p>
      </form>
    </section>

    <section class="panel meme-feed-panel">
      <div class="panel-head">
        <h2>Meme Feed</h2>
        <span id="meme-count">0 memes</span>
      </div>
      <div id="meme-feed" class="meme-feed"></div>
    </section>

    <section class="panel chat-panel">
      <div class="panel-head">
        <h2>Global Meme Chat</h2>
        <span id="chat-status">Live</span>
      </div>
      <div id="chat-list" class="chat-list"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="220" placeholder="Drop a message..." required>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="/theme-loader.js"></script>
  <script src="script.js"></script>
<script src="/nav.js" defer></script>
</body>
</html>
